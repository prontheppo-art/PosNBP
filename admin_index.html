<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <title>ผู้ดูแลระบบ - ลาบหนองบัวลำภู</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      :root {
        --bg-color: #f8fafc;
      }

      /* CSS เฉพาะของ UI แอป */
      html, body { 
          height: 100%; 
          margin: 0; 
          padding: 0; 
          overflow: hidden; 
          font-family: 'Sarabun', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
          background-color: var(--bg-color); 
          touch-action: manipulation; 
          -webkit-text-size-adjust: 100%;
          -webkit-tap-highlight-color: transparent;
          user-select: none;
      }

      .app-container { 
          max-width: 500px; 
          margin: 0 auto; 
          height: 100dvh; 
          background: #ffffff; 
          display: grid; 
          grid-template-rows: auto 1fr; 
          box-sizing: border-box; 
          overflow: hidden;
      }

      ::-webkit-scrollbar {
        display: none;
      }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center antialiased">

    <div class="app-container shadow-2xl w-full border border-slate-100">
        
        <!-- Header Section (Fixed Top) -->
        <div class="py-4 px-4 bg-white border-b border-slate-100 text-center shrink-0 shadow-2xs">
            <div class="text-3xl mb-1">🔓</div>
            <h1 class="font-black text-lg text-slate-800 tracking-tight">
                ผู้ดูแลระบบ
            </h1>
            <p class="text-[11px] text-slate-400 font-medium mt-0.5">จัดการระบบร้านอาหารและตรวจสอบข้อมูล</p>
        </div>

        <!-- Menu List Section (Scroll/Flex Area) -->
        <div class="p-3 bg-slate-100 flex flex-col justify-between gap-2 overflow-y-auto" style="-webkit-overflow-scrolling: touch;">
            
            <!-- 1. จัดการรายการอาหาร & ราคา -->
            <a href="managemenu.html" class="flex-1 min-h-[48px] bg-amber-600 hover:bg-amber-700 active:scale-98 text-white font-bold rounded-xl text-sm flex items-center justify-center gap-2 shadow-xs transition no-underline px-3">
                <span>📋 จัดการรายการอาหาร & ราคา</span>
            </a>

            <!-- 2. จัดการกลุ่มอาหาร -->
            <a href="managefoodgroups.html" class="flex-1 min-h-[48px] bg-amber-500 hover:bg-amber-600 active:scale-98 text-white font-bold rounded-xl text-sm flex items-center justify-center gap-2 shadow-xs transition no-underline px-3">
                <span>📁 จัดการกลุ่มอาหาร</span>
            </a>
            
            <!-- 3. จัดการสูตรอาหาร & วัตถุดิบ -->
            <a href="foodmapping.html" class="flex-1 min-h-[48px] bg-teal-600 hover:bg-teal-700 active:scale-98 text-white font-bold rounded-xl text-sm flex items-center justify-center gap-2 shadow-xs transition no-underline px-3">
                <span>🔗 จัดการสูตรอาหาร & วัตถุดิบ</span>
            </a>

            <!-- 4. จัดการและแก้ไขบิล -->
            <a href="editbill.html" class="flex-1 min-h-[48px] bg-blue-600 hover:bg-blue-700 active:scale-98 text-white font-bold rounded-xl text-sm flex items-center justify-center gap-2 shadow-xs transition no-underline px-3">
                <span>📝 จัดการและแก้ไขบิล</span>
            </a>
            
            <!-- 5. เปลี่ยนรหัสผ่านแอดมิน -->
            <a href="changepwd.html" class="flex-1 min-h-[48px] bg-slate-700 hover:bg-slate-800 active:scale-98 text-white font-bold rounded-xl text-sm flex items-center justify-center gap-2 shadow-xs transition no-underline px-3">
                <span>🔑 เปลี่ยนรหัสผ่านแอดมิน</span>
            </a>
            
            <!-- 6. กลับหน้าหลัก -->
            <a href="index.html" class="flex-1 min-h-[48px] bg-rose-500 hover:bg-rose-600 active:scale-98 text-white font-bold rounded-xl text-sm flex items-center justify-center gap-2 shadow-xs transition no-underline px-3">
                <span>🏠 กลับหน้าหลัก</span>
            </a>

        </div>

    </div>

    <script>
        // ป้องกัน Gesture Pinch Zoom บน iOS
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });

        // ป้องกัน Double Tap Zoom
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });

        // ป้องกัน Multi-touch
        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
