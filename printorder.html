<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>รายการอาหาร - ลาบหนองบัวลำภู</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap');
        
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Sarabun', sans-serif; 
            background-color: #f1f5f9;
            user-select: none;
            -webkit-user-select: none;
        }

        .app-viewport {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 420px;
            margin: 0 auto;
            padding: 12px;
            box-sizing: border-box;
        }

        .print-card {
            background-color: #ffffff;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
            justify-content: space-between;
        }

        .header-section {
            flex-shrink: 0;
        }

        .content-scrollable {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .items-box-container {
            border: 2px solid #0f172a;
            border-radius: 16px;
            padding: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            margin-bottom: 8px;
        }

        .scrollable-items {
            flex: 1;
            overflow-y: auto;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            padding-right: 2px;
        }

        .footer-section {
            flex-shrink: 0;
        }

        @media print {
            html, body {
                height: auto !important;
                overflow: visible !important;
                background-color: #ffffff !important;
            }

            .app-viewport {
                max-width: 100% !important;
                height: auto !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .print-card {
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
                padding: 0 !important;
                height: auto !important;
                display: block !important;
            }

            .items-box-container {
                border: 2px solid #0f172a !important;
                border-radius: 16px !important;
                overflow: visible !important;
                height: auto !important;
                flex: none !important;
            }

            .scrollable-items {
                overflow: visible !important;
                height: auto !important;
            }

            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="app-viewport">
        <div class="print-card">
            
            <!-- 🟢 ส่วนที่ 1: หัวกระดาษ (ยึดติดบน) -->
            <div class="header-section text-center mb-3">
                <h2 class="font-extrabold text-slate-800 text-lg leading-tight">ลาบหนองบัวลำภู @เขื่อนขุนด่าน</h2>
                <p class="text-xs text-slate-500 font-semibold mt-0.5">064-565-4951</p>
                <p class="text-xs text-slate-700 font-bold mt-1">
                    รายการอาหาร<span id="customerGroupWrapper"> ( <span id="customerGroupLabel">-</span> )</span>
                </p>
            </div>

            <!-- 🟡 ส่วนที่ 2: เนื้อหาตรงกลาง (ยืดหยุ่น + สกอร์ได้ถ้าเกินจอ) -->
            <div class="content-scrollable">
                <!-- กรอบรายการอาหาร -->
                <div class="items-box-container">
                    <div class="scrollable-items">
                        <div id="itemListContainer" class="w-full space-y-1.5">
                            <p class="text-slate-300 font-bold text-center text-sm my-auto py-6">ไม่มีรายการอาหาร</p>
                        </div>
                    </div>
                </div>

                <!-- หมายเหตุออเดอร์ (ถ้ามี) -->
                <div id="orderNoteContainer" class="hidden shrink-0 mb-2 p-2 bg-amber-50 border border-amber-200 rounded-xl text-xs font-semibold text-amber-900">
                    <span>📝 หมายเหตุ: </span><span id="orderNoteText"></span>
                </div>

                <!-- สรุปจำนวนและราคารวม -->
                <div class="flex items-center justify-between border-b-2 border-dashed border-slate-200 pb-2.5 mb-2 shrink-0">
                    <div class="border border-slate-800 rounded-lg px-2.5 py-1">
                        <span id="summaryQty" class="font-extrabold text-xs text-slate-800">0 รายการ | 0 ชิ้น</span>
                    </div>
                    <div class="text-right">
                        <span class="font-extrabold text-base text-slate-900">รวม <span id="summaryTotal">0</span> บาท</span>
                    </div>
                </div>

                <!-- ส่วน QR Code (แสดงเฉพาะกลุ่มนักท่องเที่ยว) -->
                <div id="touristOnlySection" class="hidden text-center shrink-0 my-1">
                    <p class="text-xs font-bold text-slate-700 mb-0.5">⭐ ขอบพระคุณที่อุดหนุนค่ะ ⭐</p>
                    <p class="text-[10px] text-slate-500 font-semibold mb-1">แนะนำ ติชม ได้นะคะ 🙏</p>
                    <div class="flex justify-center mb-1">
                        <div class="p-1 border border-slate-300 rounded-xl bg-white shadow-sm">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=ลาบหนองบัวลำภู" alt="QR Code" class="w-20 h-20 object-contain">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 🟢 ส่วนที่ 3: ปุ่มกดด้านล่าง (ยึดติดล่าง) -->
            <div class="footer-section no-print pt-2 border-t border-slate-100">
                <div class="grid grid-cols-2 gap-2">
                    <!-- ปุ่มที่ 1: บันทึก -->
                    <button type="button" id="saveOnlyBtn" onclick="handleSaveOrder(false)" class="w-full py-2.5 bg-slate-700 hover:bg-slate-800 active:scale-95 text-white font-extrabold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-1.5">
                        <span>💾</span>
                        <span id="saveBtnText">บันทึก</span>
                    </button>

                    <!-- ปุ่มที่ 2: บันทึก / พิมพ์ -->
                    <button type="button" id="saveAndPrintBtn" onclick="handleSaveOrder(true)" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 active:scale-95 text-white font-extrabold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-1.5">
                        <span>🖨️</span>
                        <span id="printBtnText">บันทึก / พิมพ์</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- ดึงไฟล์เชื่อมต่อ Supabase -->
    <script src="key.js"></script>
    <script>
        let currentOrderData = null;

        window.addEventListener('DOMContentLoaded', () => {
            loadOrderData();
        });

        function loadOrderData() {
            const pendingOrderRaw = localStorage.getItem('pendingOrder');
            if (!pendingOrderRaw) return;

            currentOrderData = JSON.parse(pendingOrderRaw);
            const cart = currentOrderData.cart || [];
            const groupId = Number(currentOrderData.groupId || currentOrderData.customerGroupId) || 1;

            // 1. จัดการแสดงผล QR Code (แสดงเฉพาะกลุ่มนักท่องเที่ยว groupId = 2)
            const touristSection = document.getElementById('touristOnlySection');
            if (touristSection) {
                if (groupId === 2) {
                    touristSection.classList.remove('hidden');
                } else {
                    touristSection.classList.add('hidden');
                }
            }

            // 2. จัดการแสดงผลกลุ่มลูกค้า / สถานที่ (ซ่อนถ้ารูปแบบเป็น ชาวบ้าน หรือ สบายดี)
            const groupWrapper = document.getElementById('customerGroupWrapper');
            const groupLabel = document.getElementById('customerGroupLabel');

            if (groupId === 2) {
                // กลุ่มนักท่องเที่ยว -> แสดงชื่อสถานที่ / ห้อง
                let locDetails = [];
                if (currentOrderData.locationName) locDetails.push(currentOrderData.locationName);
                if (currentOrderData.zoneName && currentOrderData.zoneName !== currentOrderData.locationName) {
                    locDetails.push(currentOrderData.zoneName);
                }

                let groupDisplay = locDetails.join(' - ') || 'นักท่องเที่ยว';
                const phoneNum = currentOrderData.customerPhone || currentOrderData.phone;
                if (phoneNum) {
                    groupDisplay += ` โทร: ${phoneNum}`;
                }

                if (groupLabel) groupLabel.textContent = groupDisplay;
                if (groupWrapper) groupWrapper.classList.remove('hidden');
            } else {
                // กลุ่มชาวบ้าน (1) หรือ สบายดี (3) -> ซ่อนวงเล็บ ไม่นำมาลง
                if (groupWrapper) groupWrapper.classList.add('hidden');
            }

            // 3. แสดงหมายเหตุออเดอร์ (ถ้ามี)
            const noteVal = currentOrderData.orderNote || currentOrderData.note;
            if (noteVal) {
                const noteContainer = document.getElementById('orderNoteContainer');
                const noteText = document.getElementById('orderNoteText');
                if (noteContainer && noteText) {
                    noteText.textContent = noteVal;
                    noteContainer.classList.remove('hidden');
                }
            }

            // 4. แสดงรายการอาหาร
            renderItemList(cart, groupId, currentOrderData.deliveryFee || currentOrderData.delivery_fee || 0, currentOrderData.grandTotal || currentOrderData.total_price || 0);
        }

        function renderItemList(cart, groupId, deliveryFee, grandTotal) {
            const container = document.getElementById('itemListContainer');
            const summaryQtyEl = document.getElementById('summaryQty');
            const summaryTotalEl = document.getElementById('summaryTotal');

            if (!container) return;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-slate-300 font-bold text-center text-sm my-auto py-6">ไม่มีรายการอาหาร</p>`;
                if (summaryQtyEl) summaryQtyEl.textContent = `0 รายการ | 0 ชิ้น`;
                if (summaryTotalEl) summaryTotalEl.textContent = `0`;
                return;
            }

            let totalItems = cart.length;
            let totalQty = 0;
            let html = '';

            cart.forEach(item => {
                const qty = Number(item.qty) || 1;
                const gId = Number(groupId) || 1;
                
                let basePrice = 0;

                // 1. ถ้ามีการระบุราคาพิเศษเอง (Custom Price)
                if ((item.is_custom_price || item.isCustomPrice) && Number(item.custom_price || item.price) > 0) {
                    basePrice = Number(item.custom_price || item.price);
                } else {
                    // 2. ตรวจสอบตามกลุ่มลูกค้า (gId 1=price_1, gId 2=price_2, gId 3=price_3)
                    if (gId === 1) {
                        basePrice = Number(item.price_1 ?? item.price1 ?? item.price ?? 0);
                    } else if (gId === 2) {
                        basePrice = Number(item.price_2 ?? item.price2 ?? item.price ?? 0);
                    } else if (gId === 3) {
                        basePrice = Number(item.price_3 ?? item.price3 ?? item.price ?? 0);
                    } else {
                        basePrice = Number(item.price ?? 0);
                    }
                    
                    // 3. Fallback
                    if (basePrice === 0) {
                        basePrice = Number(item.price ?? item.unit_price ?? item.base_price ?? 0);
                    }
                }

                const eggCost = (Number(item.fried_egg || item.khaiDaoQty) || 0) * 10;
                const omeletCost = (Number(item.omelet || item.khaiJiaoQty) || 0) * 10;
                const unitPrice = basePrice + eggCost + omeletCost;
                const itemTotal = unitPrice * qty;

                totalQty += qty;

                let itemSubDetails = [];
                if (item.fried_egg > 0 || item.khaiDaoQty > 0) itemSubDetails.push(`ไข่ดาว`);
                if (item.omelet > 0 || item.khaiJiaoQty > 0) itemSubDetails.push(`ไข่เจียว`);
                if (item.note) itemSubDetails.push(item.note);

                html += `
                <div class="flex justify-between items-start text-xs font-bold text-slate-800 py-0.5">
                    <div class="flex-1 pr-2 flex items-start gap-1">
                        <span class="shrink-0 text-slate-600">x${qty}</span>
                        <div>
                            <span class="block truncate max-w-[150px]">${item.name || item.food_name}</span>
                            ${itemSubDetails.length > 0 ? `<span class="block text-[10px] text-slate-500 font-normal">(${itemSubDetails.join(', ')})</span>` : ''}
                        </div>
                    </div>
                    <span class="shrink-0 text-center min-w-[50px] text-slate-500 font-semibold">${unitPrice}.-</span>
                    <span class="shrink-0 text-right min-w-[50px] font-extrabold text-slate-900">${itemTotal}.-</span>
                </div>
                `;
            });

            if (Number(deliveryFee) > 0) {
                html += `
                <div class="flex justify-between items-center text-xs font-bold text-slate-700 pt-1 border-t border-slate-200 mt-1">
                    <span>🛵 ค่าบริการจัดส่ง</span>
                    <span>${deliveryFee}.-</span>
                </div>
                `;
            }

            container.innerHTML = html;
            if (summaryQtyEl) summaryQtyEl.textContent = `${totalItems} รายการ | ${totalQty} ชิ้น`;
            if (summaryTotalEl) summaryTotalEl.textContent = Number(grandTotal).toLocaleString();
        }

        async function handleSaveOrder(shouldPrint = false) {
            if (!currentOrderData) {
                window.location.href = 'index.html';
                return;
            }

            const btnSave = document.getElementById('saveOnlyBtn');
            const btnSavePrint = document.getElementById('saveAndPrintBtn');
            const saveText = document.getElementById('saveBtnText');
            const printText = document.getElementById('printBtnText');

            try {
                btnSave.disabled = true;
                btnSavePrint.disabled = true;
                if (shouldPrint && printText) printText.textContent = 'กำลังบันทึก...';
                if (!shouldPrint && saveText) saveText.textContent = 'กำลังบันทึก...';

                if (typeof supabaseClient !== 'undefined') {
                    const totalQty = (currentOrderData.cart || []).reduce((sum, item) => sum + (Number(item.qty) || 1), 0);

                    const now = new Date();
                    const tzOffset = 7 * 60;
                    const localTime = new Date(now.getTime() + (tzOffset + now.getTimezoneOffset()) * 60000);

                    const year = localTime.getFullYear();
                    const month = String(localTime.getMonth() + 1).padStart(2, '0');
                    const day = String(localTime.getDate()).padStart(2, '0');
                    const hours = String(localTime.getHours()).padStart(2, '0');
                    const minutes = String(localTime.getMinutes()).padStart(2, '0');
                    const seconds = String(localTime.getSeconds()).padStart(2, '0');

                    const todayStr = `${year}-${month}-${day}`;
                    const timestampStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

                    const insertPayload = {
                        customer_group: currentOrderData.groupName || currentOrderData.customerGroup || 'ชาวบ้าน',
                        customer_group_id: currentOrderData.groupId || currentOrderData.customerGroupId || 1,
                        phone: currentOrderData.customerPhone || currentOrderData.phone || '',
                        customer_phone: currentOrderData.customerPhone || currentOrderData.phone || '',
                        location_id: currentOrderData.locationId || null,
                        location_name: currentOrderData.locationName || null,
                        zone_id: currentOrderData.zoneId || null,
                        zone_name: currentOrderData.zoneName || null,
                        note: currentOrderData.orderNote || currentOrderData.note || '',
                        subtotal: currentOrderData.subtotal || 0,
                        delivery_fee: currentOrderData.deliveryFee || currentOrderData.delivery_fee || 0,
                        total_price: currentOrderData.grandTotal || currentOrderData.total_price || 0,
                        total_qty: totalQty,
                        items: currentOrderData.cart || [],
                        order_date: todayStr,
                        created_at: timestampStr,
                        status: 'completed'
                    };

                    const { error } = await supabaseClient
                        .from('orders')
                        .insert([insertPayload]);

                    if (error) console.error('Supabase Insert Warning:', error);
                }

                if (shouldPrint) {
                    window.print();
                }

            } catch (err) {
                console.error('Save Order Error:', err);
            } finally {
                localStorage.removeItem('pendingOrder');
                localStorage.removeItem('cart');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
