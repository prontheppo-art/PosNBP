<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>ศูนย์รวมรายงานการขาย - ลาบหนองบัวลำภู</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #f4f6f9;
        touch-action: pan-y;
        -webkit-text-size-adjust: 100%;
        -webkit-user-select: none;
        user-select: none;
      }

      .app-layout {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        max-width: 480px;
        margin: 0 auto;
        background: #fff;
        box-sizing: border-box;
        overflow: hidden;
        padding: 20px 16px 16px 16px;
      }

      .content-section {
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1rem;
        flex: 1;
        min-height: 0;
        -webkit-overflow-scrolling: touch;
      }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center">

    <div class="w-full bg-white rounded-3xl shadow-2xl app-layout">
        
        <!-- ส่วนหัว (Header) -->
        <div class="text-center pt-2 pb-4 shrink-0 border-b border-gray-100">
            <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-3xl shadow-xs">
                📊
            </div>
            <h1 class="text-xl font-black text-slate-800 tracking-tight">รายงานการขาย</h1>
            <p class="text-xs font-bold text-amber-600 mt-1">ร้านลาบหนองบัวลำภู</p>
        </div>
        
        <!-- ส่วนปุ่มเลือกรายงานทั้ง 3 รายการ (Content) -->
        <div class="content-section py-4">
            
            <!-- ปุ่ม 1: รายงานยอดขายประจำวัน -->
            <a href="ReportDaily.html" class="group bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white p-4 rounded-2xl shadow-md hover:shadow-lg transition-all transform active:scale-98 flex items-center justify-between no-underline">
                <div class="flex items-center gap-3.5">
                    <div class="w-11 h-11 bg-white/20 backdrop-blur-xs rounded-xl flex items-center justify-center text-xl shrink-0">
                        📅
                    </div>
                    <div class="text-left">
                        <div class="font-black text-sm tracking-wide">รายงานยอดขายรายวัน</div>
                        <div class="text-[11px] text-blue-100 font-medium">ReportDaily.html</div>
                    </div>
                </div>
                <span class="text-white/70 group-hover:translate-x-1 transition-transform text-lg">➔</span>
            </a>

            <!-- ปุ่ม 2: รายงานยอดขายตามหมวดหมู่ -->
            <a href="ReportGroupSales.html" class="group bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white p-4 rounded-2xl shadow-md hover:shadow-lg transition-all transform active:scale-98 flex items-center justify-between no-underline">
                <div class="flex items-center gap-3.5">
                    <div class="w-11 h-11 bg-white/20 backdrop-blur-xs rounded-xl flex items-center justify-center text-xl shrink-0">
                        📂
                    </div>
                    <div class="text-left">
                        <div class="font-black text-sm tracking-wide">รายงานยอดขายแยกตามกลุ่ม</div>
                        <div class="text-[11px] text-emerald-100 font-medium">ReportGroupSales.html</div>
                    </div>
                </div>
                <span class="text-white/70 group-hover:translate-x-1 transition-transform text-lg">➔</span>
            </a>

            <!-- ปุ่ม 3: รายงานสรุปภาพรวมการขาย -->
            <a href="ReportSales.html" class="group bg-gradient-to-r from-purple-500 to-violet-600 hover:from-purple-600 hover:to-violet-700 text-white p-4 rounded-2xl shadow-md hover:shadow-lg transition-all transform active:scale-98 flex items-center justify-between no-underline">
                <div class="flex items-center gap-3.5">
                    <div class="w-11 h-11 bg-white/20 backdrop-blur-xs rounded-xl flex items-center justify-center text-xl shrink-0">
                        📈
                    </div>
                    <div class="text-left">
                        <div class="font-black text-sm tracking-wide">รายงานสรุปการขายรวม</div>
                        <div class="text-[11px] text-purple-100 font-medium">ReportSales.html</div>
                    </div>
                </div>
                <span class="text-white/70 group-hover:translate-x-1 transition-transform text-lg">➔</span>
            </a>

        </div>

        <!-- ปุ่มกลับหน้าหลัก (Footer) -->
        <div class="pt-3 border-t border-gray-100 shrink-0">
            <a href="index.html" class="w-full bg-slate-700 hover:bg-slate-800 active:scale-98 text-white font-bold py-3 rounded-2xl text-xs text-center transition flex items-center justify-center gap-1.5 shadow-md no-underline">
                🏠 กลับหน้าหลัก (Index)
            </a>
        </div>

    </div>

</body>
</html>
