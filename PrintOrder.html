<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>รายการอาหาร - ลาบหนองบัวลำภู</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap');
        
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
        }

        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: #ffffff;
            }
            .print-card {
                box-shadow: none !important;
                border: none !important;
                max-width: 100% !important;
                width: 100% !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-3">

    <div class="print-card bg-white rounded-3xl w-full max-w-sm p-5 shadow-xl border border-slate-100 flex flex-col justify-between my-auto">
        
        <div>
            <!-- Header ร้าน -->
            <div class="text-center mb-4">
                <h2 class="font-extrabold text-slate-800 text-lg">ลาบหนองบัวลำภู @เขื่อนขุนด่าน</h2>
                <p class="text-xs text-slate-500 font-semibold mt-0.5">064-565-4951</p>
                <p class="text-xs text-slate-600 font-bold mt-1">รายการอาหาร ( <span id="customerGroupLabel">-</span> )</p>
            </div>

            <!-- รายการอาหาร -->
            <div class="border-2 border-slate-900 rounded-2xl p-4 min-h-[140px] flex flex-col items-center justify-center mb-3">
                <div id="itemListContainer" class="w-full space-y-2">
                    <p class="text-slate-300 font-bold text-center text-sm">ไม่มีรายการอาหาร</p>
                </div>
            </div>

            <!-- หมายเหตุออเดอร์ (ถ้ามี) -->
            <div id="orderNoteContainer" class="hidden mb-3 p-2 bg-amber-50 border border-amber-200 rounded-xl text-xs font-semibold text-amber-900">
                <span>📝 หมายเหตุ: </span><span id="orderNoteText"></span>
            </div>

            <!-- สรุปจำนวนและราคารวม -->
            <div class="flex items-center justify-between border-b-2 border-dashed border-slate-200 pb-3 mb-4">
                <div class="border border-slate-800 rounded-lg px-2.5 py-1">
                    <span id="summaryQty" class="font-extrabold text-xs text-slate-800">0 รายการ | 0 ชิ้น</span>
                </div>
                <div class="text-right">
                    <span class="font-extrabold text-base text-slate-900">รวม <span id="summaryTotal">0</span> บาท</span>
                </div>
            </div>
        </div>

        <div>
            <!-- ส่วน QR Code -->
            <div id="touristOnlySection" class="text-center my-3">
                <p class="text-xs font-bold text-slate-700 mb-0.5">⭐ ขอบพระคุณที่อุดหนุนค่ะ ⭐</p>
                <p class="text-[11px] text-slate-500 font-semibold mb-2">แนะนำ ติชม ได้นะคะ 🙏</p>
                <div class="flex justify-center mb-3">
                    <div class="p-1.5 border border-slate-300 rounded-xl bg-white shadow-sm">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=ลาบหนองบัวลำภู" alt="QR Code" class="w-28 h-28 object-contain">
                    </div>
                </div>
            </div>

            <!-- ปุ่มพิมพ์ -->
            <button type="button" id="printBtn" onclick="window.print()" class="no-print w-full py-3 bg-slate-900 hover:bg-slate-800 active:scale-95 text-white font-extrabold text-sm rounded-xl shadow-md transition">
                พิมพ์
            </button>
        </div>

    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            loadOrderData();
        });

        function loadOrderData() {
            const pendingOrderRaw = localStorage.getItem('pendingOrder');
            if (!pendingOrderRaw) return;

            const orderData = JSON.parse(pendingOrderRaw);
            const cart = orderData.cart || [];

            // 1. จัดการแสดงผลกลุ่มลูกค้า (ตัดคำว่า "นักท่องเที่ยว" ออกหากเป็นกลุ่มนักท่องเที่ยว)
            let rawGroup = orderData.groupName || 'ชาวบ้าน';
            let groupDisplay = '';

            if (Number(orderData.groupId) === 2) {
                // ดึงเฉพาะสถานที่ และ Zone/ห้องพัก
                let locDetails = [];
                if (orderData.locationName) locDetails.push(orderData.locationName);
                if (orderData.zoneName && orderData.zoneName !== orderData.locationName) {
                    locDetails.push(orderData.zoneName);
                }

                groupDisplay = locDetails.join(' - ');

                // เผื่อกรณีเลือกกลุ่มนักท่องเที่ยวแต่ไม่ได้เลือกสถานที่
                if (!groupDisplay) groupDisplay = 'นักท่องเที่ยว';
            } else {
                // กลุ่มชาวบ้าน หรือ สบายดี แสดงตามชื่อกลุ่มปกติ
                groupDisplay = rawGroup;
            }

            // ต่อท้ายด้วยเบอร์โทรศัพท์ (ถ้ามี)
            if (orderData.customerPhone) {
                groupDisplay += ` โทร: ${orderData.customerPhone}`;
            }

            const groupLabel = document.getElementById('customerGroupLabel');
            if (groupLabel) {
                groupLabel.textContent = groupDisplay;
            }

            // 2. แสดงหมายเหตุออเดอร์ (ถ้ามี)
            if (orderData.orderNote) {
                const noteContainer = document.getElementById('orderNoteContainer');
                const noteText = document.getElementById('orderNoteText');
                if (noteContainer && noteText) {
                    noteText.textContent = orderData.orderNote;
                    noteContainer.classList.remove('hidden');
                }
            }

            // 3. แสดงรายการอาหาร
            renderItemList(cart, orderData.groupId, orderData.deliveryFee || 0, orderData.grandTotal || 0);
        }

        function renderItemList(cart, groupId, deliveryFee, grandTotal) {
            const container = document.getElementById('itemListContainer');
            const summaryQtyEl = document.getElementById('summaryQty');
            const summaryTotalEl = document.getElementById('summaryTotal');

            if (!container) return;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-slate-300 font-bold text-center text-sm">ไม่มีรายการอาหาร</p>`;
                if (summaryQtyEl) summaryQtyEl.textContent = `0 รายการ | 0 ชิ้น`;
                if (summaryTotalEl) summaryTotalEl.textContent = `0`;
                return;
            }

            let totalItems = cart.length;
            let totalQty = 0;
            let html = '';

            cart.forEach(item => {
                const qty = Number(item.qty) || 1;
                
                let basePrice = 0;
                if (item.is_custom_price && Number(item.custom_price) > 0) {
                    basePrice = Number(item.custom_price);
                } else {
                    const gId = Number(groupId) || 1;
                    if (gId === 1) basePrice = Number(item.price_1 || item.price || 0);
                    else if (gId === 2) basePrice = Number(item.price_2 || item.price || 0);
                    else if (gId === 3) basePrice = Number(item.price_3 || item.price || 0);
                }

                const eggCost = (Number(item.fried_egg) || 0) * 10;
                const omeletCost = (Number(item.omelet) || 0) * 10;
                const unitPrice = basePrice + eggCost + omeletCost;
                const itemTotal = unitPrice * qty;

                totalQty += qty;

                let itemSubDetails = [];
                if (item.fried_egg > 0) itemSubDetails.push(`ไข่ดาว+${item.fried_egg}`);
                if (item.omelet > 0) itemSubDetails.push(`ไข่เจียว+${item.omelet}`);
                if (item.note) itemSubDetails.push(item.note);

                html += `
                <div class="flex justify-between items-start text-xs font-bold text-slate-800 py-0.5">
                    <div class="flex-1 pr-2">
                        <span class="block truncate max-w-[170px]">${item.name}</span>
                        ${itemSubDetails.length > 0 ? `<span class="block text-[10px] text-slate-500 font-normal">(${itemSubDetails.join(', ')})</span>` : ''}
                    </div>
                    <span class="shrink-0 text-slate-600 mr-3">x${qty}</span>
                    <span class="shrink-0 text-right min-w-[45px]">${itemTotal}.-</span>
                </div>
                `;
            });

            if (deliveryFee > 0) {
                html += `
                <div class="flex justify-between items-center text-xs font-bold text-slate-700 pt-1 border-t border-slate-200 mt-1">
                    <span>🛵 ค่าบริการจัดส่ง</span>
                    <span>${deliveryFee}.-</span>
                </div>
                `;
            }

            container.innerHTML = html;
            if (summaryQtyEl) summaryQtyEl.textContent = `${totalItems} รายการ | ${totalQty} ชิ้น`;
            if (summaryTotalEl) summaryTotalEl.textContent = Number(grandTotal).toLocaleString();
        }
    </script>
</body>
</html>
