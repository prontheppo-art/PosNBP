<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>รายการอาหาร (PrintOrder)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap');
        
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        /* การ์ดใบเสร็จบนหน้าจอ */
        .receipt-card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            max-height: 94vh; /* จำกัดความสูงการ์ดรวม */
        }

        /* ส่วนกล่องรายการอาหารที่วงสีแดง ไว้เปิดให้ Scroll บนหน้าจอ */
        .items-scroll-box {
            max-height: 260px; /* จำกัดความสูงกล่องรายการอาหารบนหน้าจอ */
            overflow-y: auto !important;
            touch-action: pan-y !important;
            -webkit-overflow-scrolling: touch !important;
            border: 2px solid #000000;
            border-radius: 16px;
            padding: 8px 12px;
        }

        /* ---------------------------------------------------- */
        /* CSS สำหรับการสั่งพิมพ์ (Print Mode)                 */
        /* ---------------------------------------------------- */
        @media print {
            body {
                background-color: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .receipt-card {
                max-width: 100% !important;
                max-height: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                border-radius: 0 !important;
            }

            /* ปลดล็อก Scroll และบังคับให้ขยายความสูงแสดงรายการทั้งหมดขณะพิมพ์ */
            .items-scroll-box {
                max-height: none !important;
                overflow: visible !important;
                border: 2px solid #000000 !important;
            }

            /* ซ่อนปุ่มพิมพ์เมื่อสั่งพิมพ์จริง */
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="receipt-card">
        <!-- หัวใบเสร็จ -->
        <div class="text-center mb-3">
            <h1 class="text-xl font-extrabold text-slate-900">ลาบหนองบัวลำภู @เขื่อนขุนด่าน</h1>
            <p class="text-xs font-semibold text-slate-600">064-565-4951</p>
            <p class="text-[11px] font-bold text-slate-700 mt-1" id="receiptHeaderInfo">รายการอาหาร (24/08/2569 19:35) (หน้าร้าน - หน้าร้าน)</p>
        </div>

        <!-- กล่องรายการอาหาร (ตรงที่วงสีแดง: สกอร์บนจอได้ + ปริ้นออกครบทุกรายการ) -->
        <div class="items-scroll-box mb-3 space-y-2" id="printItemList">
            <!-- รายการอาหารจะถูกโหลดมาใส่ตรงนี้ -->
        </div>

        <!-- สรุปรายการ และราคารวม -->
        <div class="flex justify-between items-center mb-3 px-1 font-extrabold text-slate-900">
            <div class="border border-slate-900 rounded-lg px-2 py-1 text-xs">
                <span id="printTotalSummary">9 รายการ | 9 ชิ้น</span>
            </div>
            <div class="text-base">
                <span>รวม </span>
                <span id="printTotalPrice">810</span>
                <span> บาท</span>
            </div>
        </div>

        <div class="border-t border-dashed border-slate-300 my-2"></div>

        <!-- ท้ายใบเสร็จ / QR Code -->
        <div class="text-center space-y-1 mb-4">
            <p class="text-xs font-bold text-slate-700">⭐ ขอขอบพระคุณที่อุดหนุนค่ะ ⭐</p>
            <p class="text-[10px] text-slate-500 font-semibold">แนะนำ ติชม ได้นะคะ 🙏</p>
            <div class="flex justify-center pt-1">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=PromptPay" alt="QR Code" class="w-24 h-24 border border-slate-300 rounded-lg p-1">
            </div>
        </div>

        <!-- ปุ่มกดสั่งพิมพ์ (ซ่อนอัตโนมัติเวลาปริ้น) -->
        <button type="button" onclick="window.print()" class="no-print w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl text-sm shadow-md active:scale-95 transition">
            พิมพ์
        </button>
    </div>

    <script>
        // โหลดข้อมูลจาก LocalStorage มาแสดงผล
        window.onload = function() {
            const rawCart = localStorage.getItem('cart');
            const cartItems = rawCart ? JSON.parse(rawCart) : [];
            const container = document.getElementById('printItemList');
            
            if (!container) return;
            container.innerHTML = '';

            let totalQty = 0;
            let totalPrice = 0;

            cartItems.forEach(item => {
                const qty = Number(item.qty || 1);
                const price = Number(item.price || 0);
                const sum = qty * price;
                
                totalQty += qty;
                totalPrice += sum;

                const row = document.createElement('div');
                row.className = 'flex justify-between items-center pb-1 border-b border-slate-100 text-xs font-bold text-slate-800';
                row.innerHTML = `
                    <div class="truncate pr-2">
                        <span>${item.name || 'รายการอาหาร'}</span>
                        <span class="text-slate-500 font-semibold ml-1">x${qty}</span>
                        ${item.note ? `<div class="text-[10px] text-rose-500 font-normal">${item.note}</div>` : ''}
                    </div>
                    <div class="whitespace-nowrap">${sum.toLocaleString()} ฿</div>
                `;
                container.appendChild(row);
            });

            document.getElementById('printTotalSummary').textContent = `${cartItems.length} รายการ | ${totalQty} ชิ้น`;
            document.getElementById('printTotalPrice').textContent = totalPrice.toLocaleString();
        };
    </script>
</body>
</html>
