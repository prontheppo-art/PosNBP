<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>จัดการสต็อกสินค้า</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
      :root {
        --bg-color: #f1f5f9;
        --card-bg: #ffffff;
      }

      /* ล็อกหน้าจอหลัก ห้ามเลื่อน ห้ามยืด ห้ามขยับ */
      html,
      body {
        position: fixed;
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
        background-color: var(--bg-color);
        color: #1e293b;
        font-family: sans-serif;
        margin: 0;
        padding: 0;
        -webkit-user-select: none;
        user-select: none;
      }

      .app-layout {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100dvh;
        width: 100vw;
        padding: 12px;
        box-sizing: border-box;
        overflow: hidden;
      }

      /* พื้นที่เลื่อนเฉพาะรายการภายใน */
      .scroll-container {
        overflow-y: auto;
        touch-action: pan-y;
        -webkit-overflow-scrolling: touch;
      }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center">

    <div class="app-layout">
        <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-6 h-[92vh] flex flex-col relative overflow-hidden">
            
            <!-- ส่วนหัวและฟอร์มเพิ่มสินค้า -->
            <div class="shrink-0 bg-white pb-3 z-10 space-y-3">
                <h2 class="text-base font-bold text-gray-800 text-center">📦 จัดการสต็อกสินค้า</h2>

                <div class="bg-orange-50 p-3 rounded-2xl border border-orange-100 space-y-2">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xs font-bold text-orange-800 m-0">➕ เพิ่มรายการ</h3>
                        <button onclick="addStockItem()" class="bg-orange-600 hover:bg-orange-700 text-white font-bold px-3 py-1 rounded-lg text-[10px] shadow cursor-pointer transition">
                            + เพิ่ม
                        </button>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="newFoodName" placeholder="ชื่อเมนู" class="flex-1 p-2 border border-gray-200 rounded-xl text-xs bg-white outline-none focus:border-orange-500">
                        <input type="number" id="newFoodQty" placeholder="จำนวน" class="w-20 p-2 border border-gray-200 rounded-xl text-xs bg-white outline-none text-center focus:border-orange-500">
                    </div>
                </div>
            </div>

            <hr class="border-gray-200 my-2 shrink-0">

            <!-- รายการสต็อก (Scrollable Area) -->
            <div id="stockListContainer" class="scroll-container space-y-2 overflow-y-auto pr-1 flex-1 content-start mb-2">
                <div class="text-center text-xs text-gray-400 py-4">กำลังโหลดข้อมูล...</div>
            </div>

            <!-- ปุ่มกลับหน้าหลัก -->
            <div class="shrink-0 pt-2 border-t border-gray-100 mt-auto bg-white">
                <a href="index.html" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2.5 rounded-xl text-xs text-center transition flex items-center justify-center gap-1 shadow-xs block no-underline cursor-pointer">
                    🏠 กลับหน้าหลัก
                </a>
            </div>
        </div>
    </div>

    <!-- Modal Popup -->
    <div id="customModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl max-w-xs w-full p-6 shadow-2xl transform scale-95 transition-transform duration-300 text-center space-y-4" id="modalBox">
            <div id="modalIconContainer" class="w-14 h-14 mx-auto rounded-full flex items-center justify-center text-2xl bg-orange-100 text-orange-600">⚠️</div>
            <div class="space-y-1">
                <h3 id="modalTitle" class="text-sm font-bold text-gray-800">แจ้งเตือน</h3>
                <p id="modalMessage" class="text-xs text-gray-500 leading-relaxed"></p>
            </div>
            <div id="modalActionContainer" class="flex gap-2 pt-2">
                <button id="modalCancelBtn" onclick="closeModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-xs transition hidden cursor-pointer">ยกเลิก</button>
                <button id="modalConfirmBtn" onclick="closeModal()" class="flex-1 bg-orange-600 hover:bg-orange-700 text-white font-bold py-2.5 rounded-xl text-xs shadow transition cursor-pointer">ตกลง</button>
            </div>
        </div>
    </div>

    <!-- สคริปต์ป้องกันการ Touch Zoom & Touch Stretch -->
    <script>
      document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
      document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
      document.addEventListener('gestureend', (e) => e.preventDefault(), { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (event) {
          const now = (new Date()).getTime();
          if (now - lastTouchEnd <= 300) {
              event.preventDefault();
          }
          lastTouchEnd = now;
      }, { passive: false });
    </script>

    <!-- เรียกใช้ไฟล์คีย์และ JS ทำงาน -->
    <script src="key.js"></script>
    <script>
        let db = null;

        async function initApp() {
            const container = document.getElementById('stockListContainer');
            
            const url = window.SUPABASE_URL || (typeof SUPABASE_URL !== 'undefined' ? SUPABASE_URL : null);
            const key = window.SUPABASE_KEY || (typeof SUPABASE_KEY !== 'undefined' ? SUPABASE_KEY : null);

            if (!url || !key) {
                if (container) {
                    container.innerHTML = '<div class="text-center text-xs text-red-500 py-4 px-2">ไม่พบตัวแปร SUPABASE_URL หรือ SUPABASE_KEY ในไฟล์ key.js</div>';
                }
                return;
            }
            
            if (!window.supabase) {
                if (container) {
                    container.innerHTML = '<div class="text-center text-xs text-red-500 py-4 px-2">โหลด Supabase Library ไม่สำเร็จ กรุณาเช็กอินเทอร์เน็ต</div>';
                }
                return;
            }
            
            try {
                db = window.supabase.createClient(url, key);
                await loadStocks();
            } catch (err) {
                if (container) {
                    container.innerHTML = `<div class="text-center text-xs text-red-500 py-4 px-2">เกิดข้อผิดพลาด: ${err.message}</div>`;
                }
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        function showModal({ title = "แจ้งเตือน", message, type = "info", showCancel = false, onConfirm = null }) {
            const modal = document.getElementById('customModal');
            const modalBox = document.getElementById('modalBox');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const confirmBtn = document.getElementById('modalConfirmBtn');
            const cancelBtn = document.getElementById('modalCancelBtn');
            
            if (!modal) return;
            
            modalTitle.innerText = title;
            modalMessage.innerText = message;
            if (showCancel) cancelBtn.classList.remove('hidden');
            else cancelBtn.classList.add('hidden');
            
            confirmBtn.onclick = function() { closeModal(); if (onConfirm) onConfirm(); };
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalBox.classList.remove('scale-95');
                modalBox.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            const modalBox = document.getElementById('modalBox');
            if (!modal) return;
            modal.classList.add('opacity-0');
            modalBox.classList.remove('scale-100');
            modalBox.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        async function loadStocks() {
            const container = document.getElementById('stockListContainer');
            if (!container) return;
            
            try {
                const { data, error } = await db.from('food_stocks').select('*').order('food_name', { ascending: true });
                
                if (error) {
                    container.innerHTML = `<div class="text-center text-xs text-red-500 py-4 px-2">อ่านตาราง food_stocks ไม่ได้: ${error.message}</div>`;
                    return;
                }
                
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="text-center text-xs text-gray-400 py-4">ยังไม่มีรายการสินค้าในสต็อก</div>';
                    return;
                }
                
                let html = '';
                data.forEach(item => {
                    html += `
                        <div class="flex items-center justify-between p-2 bg-white border border-gray-100 rounded-2xl shadow-xs gap-1">
                            <button onclick="deleteStock(${item.id})" class="bg-red-100 text-red-600 hover:bg-red-200 w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs shrink-0 cursor-pointer">✕</button>
                            <div class="flex-1 min-w-0 px-1">
                                <div class="font-bold text-xs text-gray-800 truncate">${item.food_name}</div>
                            </div>
                            <div class="flex items-center gap-1.5 shrink-0">
                                <input type="text" value="${item.quantity}" readonly class="w-10 p-1 border rounded-lg text-xs text-center font-bold bg-gray-100 text-gray-600">
                                <input type="number" id="add_${item.id}" placeholder="เพิ่ม" class="w-12 p-1 border rounded-lg text-xs text-center font-bold bg-orange-50 focus:bg-white outline-none">
                                <button onclick="confirmAddStock(${item.id}, ${item.quantity})" class="w-8 h-7 bg-orange-600 text-white font-bold rounded-lg text-sm flex items-center justify-center cursor-pointer">+</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<div class="text-center text-xs text-red-500 py-4 px-2">ดึงข้อมูลไม่สำเร็จ: ${err.message}</div>`;
            }
        }

        async function confirmAddStock(id, currentQty) {
            const addInput = document.getElementById(`add_${id}`);
            if (!addInput) return;
            let addVal = parseFloat(addInput.value);
            if (isNaN(addVal) || addVal <= 0) return;
            
            const { error } = await db.from('food_stocks').update({
                quantity: currentQty + addVal,
                updated_at: new Date().toISOString()
            }).eq('id', id);
            
            if (!error) {
                loadStocks();
            } else {
                showModal({ message: "อัปเดตสต็อกไม่สำเร็จ: " + error.message });
            }
        }

        async function addStockItem() {
            const nameEl = document.getElementById('newFoodName');
            const qtyEl = document.getElementById('newFoodQty');
            const name = nameEl.value.trim();
            const qty = parseFloat(qtyEl.value);
            
            if (!name) { showModal({ message: "กรุณากรอกชื่อเมนู" }); return; }
            if (isNaN(qty)) { showModal({ message: "กรุณากรอกจำนวน" }); return; }
            
            const { error } = await db.from('food_stocks').insert([{
                food_name: name,
                quantity: qty,
                updated_at: new Date().toISOString()
            }]);
            
            if (!error) {
                nameEl.value = '';
                qtyEl.value = '';
                loadStocks();
            } else {
                showModal({ message: "เพิ่มรายการไม่สำเร็จ: " + error.message });
            }
        }

        async function deleteStock(id) {
            showModal({
                title: "ยืนยันการลบ",
                message: "คุณต้องการลบรายการนี้ใช่หรือไม่?",
                type: "error",
                showCancel: true,
                onConfirm: async () => {
                    const { error } = await db.from('food_stocks').delete().eq('id', id);
                    if (!error) loadStocks();
                    else showModal({ message: "ลบไม่สำเร็จ: " + error.message });
                }
            });
        }
    </script>
</body>
</html>
