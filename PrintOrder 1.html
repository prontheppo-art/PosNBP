<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>รายการอาหาร - ลาบหนองบัวลำภู</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap');
        
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
        }

        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: #ffffff;
            }
            .print-card {
                box-shadow: none !important;
                border: none !important;
                max-width: 100% !important;
                width: 100% !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-3">

    <div class="print-card bg-white rounded-3xl w-full max-w-sm p-5 shadow-xl border border-slate-100 flex flex-col justify-between my-auto">
        
        <div>
            <!-- Header ร้าน -->
            <div class="text-center mb-4">
                <h2 class="font-extrabold text-slate-800 text-lg">ลาบหนองบัวลำภู @เขื่อนขุนด่าน</h2>
                <p class="text-xs text-slate-500 font-semibold mt-0.5">064-565-4951</p>
                <p class="text-xs text-slate-600 font-bold mt-1">รายการอาหาร ( <span id="customerGroupLabel">-</span> )</p>
            </div>

            <!-- รายการอาหาร -->
            <div class="border-2 border-slate-900 rounded-2xl p-4 min-h-[140px] flex flex-col items-center justify-center mb-3">
                <div id="itemListContainer" class="w-full space-y-2">
                    <p class="text-slate-300 font-bold text-center text-sm">ไม่มีรายการอาหาร</p>
                </div>
            </div>

            <!-- หมายเหตุออเดอร์ (ถ้ามี) -->
            <div id="orderNoteContainer" class="hidden mb-3 p-2 bg-amber-50 border border-amber-200 rounded-xl text-xs font-semibold text-amber-900">
                <span>📝 หมายเหตุ: </span><span id="orderNoteText"></span>
            </div>

            <!-- สรุปจำนวนและราคารวม -->
            <div class="flex items-center justify-between border-b-2 border-dashed border-slate-200 pb-3 mb-4">
                <div class="border border-slate-800 rounded-lg px-2.5 py-1">
                    <span id="summaryQty" class="font-extrabold text-xs text-slate-800">0 รายการ | 0 ชิ้น</span>
                </div>
                <div class="text-right">
                    <span class="font-extrabold text-base text-slate-900">รวม <span id="summaryTotal">0</span> บาท</span>
                </div>
            </div>
        </div>

        <div>
            <!-- ส่วน QR Code (แสดงเฉพาะกลุ่มนักท่องเที่ยว) -->
            <div id="touristOnlySection" class="hidden text-center my-3">
                <p class="text-xs font-bold text-slate-700 mb-0.5">⭐ ขอบพระคุณที่อุดหนุนค่ะ ⭐</p>
                <p class="text-[11px] text-slate-500 font-semibold mb-2">แนะนำ ติชม ได้นะคะ 🙏</p>
                <div class="flex justify-center mb-3">
                    <div class="p-1.5 border border-slate-300 rounded-xl bg-white shadow-sm">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=ลาบหนองบัวลำภู" alt="QR Code" class="w-28 h-28 object-contain">
                    </div>
                </div>
            </div>

            <!-- ปุ่มกด 2 คอลัมน์ -->
            <div class="no-print grid grid-cols-2 gap-2 mt-2">
                <!-- ปุ่มที่ 1: บันทึก -->
                <button type="button" id="saveOnlyBtn" onclick="handleSaveOrder(false)" class="w-full py-3 bg-slate-700 hover:bg-slate-800 active:scale-95 text-white font-extrabold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-1.5">
                    <span>💾</span>
                    <span id="saveBtnText">บันทึก</span>
                </button>

                <!-- ปุ่มที่ 2: บันทึก / พิมพ์ -->
                <button type="button" id="saveAndPrintBtn" onclick="handleSaveOrder(true)" class="w-full py-3 bg-slate-900 hover:bg-slate-800 active:scale-95 text-white font-extrabold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-1.5">
                    <span>🖨️</span>
                    <span id="printBtnText">บันทึก / พิมพ์</span>
                </button>
            </div>
        </div>

    </div>

    <!-- ดึงไฟล์เชื่อมต่อ Supabase -->
    <script src="key.js"></script>
    <script>
        let currentOrderData = null;

        window.addEventListener('DOMContentLoaded', () => {
            loadOrderData();
        });

        function loadOrderData() {
            const pendingOrderRaw = localStorage.getItem('pendingOrder');
            if (!pendingOrderRaw) return;

            currentOrderData = JSON.parse(pendingOrderRaw);
            const cart = currentOrderData.cart || [];
            const groupId = Number(currentOrderData.groupId || currentOrderData.customerGroupId) || 1;

            // 1. จัดการแสดงผล QR Code (แสดงเฉพาะกลุ่มนักท่องเที่ยว groupId = 2)
            const touristSection = document.getElementById('touristOnlySection');
            if (touristSection) {
                if (groupId === 2) {
                    touristSection.classList.remove('hidden');
                } else {
                    touristSection.classList.add('hidden');
                }
            }

            // 2. จัดการแสดงผลกลุ่มลูกค้า
            let rawGroup = currentOrderData.groupName || currentOrderData.customerGroup || 'ชาวบ้าน';
            let groupDisplay = '';

            if (groupId === 2) {
                let locDetails = [];
                if (currentOrderData.locationName) locDetails.push(currentOrderData.locationName);
                if (currentOrderData.zoneName && currentOrderData.zoneName !== currentOrderData.locationName) {
                    locDetails.push(currentOrderData.zoneName);
                }

                groupDisplay = locDetails.join(' - ');
                if (!groupDisplay) groupDisplay = 'นักท่องเที่ยว';
            } else {
                groupDisplay = rawGroup;
            }

            const phoneNum = currentOrderData.customerPhone || currentOrderData.phone;
            if (phoneNum) {
                groupDisplay += ` โทร: ${phoneNum}`;
            }

            const groupLabel = document.getElementById('customerGroupLabel');
            if (groupLabel) {
                groupLabel.textContent = groupDisplay;
            }

            // 3. แสดงหมายเหตุออเดอร์ (ถ้ามี)
            const noteVal = currentOrderData.orderNote || currentOrderData.note;
            if (noteVal) {
                const noteContainer = document.getElementById('orderNoteContainer');
                const noteText = document.getElementById('orderNoteText');
                if (noteContainer && noteText) {
                    noteText.textContent = noteVal;
                    noteContainer.classList.remove('hidden');
                }
            }

            // 4. แสดงรายการอาหาร (ส่ง groupId เข้าไปด้วย)
            renderItemList(cart, groupId, currentOrderData.deliveryFee || currentOrderData.delivery_fee || 0, currentOrderData.grandTotal || currentOrderData.total_price || 0);
        }

        function renderItemList(cart, groupId, deliveryFee, grandTotal) {
            const container = document.getElementById('itemListContainer');
            const summaryQtyEl = document.getElementById('summaryQty');
            const summaryTotalEl = document.getElementById('summaryTotal');

            if (!container) return;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-slate-300 font-bold text-center text-sm">ไม่มีรายการอาหาร</p>`;
                if (summaryQtyEl) summaryQtyEl.textContent = `0 รายการ | 0 ชิ้น`;
                if (summaryTotalEl) summaryTotalEl.textContent = `0`;
                return;
            }

            let totalItems = cart.length;
            let totalQty = 0;
            let html = '';

            cart.forEach(item => {
                const qty = Number(item.qty) || 1;
                const gId = Number(groupId) || 1;
                
                let basePrice = 0;

                // 1. ถ้ามีการระบุราคาพิเศษเอง (Custom Price)
                if (item.is_custom_price && Number(item.custom_price) > 0) {
                    basePrice = Number(item.custom_price);
                } else {
                    // 2. ตรวจสอบตามกลุ่มลูกค้า (รองรับทั้ง price_1/price1, price_2/price2, price_3/price3)
                    if (gId === 1) {
                        basePrice = Number(item.price_1 ?? item.price1 ?? item.price ?? 0);
                    } else if (gId === 2) {
                        basePrice = Number(item.price_2 ?? item.price2 ?? item.price ?? 0);
                    } else if (gId === 3) {
                        basePrice = Number(item.price_3 ?? item.price3 ?? item.price ?? 0);
                    } else {
                        basePrice = Number(item.price ?? 0);
                    }
                    
                    // 3. ป้องกันกรณีหาตามกลุ่มไม่เจอ ให้ใช้ราคาพื้นฐาน (item.price / item.unit_price) เสมอ
                    if (basePrice === 0) {
                        basePrice = Number(item.price ?? item.unit_price ?? item.base_price ?? 0);
                    }
                }

                const eggCost = (Number(item.fried_egg) || 0) * 10;
                const omeletCost = (Number(item.omelet) || 0) * 10;
                const unitPrice = basePrice + eggCost + omeletCost;
                const itemTotal = unitPrice * qty;

                totalQty += qty;

                let itemSubDetails = [];
                if (item.fried_egg > 0) itemSubDetails.push(`ไข่ดาว+${item.fried_egg}`);
                if (item.omelet > 0) itemSubDetails.push(`ไข่เจียว+${item.omelet}`);
                if (item.note) itemSubDetails.push(item.note);

                html += `
                <div class="flex justify-between items-start text-xs font-bold text-slate-800 py-0.5">
                    <div class="flex-1 pr-2">
                        <span class="block truncate max-w-[170px]">${item.name || item.food_name}</span>
                        ${itemSubDetails.length > 0 ? `<span class="block text-[10px] text-slate-500 font-normal">(${itemSubDetails.join(', ')})</span>` : ''}
                    </div>
                    <span class="shrink-0 text-slate-600 mr-3">x${qty}</span>
                    <span class="shrink-0 text-right min-w-[45px]">${itemTotal}.-</span>
                </div>
                `;
            });

            if (Number(deliveryFee) > 0) {
                html += `
                <div class="flex justify-between items-center text-xs font-bold text-slate-700 pt-1 border-t border-slate-200 mt-1">
                    <span>🛵 ค่าบริการจัดส่ง</span>
                    <span>${deliveryFee}.-</span>
                </div>
                `;
            }

            container.innerHTML = html;
            if (summaryQtyEl) summaryQtyEl.textContent = `${totalItems} รายการ | ${totalQty} ชิ้น`;
            if (summaryTotalEl) summaryTotalEl.textContent = Number(grandTotal).toLocaleString();
        }

        // ฟังก์ชันบันทึกข้อมูลและนำทางกลับอัตโนมัติ
        async function handleSaveOrder(shouldPrint = false) {
            if (!currentOrderData) {
                window.location.href = 'index.html';
                return;
            }

            const btnSave = document.getElementById('saveOnlyBtn');
            const btnSavePrint = document.getElementById('saveAndPrintBtn');
            const saveText = document.getElementById('saveBtnText');
            const printText = document.getElementById('printBtnText');

            try {
                // ปิดการกดปุ่มซ้ำ
                btnSave.disabled = true;
                btnSavePrint.disabled = true;
                if (shouldPrint && printText) printText.textContent = 'กำลังบันทึก...';
                if (!shouldPrint && saveText) saveText.textContent = 'กำลังบันทึก...';

                if (typeof supabaseClient !== 'undefined') {
                    const totalQty = (currentOrderData.cart || []).reduce((sum, item) => sum + (Number(item.qty) || 1), 0);

                    // --- คำนวณวัน-เวลาของประเทศไทย (GMT+7) ---
                    const now = new Date();
                    const tzOffset = 7 * 60; // 7 ชั่วโมงเป็นนาที
                    const localTime = new Date(now.getTime() + (tzOffset + now.getTimezoneOffset()) * 60000);

                    const year = localTime.getFullYear();
                    const month = String(localTime.getMonth() + 1).padStart(2, '0');
                    const day = String(localTime.getDate()).padStart(2, '0');
                    const hours = String(localTime.getHours()).padStart(2, '0');
                    const minutes = String(localTime.getMinutes()).padStart(2, '0');
                    const seconds = String(localTime.getSeconds()).padStart(2, '0');

                    const todayStr = `${year}-${month}-${day}`;
                    const timestampStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

                    const insertPayload = {
                        customer_group: currentOrderData.groupName || currentOrderData.customerGroup || 'ชาวบ้าน',
                        customer_group_id: currentOrderData.groupId || currentOrderData.customerGroupId || 1,
                        phone: currentOrderData.customerPhone || currentOrderData.phone || '',
                        customer_phone: currentOrderData.customerPhone || currentOrderData.phone || '',
                        location_id: currentOrderData.locationId || null,
                        location_name: currentOrderData.locationName || null,
                        zone_id: currentOrderData.zoneId || null,
                        zone_name: currentOrderData.zoneName || null,
                        note: currentOrderData.orderNote || currentOrderData.note || '',
                        subtotal: currentOrderData.subtotal || 0,
                        delivery_fee: currentOrderData.deliveryFee || currentOrderData.delivery_fee || 0,
                        total_price: currentOrderData.grandTotal || currentOrderData.total_price || 0,
                        total_qty: totalQty,
                        items: currentOrderData.cart || [],
                        order_date: todayStr,
                        created_at: timestampStr,
                        status: 'completed' // บันทึกเป็น completed ทันที
                    };

                    const { error } = await supabaseClient
                        .from('orders')
                        .insert([insertPayload]);

                    if (error) console.error('Supabase Insert Warning:', error);
                }

                // สั่งพิมพ์ทันทีถ้ากดปุ่มบันทึก/พิมพ์
                if (shouldPrint) {
                    window.print();
                }

            } catch (err) {
                console.error('Save Order Error:', err);
            } finally {
                // เคลียร์ข้อมูลออเดอร์ในเครื่องหลังบันทึกเสร็จ
                localStorage.removeItem('pendingOrder');
                localStorage.removeItem('cart');

                // เด้งกลับหน้า index.html ทันทีโดยไม่มี Dialog รบกวน
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
