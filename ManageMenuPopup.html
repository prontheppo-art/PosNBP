<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการราคาเมนู</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: sans-serif;
            user-select: none;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="p-2 sm:p-4 flex items-center justify-center min-h-screen bg-slate-900/60 backdrop-blur-sm relative">

    <!-- Modal Box Container (เพิ่มขอบสีแดง border-4 border-red-500) -->
    <div class="w-full max-w-lg bg-white rounded-3xl shadow-2xl border-4 border-red-500 overflow-hidden flex flex-col max-h-[90vh] z-10">
        
        <!-- Header Section -->
        <div class="bg-slate-700 text-white p-4 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-2">
                <span class="text-xl">📁</span>
                <h3 id="groupNameTitle" class="font-bold text-lg text-amber-300">กำลังโหลด...</h3>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openAddMenuPopupHTML()" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1 shadow transition">
                    <span>➕</span> เมนู
                </button>
                <button onclick="closeModal()" class="bg-slate-600 hover:bg-slate-500 text-slate-200 rounded-full w-8 h-8 flex items-center justify-center font-bold text-lg active:scale-95 transition">
                    ✕
                </button>
            </div>
        </div>

        <!-- Table Header -->
        <div class="bg-blue-600 text-white font-bold text-xs py-2.5 px-3 grid grid-cols-12 gap-1 items-center text-center shrink-0">
            <div class="col-span-6 text-left pl-2">รายการอาหาร</div>
            <div class="col-span-2">ชาวบ้าน</div>
            <div class="col-span-2">นักท่องเที่ยว</div>
            <div class="col-span-2">สบายดี</div>
        </div>

        <!-- Food List Container -->
        <div id="foodListContainer" class="flex-1 overflow-y-auto p-2 space-y-2 bg-slate-50">
            <div class="text-center py-8 text-slate-400 text-xs">⏳ กำลังโหลดรายการอาหาร...</div>
        </div>

        <!-- Footer Section -->
        <div class="p-3 bg-white border-t border-slate-100 shrink-0">
            <button onclick="closeModal()" class="w-full bg-slate-700 hover:bg-slate-800 text-white font-bold py-3 rounded-2xl text-sm shadow active:scale-[0.98] transition">
                ปิดหน้าต่าง
            </button>
        </div>

    </div>

    <!-- Inner Modal Frame Container สำหรับเรียก AddMenuPopup.html -->
    <div id="addMenuModalWrapper" class="fixed inset-0 z-50 hidden">
        <iframe id="addMenuPopupFrame" class="w-full h-full border-none" src="about:blank"></iframe>
    </div>

    <!-- Script Section -->
    <script src="key.js"></script>
    <script>
        let db;
        let currentGroupId = null;
        let currentGroupName = '';

        window.addEventListener('DOMContentLoaded', async () => {
            if (window.supabaseClient) {
                db = window.supabaseClient;
            } else if (typeof supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_KEY !== 'undefined') {
                db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }

            const urlParams = new URLSearchParams(window.location.search);
            currentGroupId = urlParams.get('groupId');
            currentGroupName = urlParams.get('groupName') || 'หมวดหมู่';

            document.getElementById('groupNameTitle').textContent = currentGroupName;

            if (db && currentGroupId) {
                await loadCategoryFoods();
            } else {
                document.getElementById('foodListContainer').innerHTML = `<div class="text-center py-8 text-red-500 text-xs">❌ ไม่พบบริบทหมวดหมู่หรือการเชื่อมต่อ DB</div>`;
            }
        });

        async function loadCategoryFoods() {
            try {
                const { data: foods, error } = await db
                    .from('foods')
                    .select('*')
                    .eq('group_id', currentGroupId)
                    .order('id', { ascending: true });

                if (error) throw error;
                renderFoodRows(foods || []);
            } catch (err) {
                console.error("Error loading foods:", err);
                document.getElementById('foodListContainer').innerHTML = `<div class="text-center py-8 text-red-500 text-xs">เกิดข้อผิดพลาด: ${err.message}</div>`;
            }
        }

        function renderFoodRows(foods) {
            const container = document.getElementById('foodListContainer');
            container.innerHTML = '';

            if (foods.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">ไม่มีรายการอาหารในหมวดหมู่นี้</div>`;
                return;
            }

            foods.forEach(food => {
                const row = document.createElement('div');
                row.className = "bg-white p-2 rounded-xl border border-slate-200 shadow-sm grid grid-cols-12 gap-1 items-center";

                row.innerHTML = `
                    <div class="col-span-6 flex items-center gap-1 overflow-hidden pr-1">
                        <span class="font-bold text-slate-800 text-xs truncate">${food.name}</span>
                        <button onclick="editFoodName(${food.id}, '${food.name}')" class="text-xs opacity-70 hover:opacity-100">✏️</button>
                    </div>
                    <div class="col-span-2">
                        <input type="number" value="${food.price_1 || 0}" onchange="updatePrice(${food.id}, 'price_1', this.value)" 
                            class="w-full text-center font-bold text-slate-700 text-xs bg-slate-50 border border-slate-300 rounded-lg py-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div class="col-span-2">
                        <input type="number" value="${food.price_2 || 0}" onchange="updatePrice(${food.id}, 'price_2', this.value)" 
                            class="w-full text-center font-bold text-slate-700 text-xs bg-slate-50 border border-slate-300 rounded-lg py-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div class="col-span-2">
                        <input type="number" value="${food.price_3 || 0}" onchange="updatePrice(${food.id}, 'price_3', this.value)" 
                            class="w-full text-center font-bold text-slate-700 text-xs bg-slate-50 border border-slate-300 rounded-lg py-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                `;
                container.appendChild(row);
            });
        }

        async function updatePrice(foodId, priceField, value) {
            try {
                const numVal = parseFloat(value) || 0;
                const { error } = await db
                    .from('foods')
                    .update({ [priceField]: numVal })
                    .eq('id', foodId);

                if (error) throw error;
            } catch (err) {
                alert('ไม่สามารถอัปเดตราคาได้: ' + err.message);
            }
        }

        async function editFoodName(foodId, oldName) {
            const newName = prompt('แก้ไขชื่ออาหาร:', oldName);
            if (newName && newName.trim() !== '' && newName !== oldName) {
                try {
                    const { error } = await db
                        .from('foods')
                        .update({ name: newName.trim() })
                        .eq('id', foodId);

                    if (error) throw error;
                    await loadCategoryFoods();
                } catch (err) {
                    alert('ไม่สามารถเปลี่ยนชื่อได้: ' + err.message);
                }
            }
        }

        /* เรียกเปิดป๊อปอัป AddMenuPopup.html */
        function openAddMenuPopupHTML() {
            const wrapper = document.getElementById('addMenuModalWrapper');
            const iframe = document.getElementById('addMenuPopupFrame');
            
            iframe.src = `AddMenuPopup.html?groupId=${currentGroupId}`;
            wrapper.classList.remove('hidden');
        }

        /* สั่งปิด AddMenuPopup.html และรีโหลดรายการอาหารใหม่ */
        function closeAddMenuIframe() {
            const wrapper = document.getElementById('addMenuModalWrapper');
            const iframe = document.getElementById('addMenuPopupFrame');
            
            wrapper.classList.add('hidden');
            iframe.src = 'about:blank';
            loadCategoryFoods();
        }

        function closeModal() {
            if (window.parent && window.parent.closeManageMenuIframe) {
                window.parent.closeManageMenuIframe();
            }
        }
    </script>
</body>
</html>
