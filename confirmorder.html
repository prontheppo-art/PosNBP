<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>ตรวจสอบออเดอร์ - ลาบหนองบัวลำภู</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --border-color: #334155;
            --primary: #2563eb;
            --success: #16a34a;
        }

        html, body {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            -webkit-text-size-adjust: 100%;
            background-color: var(--bg-color);
            color: #1e293b;
            font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
        }

        .page-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 672px;
            margin: 0 auto;
            box-sizing: border-box;
            padding-bottom: 70px;
        }

        .iframe-header-wrapper {
            flex-shrink: 0;
            width: 100%;
            height: 135px;
            border: none;
            display: block;
        }

        .iframe-select-wrapper {
            flex: 1;
            width: 100%;
            border: none;
            min-height: 0;
        }

        .main-content-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 0 12px;
            gap: 6px;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .custom-modal-overlay.active {
            display: flex !important;
        }

        .custom-modal-box {
            background: white;
            border-radius: 20px;
            padding: 20px;
            width: 92%;
            max-width: 440px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

<div class="page-container">
    <iframe src="confirmorder_location.html" class="iframe-header-wrapper" id="locationIframe"></iframe>

    <div class="main-content-box">
        <div class="flex justify-between items-center px-1 text-xs font-bold text-slate-700 shrink-0">
            <span class="flex items-center gap-1.5">🛒 ตะกร้าสินค้าปัจจุบัน:</span>
            <span id="cartCountText" class="text-green-600 font-extrabold text-sm">0 รายการ | 0 ชิ้น</span>
        </div>

        <iframe src="confirmorder_select.html" class="iframe-select-wrapper" id="cartIframe"></iframe>

        <div class="bg-white border border-slate-200 rounded-2xl p-2.5 shadow-sm shrink-0">
            <label class="block text-xs font-bold text-slate-700 mb-1">หมายเหตุออเดอร์ (ถ้ามี):</label>
            <input type="text" id="orderNoteInput" oninput="handleNoteChange(this.value);" placeholder="เช่น ใส่กล่องแยกน้ำ, ทานที่นี่..." class="w-full p-2 border border-slate-200 rounded-xl text-xs bg-slate-50 outline-none">
        </div>
    </div>
</div>

<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-3 shadow-lg z-50">
    <div class="max-w-2xl mx-auto flex gap-2">
        <a href="orderentity.html" class="bg-white hover:bg-gray-50 text-slate-800 border border-slate-300 font-bold py-2.5 px-3 rounded-xl text-xs flex-1 text-center shadow transition flex items-center justify-center">
            ⬅️ กลับไปแก้ไข
        </a>
        <button onclick="submitOrder()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-3 rounded-xl text-xs flex-1 text-center shadow transition">
            ✅ บันทึก / ส่งออเดอร์
        </button>
    </div>
</div>

<!-- Pop-up สถานที่ -->
<div id="locationModal" class="custom-modal-overlay" onclick="handleOutsideClick(event, 'locationModal')">
    <div class="custom-modal-box border-t-4 border-amber-500">
        <div class="flex justify-between items-center mb-3 pb-2 border-b">
            <h3 class="font-bold text-base text-slate-800 flex items-center gap-1.5">📍 เลือกสถานที่ / ที่พัก</h3>
            <button onclick="closeModal('locationModal')" class="text-gray-400 hover:text-gray-600 font-bold text-lg px-1">✕</button>
        </div>
        <div id="locationGrid" class="grid grid-cols-2 gap-2 overflow-y-auto py-1 pr-1 max-h-[60vh]"></div>
    </div>
</div>

<!-- Pop-up โซน -->
<div id="zoneModal" class="custom-modal-overlay" onclick="handleOutsideClick(event, 'zoneModal')">
    <div class="custom-modal-box border-t-4 border-blue-500">
        <div class="flex justify-between items-center mb-3 pb-2 border-b">
            <div>
                <h3 class="font-bold text-base text-slate-800 flex items-center gap-1.5">🏷️ เลือกโซน / ห้องพัก</h3>
                <span id="zoneModalSubTitle" class="text-xs text-amber-600 font-semibold block"></span>
            </div>
            <button onclick="closeModal('zoneModal')" class="text-gray-400 hover:text-gray-600 font-bold text-lg px-1">✕</button>
        </div>
        <div id="zoneContainer" class="overflow-y-auto py-1 pr-1 max-h-[60vh] space-y-2"></div>
    </div>
</div>

<script src="key.js"></script>
<script>
    let savedOrderNote = localStorage.getItem('orderNote') || '';
    let tempSelectedLocation = null;
    const zoneIcons = ['🏠', '🔑', '🛋️', '🚪', '🏡', '🌿', '🛏️', '🔑'];

    let currentOrderSummary = {
        itemsCount: 0,
        totalQty: 0,
        subtotal: 0,
        deliveryFee: 0,
        grandTotal: 0,
        processedCart: []
    };

    let locationData = {
        groupId: '1',
        groupName: '',
        phone: '',
        locationName: '',
        zoneName: ''
    };

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('orderNoteInput').value = savedOrderNote;
    });

    window.addEventListener('message', (event) => {
        if (!event.data) return;

        if (event.data.type === 'LOCATION_DATA_UPDATE') {
            locationData = event.data;
            const cartIframe = document.getElementById('cartIframe');
            if (cartIframe && cartIframe.contentWindow) {
                cartIframe.contentWindow.postMessage(event.data, '*');
            }
        }

        if (event.data.type === 'CART_SUMMARY_UPDATE') {
            currentOrderSummary = event.data;
            document.getElementById('cartCountText').textContent = `${event.data.itemsCount} รายการ | ${event.data.totalQty} ชิ้น`;
        }

        if (event.data.type === 'OPEN_LOCATION_MODAL') {
            openLocationModal(event.data.locationsData);
        }

        if (event.data.type === 'OPEN_ZONE_MODAL') {
            closeModal('locationModal'); // ปิดหน้าต่างเลือกสถานที่ทันทีเมื่อเปิดหน้าต่างเลือกโซน
            openZoneModal(event.data.location, event.data.zonesData);
        }

        if (event.data.type === 'CLOSE_LOCATION_MODAL') {
            closeAllModals();
        }
    });

    function openLocationModal(locationsData) {
        closeAllModals();
        const grid = document.getElementById('locationGrid');
        grid.innerHTML = '';

        locationsData.forEach(loc => {
            let icon = '🏨';
            if (loc.name.includes('บาหลี')) icon = '🏝️';
            else if (loc.name.includes('บ้านเขา')) icon = '🏡';
            else if (loc.name.includes('ชิลล์')) icon = '☕';
            else if (loc.name.includes('หน้าร้าน')) icon = '🏪';

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'flex flex-col items-center justify-center p-2.5 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-xl transition cursor-pointer shadow-sm active:scale-95';
            btn.innerHTML = `
                <span class="text-xl mb-1">${icon}</span>
                <span class="text-sm font-bold text-slate-800 text-center leading-tight truncate w-full">${loc.name}</span>
            `;
            btn.onclick = () => {
                const locIframe = document.getElementById('locationIframe');
                if (locIframe && locIframe.contentWindow) {
                    locIframe.contentWindow.postMessage({ type: 'SELECT_LOCATION_ITEM', location: loc }, '*');
                }
            };
            grid.appendChild(btn);
        });

        openModal('locationModal');
    }

    function openZoneModal(loc, zonesData) {
        tempSelectedLocation = loc;
        document.getElementById('zoneModalSubTitle').innerText = `📍 สถานที่: ${loc.name}`;
        const container = document.getElementById('zoneContainer');
        container.innerHTML = '';

        const filteredZones = zonesData.filter(z => String(z.location_id) === String(loc.id));

        if (filteredZones.length === 0) {
            container.innerHTML = '<span class="text-center text-gray-400 text-xs py-6 block">ไม่มีรายการโซนสำหรับสถานที่นี้</span>';
        } else {
            const shortZones = filteredZones.filter(z => z.name.length <= 7);
            const longZones = filteredZones.filter(z => z.name.length > 7);

            if (shortZones.length > 0) {
                const grid3 = document.createElement('div');
                grid3.className = 'grid grid-cols-3 gap-1.5';
                
                shortZones.forEach((z, idx) => {
                    const icon = zoneIcons[idx % zoneIcons.length];
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'flex items-center justify-center gap-1.5 py-2 px-1 bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded-xl transition cursor-pointer shadow-sm active:scale-95 text-center';
                    btn.innerHTML = `
                        <span class="text-sm shrink-0">${icon}</span>
                        <span class="text-sm font-bold text-slate-800 truncate leading-tight">${z.name}</span>
                    `;
                    btn.onclick = () => sendZoneToIframe(z);
                    grid3.appendChild(btn);
                });
                container.appendChild(grid3);
            }

            if (longZones.length > 0) {
                const grid2 = document.createElement('div');
                grid2.className = 'grid grid-cols-2 gap-1.5';
                
                longZones.forEach((z, idx) => {
                    const icon = zoneIcons[(shortZones.length + idx) % zoneIcons.length];
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'flex items-center justify-center gap-1.5 py-2 px-2 bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded-xl transition cursor-pointer shadow-sm active:scale-95 text-center';
                    btn.innerHTML = `
                        <span class="text-sm shrink-0">${icon}</span>
                        <span class="text-sm font-bold text-slate-800 truncate leading-tight">${z.name}</span>
                    `;
                    btn.onclick = () => sendZoneToIframe(z);
                    grid2.appendChild(btn);
                });
                container.appendChild(grid2);
            }
        }

        openModal('zoneModal');
    }

    function sendZoneToIframe(zone) {
        const locIframe = document.getElementById('locationIframe');
        if (locIframe && locIframe.contentWindow) {
            locIframe.contentWindow.postMessage({ type: 'SELECT_ZONE_ITEM', zone: zone, location: tempSelectedLocation }, '*');
        }
        closeAllModals(); // ปิดทุก Modal ทันทีที่เลือกโซนเสร็จ
    }

    function openModal(id) {
        document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    function closeAllModals() {
        closeModal('locationModal');
        closeModal('zoneModal');
    }

    function handleOutsideClick(e, id) {
        if (e.target.id === id) closeModal(id);
    }

    function handleNoteChange(val) {
        savedOrderNote = val;
        localStorage.setItem('orderNote', val);
    }

    function submitOrder() {
        if (!currentOrderSummary.processedCart || currentOrderSummary.processedCart.length === 0) {
            alert('กรุณาเลือกรายการอาหารก่อนส่งออเดอร์');
            return;
        }

        const note = document.getElementById('orderNoteInput').value;

        const orderData = {
            cart: currentOrderSummary.processedCart,
            groupId: locationData.groupId,
            groupName: locationData.groupName,
            customerPhone: locationData.phone,
            orderNote: note,
            locationName: locationData.locationName,
            zoneName: locationData.zoneName,
            subtotal: currentOrderSummary.subtotal,
            deliveryFee: currentOrderSummary.deliveryFee,
            grandTotal: currentOrderSummary.grandTotal,
            createdAt: new Date().toISOString()
        };

        localStorage.setItem('pendingOrder', JSON.stringify(orderData));

        localStorage.removeItem('selectedLocationName');
        localStorage.removeItem('selectedZoneName');
        localStorage.removeItem('orderNote');

        localStorage.setItem('selectedGroupId', 1);
        localStorage.setItem('selectedGroupName', 'ชาวบ้าน');

        window.location.href = 'printorder.html';
    }
</script>
</body>
</html>
