<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Order Popup</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
            background: transparent;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        .popup-card {
            background: #ffffff;
            border-radius: 1.5rem;
            border: 2px solid #22c55e;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
            padding: 1rem;
            width: 100%;
            max-width: 22rem;
            margin: auto;
        }
    </style>
</head>
<body class="p-2 flex items-center justify-center min-h-screen">

    <div class="popup-card">
        <!-- Header -->
        <div class="flex justify-between items-center mb-3">
            <h2 id="foodTitle" class="font-extrabold text-base text-slate-800 flex items-center gap-1.5">
                📌 <span id="foodName">ชื่ออาหาร</span>
            </h2>
            <button type="button" onclick="closePopup()" class="text-slate-400 hover:text-slate-600 text-xl font-bold leading-none">&times;</button>
        </div>

        <!-- Section 1: จำนวน & ราคาพิเศษ (บรรทัดเดียวกันตามรูปที่ 2) -->
        <div class="border border-slate-200 bg-white rounded-2xl p-2.5 mb-3 space-y-2.5 shadow-sm">
            <div class="flex items-center justify-between gap-2">
                <!-- จำนวน -->
                <div class="flex items-center gap-1.5">
                    <span class="text-xs font-bold text-slate-700 whitespace-nowrap">จำนวน</span>
                    <div class="flex items-center border border-slate-300 bg-slate-50 rounded-lg overflow-hidden">
                        <button type="button" onclick="changeQty('main', -1)" class="w-7 h-7 bg-white text-slate-600 font-bold flex items-center justify-center active:bg-slate-200 border-r border-slate-300">-</button>
                        <span id="displayMainQty" class="w-7 text-center font-bold text-xs text-slate-800">1</span>
                        <button type="button" onclick="changeQty('main', 1)" class="w-7 h-7 bg-white text-slate-600 font-bold flex items-center justify-center active:bg-slate-200 border-l border-slate-300">+</button>
                    </div>
                </div>

                <!-- ราคาพิเศษ -->
                <div class="flex items-center gap-1">
                    <span class="text-xs font-bold text-amber-600 whitespace-nowrap">ราคาพิเศษ</span>
                    <input type="number" id="customPriceInput" placeholder="ระบุราคา" class="w-20 p-1 border border-amber-300 rounded-lg text-xs text-right font-bold text-amber-700 focus:outline-none focus:border-amber-500 bg-amber-50/30">
                </div>
            </div>

            <!-- Section 2: ไข่ดาว & ไข่เจียว (บรรทัดเดียวกันตามรูปที่ 2) -->
            <div id="eggContainer" class="flex items-center justify-between gap-1 pt-2 border-t border-slate-100">
                <!-- ไข่ดาว -->
                <div class="flex items-center gap-1">
                    <span class="text-xs font-bold text-slate-700 flex items-center gap-0.5 whitespace-nowrap"><i class="fa-solid font-normal fa-magnifying-glass text-[10px] text-slate-400"></i> ไข่ดาว</span>
                    <div class="flex items-center border border-slate-300 bg-slate-50 rounded-lg overflow-hidden">
                        <button type="button" onclick="changeQty('egg1', -1)" class="w-6 h-7 bg-white text-slate-600 font-bold flex items-center justify-center active:bg-slate-200 border-r border-slate-300">-</button>
                        <span id="displayEgg1Qty" class="w-6 text-center font-bold text-xs text-slate-800">0</span>
                        <button type="button" onclick="changeQty('egg1', 1)" class="w-6 h-7 bg-white text-slate-600 font-bold flex items-center justify-center active:bg-slate-200 border-l border-slate-300">+</button>
                    </div>
                </div>

                <!-- ไข่เจียว -->
                <div class="flex items-center gap-1">
                    <span class="text-xs font-bold text-slate-700 flex items-center gap-0.5 whitespace-nowrap"><i class="fa-solid font-normal fa-magnifying-glass text-[10px] text-slate-400"></i> ไข่เจียว</span>
                    <div class="flex items-center border border-slate-300 bg-slate-50 rounded-lg overflow-hidden">
                        <button type="button" onclick="changeQty('egg2', -1)" class="w-6 h-7 bg-white text-slate-600 font-bold flex items-center justify-center active:bg-slate-200 border-r border-slate-300">-</button>
                        <span id="displayEgg2Qty" class="w-6 text-center font-bold text-xs text-slate-800">0</span>
                        <button type="button" onclick="changeQty('egg2', 1)" class="w-6 h-7 bg-white text-slate-600 font-bold flex items-center justify-center active:bg-slate-200 border-l border-slate-300">+</button>
                    </div>
                </div>
            </div>

            <!-- Section 3: หมายเหตุ -->
            <div class="pt-2 border-t border-slate-100 flex items-center gap-2">
                <span class="text-xs font-bold text-slate-700 whitespace-nowrap">หมายเหตุ</span>
                <input type="text" id="detailNoteInput" placeholder="(เช่น เผ็ดน้อย, ไม่ใส่ผัก)" class="w-full p-1.5 border border-slate-300 rounded-lg text-xs focus:outline-none focus:border-emerald-500 bg-slate-50/50">
            </div>
        </div>

        <!-- ปุ่มบันทึก -->
        <button type="button" id="btnSave" onclick="submitOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-2.5 rounded-xl text-xs shadow transition flex items-center justify-center gap-1">
            ✓ บันทึกรายการ
        </button>
    </div>

    <script>
        let foodData = null;
        let mainQty = 1;
        let egg1Qty = 0;
        let egg2Qty = 0;

        // รับข้อมูลจาก Parent Window (OrderEntity.html)
        window.addEventListener('message', function(event) {
            const data = event.data;
            if (data && data.action === 'initFoodDetail') {
                foodData = data.food;
                document.getElementById('foodName').textContent = foodData.name || 'รายการอาหาร';

                // ซ่อน/แสดง โซนไข่ดาว-ไข่เจียว
                const isSingleDish = data.isSingleDish;
                document.getElementById('eggContainer').style.display = isSingleDish ? 'flex' : 'none';

                // โหลดค่าเดิม กรณีเป็นการแก้ไขรายการ
                if (data.editingItem) {
                    mainQty = data.editingItem.qty || 1;
                    egg1Qty = data.editingItem.egg1 || 0;
                    egg2Qty = data.editingItem.egg2 || 0;
                    document.getElementById('customPriceInput').value = data.editingItem.isCustomPrice ? data.editingItem.price_1 : '';
                    document.getElementById('detailNoteInput').value = data.editingItem.note || '';
                    document.getElementById('btnSave').textContent = '✓ บันทึกการแก้ไข';
                } else {
                    mainQty = 1;
                    egg1Qty = 0;
                    egg2Qty = 0;
                    document.getElementById('customPriceInput').value = '';
                    document.getElementById('detailNoteInput').value = '';
                    document.getElementById('btnSave').textContent = '✓ บันทึกรายการ';
                }

                updateDisplay();
            }
        });

        function changeQty(type, delta) {
            if (type === 'main') mainQty = Math.max(1, mainQty + delta);
            else if (type === 'egg1') egg1Qty = Math.max(0, egg1Qty + delta);
            else if (type === 'egg2') egg2Qty = Math.max(0, egg2Qty + delta);
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('displayMainQty').textContent = mainQty;
            document.getElementById('displayEgg1Qty').textContent = egg1Qty;
            document.getElementById('displayEgg2Qty').textContent = egg2Qty;
        }

        function closePopup() {
            window.parent.postMessage({ action: 'closePopup' }, '*');
        }

        function submitOrder() {
            const customPriceVal = parseFloat(document.getElementById('customPriceInput').value);
            const isCustomPrice = !isNaN(customPriceVal) && customPriceVal > 0;
            const note = document.getElementById('detailNoteInput').value.trim();

            window.parent.postMessage({
                action: 'saveOrderDetail',
                payload: {
                    food: foodData,
                    mainQty: mainQty,
                    egg1Qty: egg1Qty,
                    egg2Qty: egg2Qty,
                    customPriceVal: isCustomPrice ? customPriceVal : null,
                    note: note
                }
            }, '*');
        }
    </script>
</body>
</html>
