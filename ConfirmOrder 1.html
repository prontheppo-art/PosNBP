<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>ยำ Take Order - ตรวจสอบออเดอร์</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --border-color: #334155;
            --primary: #2563eb;
            --success: #16a34a;
        }

        html, body {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            -webkit-text-size-adjust: 100%;
            background-color: var(--bg-color);
            color: #1e293b;
            font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
        }

        .page-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 672px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .fixed-header {
            flex-shrink: 0;
            padding: 12px 12px 6px 12px;
            background-color: var(--bg-color);
            z-index: 10;
        }

        .main-content-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 6px 12px 0 12px;
            gap: 8px;
        }

        .cart-preview-box {
            background-color: #ffffff;
            border: 2px dashed #16a34a;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .cart-preview-header {
            flex-shrink: 0;
        }

        .scrollable-items {
            flex: 1;
            overflow-y: auto;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            padding-right: 2px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .cart-item-row:last-child {
            border-bottom: none;
        }

        .delete-btn {
            color: #ef4444;
            font-weight: bold;
            font-size: 16px;
            padding: 0 4px;
            cursor: pointer;
            line-height: 1;
            border: none;
            background: transparent;
        }

        .delete-btn:hover {
            color: #b91c1c;
        }

        .group-btn-v2 {
            background-color: #ffffff;
            border: 1.5px solid #fde68a;
            color: #334155;
            transition: all 0.2s ease;
        }

        .group-btn-v2.active {
            background-color: #f59e0b;
            border-color: #d97706;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(245, 158, 11, 0.3);
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .custom-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .custom-modal-box {
            background: white;
            border-radius: 20px;
            padding: 20px;
            width: 92%;
            max-width: 440px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

<div class="page-container">

    <div class="fixed-header">
        <div class="bg-amber-50/50 border border-amber-200/80 rounded-2xl p-3 shadow-sm space-y-2.5">
            
            <div class="grid grid-cols-3 gap-2" id="groupSelectorContainer">
                <button type="button" onclick="selectCustomerGroup(1, 'ชาวบ้าน')" id="btn-group-1" class="group-btn-v2 active py-2.5 px-1 rounded-xl flex items-center justify-center gap-1.5 cursor-pointer font-bold text-xs">
                    <span class="text-sm">🏡</span>
                    <span>ชาวบ้าน</span>
                </button>

                <button type="button" onclick="selectCustomerGroup(2, 'นักท่องเที่ยว')" id="btn-group-2" class="group-btn-v2 py-2.5 px-1 rounded-xl flex items-center justify-center gap-1.5 cursor-pointer font-bold text-xs">
                    <span class="text-sm">🧳</span>
                    <span>นักท่องเที่ยว</span>
                </button>

                <button type="button" onclick="selectCustomerGroup(3, 'สบายดี')" id="btn-group-3" class="group-btn-v2 py-2.5 px-1 rounded-xl flex items-center justify-center gap-1.5 cursor-pointer font-bold text-xs">
                    <span class="text-sm">😊</span>
                    <span>สบายดี</span>
                </button>
            </div>

            <div class="flex gap-2 items-center">
                <div id="phoneInputWrapper" class="flex-1 relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-700 text-xs">📞</span>
                    <input type="tel" id="customerPhoneInput" oninput="formatPhoneInput(this); handlePhoneChange(this.value);" placeholder="เบอร์โทรศัพท์ลูกค้า (ถ้ามี)" maxlength="12" class="w-full pl-8 pr-2 py-2.5 border border-amber-200/80 rounded-xl text-xs bg-white text-slate-800 outline-none focus:border-amber-500 font-medium placeholder-gray-400">
                </div>

                <div id="locationBtnContainer" class="w-5/12 hidden">
                    <button type="button" id="btnSelectLocation" onclick="openLocationModal()" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-bold py-2.5 px-2 rounded-xl text-xs flex items-center justify-center gap-1 shadow-sm transition truncate">
                        <span>📍</span>
                        <span id="locationBtnText" class="truncate">เลือกสถานที่</span>
                    </button>
                </div>
            </div>
            
            <input type="hidden" id="customerGroupSelect" value="1">
            <input type="hidden" id="selectedGroupName" value="ชาวบ้าน">
            <input type="hidden" id="selectedLocationName" value="">
            <input type="hidden" id="selectedZoneName" value="">
        </div>
    </div>

    <div class="main-content-box">
        <div class="flex justify-between items-center px-1 text-xs font-bold text-slate-700 shrink-0">
            <span class="flex items-center gap-1.5">🛒 ตะกร้าสินค้าปัจจุบัน:</span>
            <span id="cartCountText" class="text-green-600 font-extrabold text-sm">0 รายการ | 0 ชิ้น</span>
        </div>

        <div class="cart-preview-box">
            <div class="cart-preview-header flex justify-between items-center mb-3 pb-2 border-b border-dashed border-green-300">
                <div class="font-bold text-green-700 text-sm flex items-center gap-1.5">
                    📋 รายการที่เลือกไว้แล้ว
                </div>
                <div id="cartTotalPrice" class="font-black text-red-600 text-sm">รวม 0.-</div>
            </div>
            
            <div class="scrollable-items">
                <div id="cartPreviewList" class="flex flex-col">
                    <span class="text-gray-400 text-xs py-4 text-center block">⏳ กำลังโหลดรายการ...</span>
                </div>
            </div>
        </div>

        <div class="bg-white border border-slate-200 rounded-2xl p-3 shadow-sm shrink-0 mb-20">
            <label class="block text-xs font-bold text-slate-700 mb-1">หมายเหตุออเดอร์ (ถ้ามี):</label>
            <input type="text" id="orderNoteInput" oninput="handleNoteChange(this.value);" placeholder="เช่น ใส่กล่องแยกน้ำ, ทานที่นี่..." class="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 outline-none">
        </div>
    </div>

</div>

<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-3 shadow-lg z-50">
    <div class="max-w-2xl mx-auto flex gap-2">
        <a href="index.html" class="bg-white hover:bg-gray-50 text-slate-800 border border-slate-300 font-bold py-2.5 px-3 rounded-xl text-xs flex-1 text-center shadow transition flex items-center justify-center">
            ⬅️ กลับไปแก้ไข
        </a>
        <button onclick="submitOrder()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-3 rounded-xl text-xs flex-1 text-center shadow transition">
            ✅ บันทึก / ส่งออเดอร์
        </button>
    </div>
</div>

<div id="locationModal" class="custom-modal-overlay" onclick="handleOutsideClick(event, 'locationModal')">
    <div class="custom-modal-box border-t-4 border-amber-500">
        <div class="flex justify-between items-center mb-3 pb-2 border-b">
            <h3 class="font-bold text-base text-slate-800 flex items-center gap-1.5">📍 เลือก Location</h3>
            <button onclick="closeModal('locationModal')" class="text-gray-400 hover:text-gray-600 font-bold text-lg px-1">✕</button>
        </div>
        <div id="locationGrid" class="grid grid-cols-2 gap-2.5 overflow-y-auto py-1 pr-1 max-h-[60vh]"></div>
    </div>
</div>

<div id="zoneModal" class="custom-modal-overlay" onclick="handleOutsideClick(event, 'zoneModal')">
    <div class="custom-modal-box border-t-4 border-blue-500">
        <div class="flex justify-between items-center mb-3 pb-2 border-b">
            <div>
                <h3 class="font-bold text-base text-slate-800 flex items-center gap-1.5">🏷️ เลือก Zone / ห้องพัก</h3>
                <span id="zoneModalSubTitle" class="text-xs text-amber-600 font-semibold block"></span>
            </div>
            <button onclick="closeModal('zoneModal')" class="text-gray-400 hover:text-gray-600 font-bold text-lg px-1">✕</button>
        </div>
        <div id="zoneGrid" class="grid grid-cols-2 gap-2.5 overflow-y-auto py-1 pr-1 max-h-[60vh]"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://wmhweeeyulhmoilypklz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_yXKK7aSunM_KCqRiUhGupQ__Qs1nyCd';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let locationsData = [];
    let zonesData = [];
    let tempSelectedLocation = null;
    let isDeliveryFeeDismissed = false;

    let savedTouristLocation = localStorage.getItem('selectedLocationName') || '';
    let savedTouristZone = localStorage.getItem('selectedZoneName') || '';
    let savedCustomerPhone = localStorage.getItem('customerPhone') || '';
    let savedOrderNote = localStorage.getItem('orderNote') || '';

    document.addEventListener('touchmove', function (event) {
        if (!event.target.closest('.scrollable-items') && !event.target.closest('.custom-modal-box')) {
            event.preventDefault();
        }
    }, { passive: false });

    window.addEventListener('DOMContentLoaded', async () => {
        await fetchLocationsAndZones();

        document.getElementById('customerPhoneInput').value = savedCustomerPhone;
        document.getElementById('orderNoteInput').value = savedOrderNote;

        // ล็อก Default เป็น "ชาวบ้าน"
        selectCustomerGroup(1, 'ชาวบ้าน');

        renderOrderSummary();
    });

    function handlePhoneChange(val) {
        savedCustomerPhone = val;
        localStorage.setItem('customerPhone', val);
    }

    function handleNoteChange(val) {
        savedOrderNote = val;
        localStorage.setItem('orderNote', val);
    }

    function formatPhoneInput(input) {
        let value = input.value.replace(/\D/g, '');
        if (value.length > 10) value = value.slice(0, 10);
        
        if (value.length > 6) {
            input.value = `${value.slice(0, 3)}-${value.slice(3, 6)}-${value.slice(6)}`;
        } else if (value.length > 3) {
            input.value = `${value.slice(0, 3)}-${value.slice(3)}`;
        } else {
            input.value = value;
        }
    }

    async function fetchLocationsAndZones() {
        try {
            const [locRes, zoneRes] = await Promise.all([
                supabaseClient.from('locations').select('*'),
                supabaseClient.from('zones').select('*')
            ]);

            if (locRes.data) locationsData = locRes.data;
            if (zoneRes.data) zonesData = zoneRes.data;
        } catch (err) {
            console.error('Error fetching locations/zones:', err);
        }
    }

    function selectCustomerGroup(groupId, groupName) {
        isDeliveryFeeDismissed = false;
        localStorage.setItem('selectedGroupId', groupId);

        const locationBtnContainer = document.getElementById('locationBtnContainer');

        if (groupId === 2) {
            locationBtnContainer.classList.remove('hidden');

            if (savedTouristLocation && savedTouristZone) {
                document.getElementById('selectedLocationName').value = savedTouristLocation;
                document.getElementById('selectedZoneName').value = savedTouristZone;
                
                let displayLocationText = savedTouristLocation;
                if (savedTouristZone && savedTouristZone !== savedTouristLocation) {
                    displayLocationText += ` - ${savedTouristZone}`;
                }
                document.getElementById('locationBtnText').innerText = displayLocationText;
                applyCustomerGroupSelection(2, `นักท่องเที่ยว (${displayLocationText})`);
            } else {
                document.getElementById('locationBtnText').innerText = 'เลือกสถานที่';
                applyCustomerGroupSelection(2, 'นักท่องเที่ยว');
                openLocationModal();
            }
        } else {
            locationBtnContainer.classList.add('hidden');
            document.getElementById('selectedLocationName').value = '';
            document.getElementById('selectedZoneName').value = '';
            applyCustomerGroupSelection(groupId, groupName);
        }
    }

    function openLocationModal() {
        const grid = document.getElementById('locationGrid');
        grid.innerHTML = '';

        locationsData.forEach(loc => {
            let icon = '🏨';
            if (loc.name.includes('บาหลี')) icon = '🏝️';
            else if (loc.name.includes('บ้านเขา')) icon = '🏡';
            else if (loc.name.includes('ชิลล์')) icon = '☕';
            else if (loc.name.includes('หน้าร้าน')) icon = '🏪';

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'flex flex-col items-center justify-center p-3 bg-amber-50 hover:bg-amber-100 border-2 border-amber-200 rounded-xl transition cursor-pointer shadow-sm active:scale-95';
            btn.innerHTML = `
                <span class="text-2xl mb-1">${icon}</span>
                <span class="text-xs font-bold text-slate-800 text-center leading-tight">${loc.name}</span>
            `;
            btn.onclick = () => selectLocation(loc);
            grid.appendChild(btn);
        });

        openModal('locationModal');
    }

    function selectLocation(loc) {
        tempSelectedLocation = loc;
        closeModal('locationModal');

        if (loc.name.includes('หน้าร้าน')) {
            const defaultZone = zonesData.find(z => String(z.location_id) === String(loc.id) && z.name.includes('หน้าร้าน')) 
                             || zonesData.find(z => String(z.location_id) === String(loc.id))
                             || { name: 'หน้าร้าน' };
            selectZone(defaultZone);
        } else {
            openZoneModal(loc);
        }
    }

    function openZoneModal(loc) {
        document.getElementById('zoneModalSubTitle').innerText = `📍 สถานที่: ${loc.name}`;
        const grid = document.getElementById('zoneGrid');
        grid.innerHTML = '';

        const filteredZones = zonesData.filter(z => String(z.location_id) === String(loc.id));

        if (filteredZones.length === 0) {
            grid.innerHTML = '<span class="col-span-2 text-center text-gray-400 text-xs py-6">ไม่มีรายการ Zone สำหรับสถานที่นี้</span>';
        } else {
            filteredZones.forEach(z => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'flex items-center gap-2 p-3 bg-blue-50 hover:bg-blue-100 border-2 border-blue-200 rounded-xl transition cursor-pointer shadow-sm active:scale-95';
                btn.innerHTML = `
                    <span class="text-lg">🔑</span>
                    <span class="text-xs font-bold text-slate-800 truncate">${z.name}</span>
                `;
                btn.onclick = () => selectZone(z);
                grid.appendChild(btn);
            });
        }

        openModal('zoneModal');
    }

    function selectZone(zone) {
        const locName = tempSelectedLocation ? tempSelectedLocation.name : '';
        const zoneName = zone.name;

        savedTouristLocation = locName;
        savedTouristZone = zoneName;

        localStorage.setItem('selectedLocationName', locName);
        localStorage.setItem('selectedZoneName', zoneName);

        document.getElementById('selectedLocationName').value = locName;
        document.getElementById('selectedZoneName').value = zoneName;

        let displayLocationText = locName;
        if (zoneName && zoneName !== locName) {
            displayLocationText += ` - ${zoneName}`;
        }
        document.getElementById('locationBtnText').innerText = displayLocationText;

        applyCustomerGroupSelection(2, `นักท่องเที่ยว (${displayLocationText})`);
        closeModal('zoneModal');
    }

    function applyCustomerGroupSelection(groupId, groupName) {
        document.getElementById('customerGroupSelect').value = groupId;
        document.getElementById('selectedGroupName').value = groupName;

        localStorage.setItem('selectedGroupName', groupName);

        document.querySelectorAll('.group-btn-v2').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-group-${groupId}`).classList.add('active');

        renderOrderSummary();
    }

    function getGroupBasePrice(item, groupId) {
        const gId = Number(groupId);
        if (gId === 1) return Number(item.price_group_1 ?? item.price ?? 0);
        if (gId === 2) return Number(item.price_group_2 ?? item.price ?? 0);
        if (gId === 3) return Number(item.price_group_3 ?? item.price ?? 0);
        return Number(item.price ?? 0);
    }

    function buildItemNoteText(item) {
        const parts = [];
        const egg = Number(item.fried_egg || 0);
        const omelet = Number(item.omelet || 0);
        const note = (item.note || '').trim();

        if (egg > 0) parts.push(`ไข่ดาว ${egg}`);
        if (omelet > 0) parts.push(`ไข่เจียว ${omelet}`);
        if (note) parts.push(note);

        return parts.join(', ');
    }

    function removeDeliveryFee() {
        isDeliveryFeeDismissed = true;
        renderOrderSummary();
    }

    function renderOrderSummary() {
        const listContainer = document.getElementById('cartPreviewList');
        const cartTotalPrice = document.getElementById('cartTotalPrice');
        const cartCountText = document.getElementById('cartCountText');
        const selectedGroupId = document.getElementById('customerGroupSelect').value;
        const locationName = document.getElementById('selectedLocationName').value || '';

        const totalItems = cart.length;
        const totalQty = cart.reduce((sum, item) => sum + (Number(item.qty) || 1), 0);
        cartCountText.innerText = `${totalItems} รายการ | ${totalQty} ชิ้น`;

        if (!cart || cart.length === 0) {
            listContainer.innerHTML = '<span class="text-gray-400 text-xs py-4 text-center block">ยังไม่มีรายการอาหารในออเดอร์</span>';
            cartTotalPrice.innerText = 'รวม 0.-';
            return;
        }

        let processedCart = cart.map((item, originalIndex) => {
            const itemQty = Number(item.qty) || 1;
            const baseUnitPrice = getGroupBasePrice(item, selectedGroupId);

            const eggCount = Number(item.fried_egg || 0);
            const omeletCount = Number(item.omelet || 0);
            const addonPerUnit = (eggCount * 10) + (omeletCount * 10);

            const unitPriceWithAddon = baseUnitPrice + addonPerUnit;
            const itemTotal = unitPriceWithAddon * itemQty;
            const displayNote = buildItemNoteText(item);

            return {
                ...item,
                originalIndex: originalIndex,
                itemQty: itemQty,
                unitPriceWithAddon: unitPriceWithAddon,
                itemTotal: itemTotal,
                cleanDisplayNote: displayNote
            };
        });

        processedCart.sort((a, b) => a.unitPriceWithAddon - b.unitPriceWithAddon);

        let foodTotal = 0;
        listContainer.innerHTML = '';

        processedCart.forEach((item) => {
            foodTotal += item.itemTotal;

            const row = document.createElement('div');
            row.className = 'cart-item-row';
            row.innerHTML = `
                <div class="flex-1 pr-2">
                    <div class="font-bold text-xs text-slate-800">
                        ${item.name || 'รายการอาหาร'} 
                        <span class="text-blue-600">(${item.unitPriceWithAddon.toLocaleString()}.-)</span>
                        <span class="text-emerald-600 font-extrabold ml-1">x${item.itemQty}</span>
                        ${item.cleanDisplayNote ? `<span class="text-red-500 font-bold text-[11px] ml-1">(${item.cleanDisplayNote})</span>` : ''}
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <div class="font-bold text-xs text-slate-800 min-w-[50px] text-right">
                        ${item.itemTotal.toLocaleString()}.-
                    </div>
                    <button type="button" onclick="removeCartItem(${item.originalIndex})" class="delete-btn" title="ลบรายการ">✕</button>
                </div>
            `;
            listContainer.appendChild(row);
        });

        let deliveryFee = 0;
        const isTourist = (String(selectedGroupId) === '2');
        const isStoreFront = locationName.includes('หน้าร้าน');

        if (isTourist && !isStoreFront && foodTotal < 300 && !isDeliveryFeeDismissed) {
            deliveryFee = 20;

            const feeRow = document.createElement('div');
            feeRow.className = 'cart-item-row bg-amber-50/60 px-2 rounded-lg my-1 border border-amber-200';
            feeRow.innerHTML = `
                <div class="flex-1 pr-2">
                    <div class="font-bold text-xs text-amber-900 flex items-center gap-1">
                        🛵 ค่าบริการจัดส่ง <span class="text-[10px] font-normal text-amber-700">(สั่งไม่ถึง 300.-)</span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <div class="font-bold text-xs text-amber-900 min-w-[50px] text-right">
                        20.-
                    </div>
                    <button type="button" onclick="removeDeliveryFee()" class="delete-btn" title="ยกเว้นค่าจัดส่ง">✕</button>
                </div>
            `;
            listContainer.appendChild(feeRow);
        }

        const grandTotal = foodTotal + deliveryFee;
        cartTotalPrice.innerText = `รวม ${grandTotal.toLocaleString()}.-`;
    }

    function removeCartItem(index) {
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        renderOrderSummary();
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function handleOutsideClick(e, id) {
        if (e.target.id === id) closeModal(id);
    }

    // 📌 ส่งผ่านออเดอร์ไปยัง PrintOrder.html
    function submitOrder() {
        if (cart.length === 0) {
            alert('ไม่มีรายการอาหารในตะกร้า');
            return;
        }

        const customerGroupId = document.getElementById('customerGroupSelect').value;
        const rawGroupName = document.getElementById('selectedGroupName').value;
        const locationName = document.getElementById('selectedLocationName').value;
        const zoneName = document.getElementById('selectedZoneName').value;
        
        const phoneInput = document.getElementById('customerPhoneInput').value.trim();
        const orderNote = document.getElementById('orderNoteInput').value.trim();

        if (customerGroupId === '2') {
            if (!locationName || !zoneName) {
                alert('กรุณาเลือก Location และ Zone สำหรับนักท่องเที่ยว');
                openLocationModal();
                return;
            }

            const rawPhoneDigits = phoneInput.replace(/\D/g, '');
            if (rawPhoneDigits.length > 0 && rawPhoneDigits.length !== 10) {
                alert('กรุณากรอกเบอร์โทรศัพท์ให้ครบ 10 หลัก (หรือเว้นว่างไว้หากไม่มี)');
                document.getElementById('customerPhoneInput').focus();
                return;
            }
        }

        let foodTotal = 0;
        let totalQty = 0;

        const finalOrderItems = cart.map(item => {
            const itemQty = Number(item.qty) || 1;
            const baseUnitPrice = getGroupBasePrice(item, customerGroupId);
            const eggCount = Number(item.fried_egg || 0);
            const omeletCount = Number(item.omelet || 0);
            const addonPerUnit = (eggCount * 10) + (omeletCount * 10);

            const unitPriceWithAddon = baseUnitPrice + addonPerUnit;
            const itemTotalPrice = unitPriceWithAddon * itemQty;
            
            foodTotal += itemTotalPrice;
            totalQty += itemQty;

            const cleanNote = buildItemNoteText(item);

            return {
                food_id: item.food_id || item.id,
                name: item.name,
                qty: itemQty,
                price: itemTotalPrice,
                note: cleanNote
            };
        });

        let deliveryFee = 0;
        const isTourist = (String(customerGroupId) === '2');
        const isStoreFront = locationName.includes('หน้าร้าน');

        if (isTourist && !isStoreFront && foodTotal < 300 && !isDeliveryFeeDismissed) {
            deliveryFee = 20;
            finalOrderItems.push({
                food_id: 0,
                name: "ค่าบริการจัดส่ง",
                qty: 1,
                price: 20,
                note: "สั่งไม่ถึง 300 บาท",
                isDeliveryFee: true
            });
        }

        const grandTotal = foodTotal + deliveryFee;

        const pendingPayload = {
            customer_group: rawGroupName,
            location_name: locationName || null,
            zone_name: zoneName || null,
            customer_phone: (customerGroupId === '2' && phoneInput) ? phoneInput : null,
            note: orderNote || null,
            total_price: grandTotal,
            total_qty: totalQty,
            items: finalOrderItems,
            status: 'pending',
            created_at: new Date().toISOString()
        };

        // ฝากข้อมูลลง LocalStorage เพื่อให้ PrintOrder.html ดึงไปใช้ต่อ
        localStorage.setItem('pendingOrderData', JSON.stringify(pendingPayload));
        
        // ข้ามไปยังหน้า PrintOrder.html
        window.location.href = 'PrintOrder.html';
    }
</script>

</body>
</html>
