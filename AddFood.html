<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>ระบบจัดการเมนูอาหาร</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- ดึงการเชื่อมต่อ Supabase จากไฟล์ key.js -->
    <script src="key.js"></script>

    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #f4f6f9;
        touch-action: pan-y;
        -webkit-text-size-adjust: 100%;
        -webkit-user-select: none;
        user-select: none;
      }

      .app-layout {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100dvh;
        max-width: 480px;
        margin: 0 auto;
        background: #fff;
        box-sizing: border-box;
        overflow: hidden;
        padding: 20px 16px 16px 16px;
      }

      .header-section {
        background: #fff;
        z-index: 10;
        flex-shrink: 0;
      }

      .content-section {
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        -webkit-overflow-scrolling: touch;
        min-height: 0;
      }

      .footer-section {
        background: #fff;
        z-index: 10;
        flex-shrink: 0;
      }
    </style>
</head>
<body class="bg-gray-100 flex items-start justify-center">

    <div class="w-full bg-white rounded-3xl shadow-2xl app-layout">
        
        <!-- ส่วนหัว (Header) -->
        <div class="header-section pb-2">
            <h2 class="text-2xl font-black text-red-500 text-center mb-4 tracking-tight">ระบบจัดการเมนูอาหาร</h2>
            
            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <label class="block text-xs font-bold text-gray-700">หมวดหมู่</label>
                    <button type="button" onclick="openCategoryManagerModal()" class="text-[11px] font-bold text-blue-600 hover:text-blue-700 bg-blue-50 px-2.5 py-1 rounded-full transition flex items-center gap-1 shadow-2xs">
                        ✏️ จัดการกลุ่มรายการ
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div class="relative">
                        <button type="button" onclick="toggleDropdown()" id="categorySelectBtn" class="w-full border border-gray-300 rounded-2xl px-3 py-2 text-xs outline-none bg-white font-medium text-left flex items-center justify-between text-gray-700 shadow-2xs">
                            <span id="selectedCategoryText" class="truncate">-- แสดงทั้งหมด --</span>
                            <span class="text-gray-400 text-[10px] shrink-0 ml-1">▼</span>
                        </button>
                        
                        <div id="categoryDropdownPopup" class="hidden absolute left-0 top-full mt-1.5 bg-white border border-gray-200 rounded-2xl shadow-2xl z-50 p-1.5 space-y-1 w-max min-w-full max-h-48 overflow-y-auto"></div>
                    </div>

                    <input type="text" id="menuNameInput" placeholder="เช่น ส้มตำไทย" class="w-full border border-gray-300 rounded-2xl px-3 py-2 text-xs outline-none focus:border-red-400 transition">
                </div>
            </div>
            
            <hr class="border-gray-100 my-3">
            <div class="text-xs font-bold text-gray-700 mb-2 flex items-center gap-1">
                <span class="text-red-500 font-bold">❌</span> เพื่อลบ / แตะเพื่อแก้ไขข้อมูล:
            </div>
        </div>
        
        <!-- รายการเมนูอาหาร -->
        <div class="content-section py-1">
            <div id="menuListContainer" class="grid grid-cols-2 gap-2.5 pr-1 content-start">
                <div class="col-span-2 text-center text-gray-400 text-xs py-8">⏳ กำลังโหลดรายการอาหาร...</div>
            </div>
        </div>

        <!-- ปุ่มล่างสุด (Footer) -->
        <div class="footer-section pt-3 border-t border-gray-100">
            <div class="grid grid-cols-2 gap-3">
                <a href="PageAdmin.html" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 rounded-2xl text-xs text-center transition flex items-center justify-center gap-1.5 shadow-2xs">
                    🔑 กลับผู้ดูแลระบบ
                </a>
                <button onclick="handleSaveMenu()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-2xl text-xs transition flex items-center justify-center gap-1.5 shadow-xs">
                    💾 บันทึก
                </button>
            </div>
        </div>
    </div>

    <!-- Pop-up แก้ไขเมนูอาหาร -->
    <div id="editMenuModal" onclick="handleOutsideClick(event, 'editMenuModal')" class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white w-full max-w-xs rounded-3xl shadow-2xl p-5 text-left space-y-3">
            <div class="flex items-center justify-between border-b border-gray-100 pb-2">
                <h3 id="modalFoodTitle" class="font-bold text-sm text-gray-800 flex items-center gap-1.5">
                    <span>✏️</span> แก้ไขรายการอาหาร
                </h3>
                <button onclick="closeModal('editMenuModal')" class="text-gray-400 hover:text-gray-600 text-sm font-bold">✕</button>
            </div>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-[11px] font-bold text-gray-600 mb-1">กลุ่มอาหาร (หมวดหมู่):</label>
                    <select id="modalCategorySelect" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs outline-none bg-white font-medium text-gray-800 focus:border-indigo-500 transition">
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-gray-600 mb-1">ชื่อรายการอาหาร:</label>
                    <input type="text" id="modalMenuNameInput" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs outline-none bg-gray-50 font-medium text-gray-800 focus:bg-white transition">
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-gray-600 mb-1.5">ราคาตามกลุ่มลูกค้า:</label>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="bg-gray-50 p-2 rounded-xl border border-gray-200 flex flex-col items-center">
                            <span class="text-[10px] font-bold text-gray-600 truncate mb-1 w-full text-center">ชาวบ้าน</span>
                            <input type="number" id="modal_price_1" min="0" step="any" class="w-full border border-gray-300 rounded-lg py-1 px-1 text-center text-xs outline-none bg-white font-bold text-emerald-600">
                        </div>
                        <div class="bg-gray-50 p-2 rounded-xl border border-gray-200 flex flex-col items-center">
                            <span class="text-[10px] font-bold text-gray-600 truncate mb-1 w-full text-center">นักท่องเที่ยว</span>
                            <input type="number" id="modal_price_2" min="0" step="any" class="w-full border border-gray-300 rounded-lg py-1 px-1 text-center text-xs outline-none bg-white font-bold text-emerald-600">
                        </div>
                        <div class="bg-gray-50 p-2 rounded-xl border border-gray-200 flex flex-col items-center">
                            <span class="text-[10px] font-bold text-gray-600 truncate mb-1 w-full text-center">สบายดี</span>
                            <input type="number" id="modal_price_3" min="0" step="any" class="w-full border border-gray-300 rounded-lg py-1 px-1 text-center text-xs outline-none bg-white font-bold text-emerald-600">
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="closeModal('editMenuModal')" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2.5 rounded-xl text-xs transition">ปิดหน้าต่าง</button>
                <button onclick="handleUpdateMenuFromModal()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-2xs">บันทึกราคา</button>
            </div>
        </div>
    </div>

    <!-- Modal จัดการกลุ่มรายการ -->
    <div id="categoryManagerModal" onclick="handleOutsideClick(event, 'categoryManagerModal')" class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-5 flex flex-col space-y-3 max-h-[80vh]">
            <div class="flex items-center justify-between border-b border-gray-100 pb-2">
                <h3 class="font-bold text-sm text-gray-800">จัดการกลุ่มรายการอาหาร</h3>
                <button onclick="closeModal('categoryManagerModal')" class="text-gray-400 hover:text-gray-600 text-sm font-bold">✕</button>
            </div>

            <div class="bg-gray-50 p-2.5 rounded-2xl border border-gray-200 space-y-2">
                <div class="flex gap-2">
                    <input type="text" id="editCategoryInput" placeholder="ชื่อกลุ่มรายการ..." class="flex-1 border border-gray-300 rounded-xl px-3 py-1.5 text-xs outline-none bg-white">
                    <button onclick="handleSaveCategoryAction()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition shrink-0">เพิ่ม</button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto space-y-1.5 pr-1" id="modalCategoryListContainer"></div>
        </div>
    </div>

    <!-- Modal แจ้งเตือน -->
    <div id="alertModal" onclick="handleOutsideClick(event, 'alertModal')" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white w-full max-w-xs rounded-3xl shadow-2xl p-5 text-center space-y-3">
            <div id="alertIcon" class="text-3xl">⚠️</div>
            <h3 id="alertTitle" class="font-bold text-sm text-gray-800">แจ้งเตือน</h3>
            <p id="alertMessage" class="text-xs text-gray-600"></p>
            <button onclick="closeModal('alertModal')" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 rounded-xl text-xs">ตกลง</button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
      let state = {
          menus: [],
          categories: [],
          selectedCategory: 'all', 
          activeFoodId: null
      };

      window.addEventListener('DOMContentLoaded', async () => {
          if (typeof supabaseClient === 'undefined') {
              showAlert('ข้อผิดพลาด', 'ไม่พบการเชื่อมต่อ Supabase ในไฟล์ key.js');
              return;
          }

          try {
              await initAppData();
          } catch (err) {
              showAlert('เกิดข้อผิดพลาดในการโหลดระบบ', err.message);
          }
          
          window.addEventListener('click', (e) => {
              const btn = document.getElementById('categorySelectBtn');
              const popup = document.getElementById('categoryDropdownPopup');
              if (btn && popup && !btn.contains(e.target) && !popup.contains(e.target)) {
                  popup.classList.add('hidden');
              }
          });
      });

      async function initAppData() {
          await fetchCategories();
          await fetchMenus();
      }

      function openModal(id) {
          document.getElementById(id)?.classList.remove('hidden');
      }

      function closeModal(id) {
          document.getElementById(id)?.classList.add('hidden');
      }

      function handleOutsideClick(event, modalId) {
          if (event.target.id === modalId) {
              closeModal(modalId);
          }
      }

      function showAlert(title, message, icon = '⚠️') {
          document.getElementById('alertTitle').textContent = title;
          document.getElementById('alertMessage').textContent = message;
          document.getElementById('alertIcon').textContent = icon;
          openModal('alertModal');
      }

      // 1. ดึงข้อมูลจาก food_groups (id, name)
      async function fetchCategories() {
          const { data, error } = await supabaseClient
              .from('food_groups')
              .select('id, name')
              .order('name', { ascending: true });
              
          if (error) throw error;
          if (data) {
              state.categories = data;
              renderDropdownMenu();
              renderModalCategoryList();
          }
      }

      // 2. ดึงข้อมูลจาก foods (id, name, group_id, price_1, price_2, price_3)
      async function fetchMenus() {
          const { data, error } = await supabaseClient
              .from('foods')
              .select('id, name, group_id, price_1, price_2, price_3')
              .order('name', { ascending: true });
              
          if (error) throw error;
          if (data) {
              state.menus = data;
              renderMenuList();
          }
      }

      function renderDropdownMenu() {
          const popup = document.getElementById('categoryDropdownPopup');
          if (!popup) return;
          let html = `
              <div onclick="selectCategory('all', '-- แสดงทั้งหมด --')" class="px-3 py-1.5 rounded-xl text-xs font-medium cursor-pointer hover:bg-gray-100 flex items-center justify-between gap-4 ${state.selectedCategory === 'all' ? 'text-red-600 font-bold bg-red-50' : 'text-gray-700'}">
                  <span>-- แสดงทั้งหมด --</span>
                  ${state.selectedCategory === 'all' ? '<span>✓</span>' : ''}
              </div>
          `;

          state.categories.forEach(cat => {
              const isSelected = String(state.selectedCategory) === String(cat.id);
              html += `
                  <div onclick="selectCategory(${cat.id}, '${cat.name.replace(/'/g, "\\'")}')" class="px-3 py-1.5 rounded-xl text-xs font-medium cursor-pointer hover:bg-gray-100 flex items-center justify-between gap-4 ${isSelected ? 'text-red-600 font-bold bg-red-50' : 'text-gray-700'}">
                      <span>📁 ${cat.name}</span>
                      ${isSelected ? '<span>✓</span>' : ''}
                  </div>
              `;
          });
          popup.innerHTML = html;
      }

      function selectCategory(id, name) {
          state.selectedCategory = id;
          document.getElementById('selectedCategoryText').textContent = name;
          document.getElementById('categoryDropdownPopup').classList.add('hidden');
          renderDropdownMenu();
          renderMenuList();
      }

      function toggleDropdown() {
          document.getElementById('categoryDropdownPopup').classList.toggle('hidden');
      }

      function renderMenuList() {
          const container = document.getElementById('menuListContainer');
          if (!container) return;

          let filtered = state.menus;
          if (state.selectedCategory !== 'all') {
              filtered = state.menus.filter(m => String(m.group_id) === String(state.selectedCategory));
          }

          if (filtered.length === 0) {
              container.innerHTML = `<div class="col-span-2 text-center text-gray-400 text-xs py-8">ไม่มีรายการอาหารในหมวดหมู่นี้</div>`;
              return;
          }

          container.innerHTML = filtered.map(m => `
              <div class="flex items-center bg-white border border-gray-200 rounded-2xl p-1.5 pl-2 shadow-2xs hover:border-gray-300 transition">
                  <button onclick="handleDeleteMenu(${m.id}, '${m.name.replace(/'/g, "\\'")}')" class="w-6 h-6 bg-red-100/70 hover:bg-red-200 text-red-500 rounded-full flex items-center justify-center text-[10px] font-bold shrink-0 mr-2 transition">✕</button>
                  
                  <span onclick="openEditMenuModal(${m.id})" class="text-xs font-medium text-gray-700 truncate cursor-pointer flex-1 py-1">
                      ${m.name}
                  </span>
              </div>
          `).join('');
      }

      // เปิดดูและแก้ไขรายการอาหาร
      function openEditMenuModal(foodId) {
          const item = state.menus.find(m => Number(m.id) === Number(foodId));
          if (!item) return;

          state.activeFoodId = Number(foodId);
          openModal('editMenuModal');

          // โหลดตัวเลือกกลุ่มอาหาร
          const catSelect = document.getElementById('modalCategorySelect');
          catSelect.innerHTML = state.categories.map(c => 
              `<option value="${c.id}" ${String(c.id) === String(item.group_id) ? 'selected' : ''}>📁 ${c.name}</option>`
          ).join('');

          document.getElementById('modalMenuNameInput').value = item.name;
          document.getElementById('modal_price_1').value = item.price_1 || 0;
          document.getElementById('modal_price_2').value = item.price_2 || 0;
          document.getElementById('modal_price_3').value = item.price_3 || 0;
      }

      // บันทึกการแก้ไขข้อมูลจาก Modal
      async function handleUpdateMenuFromModal() {
          if (!state.activeFoodId) return;
          const targetFoodId = Number(state.activeFoodId);
          const newGroupId = document.getElementById('modalCategorySelect').value;
          const newName = document.getElementById('modalMenuNameInput').value.trim();

          if (!newName) {
              showAlert('แจ้งเตือน', 'กรุณากรอกชื่อรายการอาหาร');
              return;
          }

          const p1 = parseFloat(document.getElementById('modal_price_1').value) || 0;
          const p2 = parseFloat(document.getElementById('modal_price_2').value) || 0;
          const p3 = parseFloat(document.getElementById('modal_price_3').value) || 0;

          try {
              const { error } = await supabaseClient
                  .from('foods')
                  .update({ 
                      group_id: newGroupId,
                      name: newName,
                      price_1: p1,
                      price_2: p2,
                      price_3: p3
                  })
                  .eq('id', targetFoodId);

              if (error) throw error;

              closeModal('editMenuModal');
              state.activeFoodId = null;
              await fetchMenus();
              showAlert('สำเร็จ', 'อัปเดตข้อมูลเรียบร้อยแล้ว', '✅');

          } catch (err) {
              showAlert('ข้อผิดพลาด', 'ไม่สามารถบันทึกได้: ' + err.message);
          }
      }

      // เพิ่มอาหารใหม่
      async function handleSaveMenu() {
          const categoryId = state.selectedCategory;
          const nameInput = document.getElementById('menuNameInput');
          const name = nameInput.value.trim();

          if (categoryId === 'all' || !categoryId) {
              showAlert('แจ้งเตือน', 'กรุณาเลือกหมวดหมู่ก่อนบันทึก');
              return;
          }
          if (!name) {
              showAlert('แจ้งเตือน', 'กรุณากรอกชื่อรายการอาหาร');
              return;
          }

          try {
              const { error } = await supabaseClient
                  .from('foods')
                  .insert([
                      { 
                          group_id: categoryId, 
                          name: name,
                          price_1: 0,
                          price_2: 0,
                          price_3: 0
                      }
                  ]);

              if (error) throw error;

              nameInput.value = '';
              await fetchMenus();
              showAlert('สำเร็จ', 'บันทึกรายการอาหารใหม่แล้ว', '✅');

          } catch (err) {
              showAlert('ข้อผิดพลาด', 'ไม่สามารถบันทึกได้: ' + err.message);
          }
      }

      // ลบอาหาร
      async function handleDeleteMenu(id, name) {
          if (!confirm(`คุณต้องการลบรายการ "${name}" ใช่หรือไม่?`)) return;

          try {
              const { error } = await supabaseClient
                  .from('foods')
                  .delete()
                  .eq('id', id);

              if (error) throw error;

              await fetchMenus();
              showAlert('สำเร็จ', 'ลบรายการเรียบร้อยแล้ว', '✅');
          } catch (err) {
              showAlert('ข้อผิดพลาด', 'ไม่สามารถลบได้: ' + err.message);
          }
      }

      // แสดงหมวดหมู่ใน Modal จัดการกลุ่ม
      function openCategoryManagerModal() {
          openModal('categoryManagerModal');
      }

      function renderModalCategoryList() {
          const container = document.getElementById('modalCategoryListContainer');
          if (!container) return;

          if (state.categories.length === 0) {
              container.innerHTML = `<div class="text-center text-gray-400 text-xs py-4">ไม่มีกลุ่มรายการอาหาร</div>`;
              return;
          }

          container.innerHTML = state.categories.map(c => `
              <div class="flex items-center justify-between bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs">
                  <span class="font-medium text-gray-700 truncate">📁 ${c.name}</span>
                  <button onclick="handleDeleteCategory(${c.id})" class="text-red-500 hover:text-red-700 font-bold ml-2">✕</button>
              </div>
          `).join('');
      }

      // เพิ่มหมวดหมู่ (ไม่มี Pop-up แจ้งเตือน)
      async function handleSaveCategoryAction() {
          const input = document.getElementById('editCategoryInput');
          const name = input.value.trim();

          if (!name) return;

          try {
              const { error } = await supabaseClient
                  .from('food_groups')
                  .insert([{ name: name }]);

              if (error) throw error;

              input.value = '';
              await fetchCategories();
          } catch (err) {
              console.error('ไม่สามารถเพิ่มได้:', err.message);
          }
      }

      // ลบหมวดหมู่ (ลบทันที ไม่มี Pop-up ถามยืนยัน/แจ้งเตือน)
      async function handleDeleteCategory(id) {
          try {
              const { error } = await supabaseClient
                  .from('food_groups')
                  .delete()
                  .eq('id', id);

              if (error) throw error;

              await fetchCategories();
              if (state.selectedCategory == id) {
                  selectCategory('all', '-- แสดงทั้งหมด --');
              }
          } catch (err) {
              console.error('ไม่สามารถลบได้:', err.message);
          }
      }
    </script>
</body>
</html>
