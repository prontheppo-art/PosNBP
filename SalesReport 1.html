<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>สรุปยอดขาย</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="key.js"></script>
    <script src="slender.js"></script> <!-- ดึงไฟล์ปฏิทินกลาง slender.js มาใช้งาน -->
    <style>
        /* ล็อกหน้าจอไม่ให้ขยายหรือเลื่อนทั้งหน้า */
        html, body { 
            height: 100%; margin: 0; padding: 0; overflow: hidden; 
            font-family: sans-serif; background: #f3f4f6; 
            touch-action: pan-y; 
            -webkit-user-select: none; user-select: none;
        }

        .app-layout { 
            display: flex; align-items: center; justify-content: center; 
            height: 100dvh; width: 100vw; padding: 16px; box-sizing: border-box; 
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="app-layout">
        <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-6 flex flex-col h-[92vh] box-border relative overflow-hidden">
            
            <!-- ส่วนหัว (ล็อกนิ่ง) -->
            <div class="flex-none bg-white z-10 pb-2">
                <div class="text-center mb-3 pt-1">
                    <h2 class="text-lg font-bold text-gray-800">📊 สรุปยอดขาย</h2>
                    <p class="text-[11px] text-gray-400 mt-0.5">รายการสั่งอาหารและจัดการออร์เดอร์</p>
                </div>

                <div class="bg-gray-100 p-1 rounded-2xl grid grid-cols-4 gap-1">
                    <button type="button" onclick="filterOrders('today', this)" class="py-1.5 text-xs font-bold rounded-xl text-gray-500 hover:text-gray-800 transition filter-btn cursor-pointer">วันนี้</button>
                    <button type="button" onclick="filterOrders('week', this)" class="py-1.5 text-xs font-bold rounded-xl text-gray-500 hover:text-gray-800 transition filter-btn cursor-pointer">สัปดาห์นี้</button>
                    <button type="button" onclick="filterOrders('month', this)" class="py-1.5 text-xs font-bold rounded-xl text-gray-500 hover:text-gray-800 transition filter-btn cursor-pointer">เดือนนี้</button>
                    
                    <!-- ปุ่มเรียกใช้งาน CalendarSystem จาก slender.js -->
                    <button type="button" onclick="openCustomCalendar()" id="dateFilterBtn" class="py-1.5 text-[11px] font-bold rounded-xl text-gray-500 hover:text-gray-800 transition filter-btn bg-transparent flex items-center justify-center truncate px-1 cursor-pointer">
                        <span id="dateButtonText">📅 เลือกวัน</span>
                    </button>
                </div>
            </div>

            <!-- ส่วนรายการประวัติออร์เดอร์ (Scroll ได้เฉพาะส่วนนี้) -->
            <div id="orderHistoryList" class="flex-1 overflow-y-auto space-y-1.5 pr-1 mt-1" style="-webkit-overflow-scrolling: touch;">
                <div class="text-center text-gray-400 text-xs py-10">⏳ กำลังโหลดข้อมูลประวัติ...</div>
            </div>

            <!-- ส่วนสรุปยอดและปุ่มด้านล่าง (ล็อกติดขอบล่าง) -->
            <div class="flex-none pt-2 bg-white z-10 border-t border-gray-100 mt-2">
                <div class="flex items-center gap-2">
                    <div class="flex-1 bg-slate-800 text-white rounded-2xl px-3.5 py-2 flex justify-between items-center shadow-md">
                        <div>
                            <div id="summaryLabel" class="text-[10px] text-slate-300 font-bold">ยอดรวมทั้งหมด</div>
                            <div class="text-[8px] text-slate-400">จากออร์เดอร์ที่แสดง</div>
                        </div>
                        <div class="text-right">
                            <span id="summaryTotalAmount" class="text-sm font-extrabold text-emerald-400">0 ฿</span>
                        </div>
                    </div>

                    <a href="index.html" class="bg-rose-500 hover:bg-rose-600 text-white font-bold px-4 py-2.5 rounded-2xl text-xs text-center transition flex items-center justify-center gap-1 shadow-sm shrink-0 no-underline">
                        🏠 หน้าหลัก
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- โมดอลรายละเอียดออร์เดอร์ (เพิ่ม onclick สั่งปิดเมื่อแตะพื้นหลัง) -->
    <div id="detailModal" onclick="handleOutsideClick(event)" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-200 p-4">
        <div class="bg-white w-[90%] max-w-[340px] rounded-2xl p-5 shadow-2xl transform scale-95 transition-transform duration-200" id="detailBox">
            <div class="flex justify-between items-center border-b border-gray-100 pb-2 mb-3">
                <h3 class="text-sm font-bold text-gray-800">📋 รายละเอียดออร์เดอร์</h3>
                <button type="button" onclick="closeDetailModal()" class="w-6 h-6 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center font-bold text-xs cursor-pointer">✕</button>
            </div>
            <div id="detailContent" class="space-y-1.5 max-h-60 overflow-y-auto text-xs text-gray-600 mb-4 pr-1"></div>
            <button type="button" onclick="closeDetailModal()" class="w-full bg-slate-700 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl text-xs transition cursor-pointer">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script>
        // ป้องกันการซูมหน้าจอด้วยนิ้ว
        document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('touchend', (e) => {
            const now = new Date().getTime();
            if (now - window.lastTouchEnd <= 300) e.preventDefault();
            window.lastTouchEnd = now;
        }, { passive: false });

        let db;
        let allOrders = [];

        function cleanGroupName(name) {
            if (!name) return 'ทั่วไป';
            let cleaned = name
                .replace(/ชาวบ้าน\s*\/\s*/g, '')
                .replace(/สมาชิก\s*VIP\s*\/\s*/g, '')
                .trim();
            if (cleaned.includes(' ')) {
                cleaned = cleaned.split(' ')[0];
            }
            return cleaned;
        }

        function getOrderDateStr(order) {
            const rawDate = order.order_date || order.created_at || order.date;
            if (!rawDate) return '';
            
            if (typeof rawDate === 'string') {
                return rawDate.split('T')[0].split(' ')[0];
            }
            
            const d = new Date(rawDate);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function parseLocalDate(dateStr) {
            if (!dateStr) return new Date();
            const cleanStr = dateStr.split('T')[0].split(' ')[0];
            const [y, m, d] = cleanStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function formatDateThai(dateString) {
            if (!dateString) return '';
            const parts = dateString.split('T')[0].split(' ')[0].split('-');
            if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
            return dateString;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            window.lastTouchEnd = 0;

            if (typeof window.supabaseClient !== 'undefined') {
                db = window.supabaseClient;
            } else if (typeof window.supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_KEY !== 'undefined') {
                db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }

            if (typeof CalendarSystem !== 'undefined') {
                CalendarSystem.init((selectedDateStr) => {
                    const btn = document.getElementById('dateFilterBtn');
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('bg-white', 'shadow-xs', 'text-gray-800');
                        b.classList.add('text-gray-500');
                    });
                    btn.classList.add('bg-white', 'shadow-xs', 'text-gray-800');
                    btn.classList.remove('text-gray-500');

                    document.getElementById('dateButtonText').textContent = formatDateThai(selectedDateStr);

                    const filtered = allOrders.filter(o => getOrderDateStr(o) === selectedDateStr);

                    document.getElementById('summaryLabel').textContent = `ยอดรวมวันที่ ${formatDateThai(selectedDateStr)}`;
                    renderOrderHistory(filtered);
                });
            }

            if (db) {
                await fetchOrdersFromDatabase();
            } else {
                document.getElementById('orderHistoryList').innerHTML = `<div class="text-center text-red-500 text-xs py-10">❌ ไม่สามารถเชื่อมต่อฐานข้อมูลได้ (โปรดตรวจสอบ key.js)</div>`;
            }
        });

        async function fetchOrdersFromDatabase() {
            const container = document.getElementById('orderHistoryList');
            try {
                const { data, error } = await db.from('orders')
                    .select('*')
                    .neq('status', 'pending')
                    .neq('status', 'cancelled')
                    .order('id', { ascending: true });
                
                if (error) throw error;
                
                allOrders = data || [];
                renderOrderHistory(allOrders);
                document.getElementById('summaryLabel').textContent = "ยอดรวมทั้งหมด";
            } catch (err) {
                console.error('Error fetching orders:', err);
                container.innerHTML = `<div class="text-center text-red-400 text-xs py-10">ไม่สามารถโหลดข้อมูลออร์เดอร์ได้ (${err.message})</div>`;
            }
        }

        function getOrderTotalAmount(order) {
            if (order.total_amount && Number(order.total_amount) > 0) return Number(order.total_amount);
            if (order.total_price && Number(order.total_price) > 0) return Number(order.total_price);
            if (order.total && Number(order.total) > 0) return Number(order.total);

            let items = order.items || order.order_items;
            if (typeof items === 'string') {
                try { items = JSON.parse(items); } catch(e) { items = []; }
            }
            if (items && !Array.isArray(items) && typeof items === 'object') {
                items = [items];
            }
            if (!Array.isArray(items)) return 0;

            return items.reduce((sum, i) => {
                const price = parseFloat(i.price || i.unit_price || i.p || 0);
                const qty = parseFloat(i.qty || i.quantity || 1);
                return sum + (price * qty);
            }, 0);
        }

        function filterOrders(type, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('bg-white', 'shadow-xs', 'text-gray-800');
                b.classList.add('text-gray-500');
            });
            if (btn) {
                btn.classList.add('bg-white', 'shadow-xs', 'text-gray-800');
                btn.classList.remove('text-gray-500');
            }

            document.getElementById('dateButtonText').textContent = "📅 เลือกวัน";
            if (typeof CalendarSystem !== 'undefined') {
                CalendarSystem.selectedDateStr = "";
            }

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const todayStr = `${year}-${month}-${day}`;

            let filtered = allOrders;
            let labelText = "ยอดรวมทั้งหมด";

            if (type === 'today') {
                filtered = allOrders.filter(o => getOrderDateStr(o) === todayStr);
                labelText = "ยอดรวมวันนี้";
            } else if (type === 'week') {
                const todayLocal = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const dayOfWeek = todayLocal.getDay();
                const distanceToMonday = (dayOfWeek === 0 ? 6 : dayOfWeek - 1);
                
                const startOfWeek = new Date(todayLocal);
                startOfWeek.setDate(todayLocal.getDate() - distanceToMonday);
                
                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6);

                filtered = allOrders.filter(o => {
                    const orderDateStr = getOrderDateStr(o);
                    if (!orderDateStr) return false;
                    const orderDate = parseLocalDate(orderDateStr);
                    return orderDate >= startOfWeek && orderDate <= endOfWeek;
                });
                labelText = "ยอดรวมสัปดาห์นี้";
            } else if (type === 'month') {
                const currentMonthPrefix = `${year}-${month}`;
                filtered = allOrders.filter(o => getOrderDateStr(o).startsWith(currentMonthPrefix));
                labelText = "ยอดรวมเดือนนี้";
            }

            document.getElementById('summaryLabel').textContent = labelText;
            renderOrderHistory(filtered);
        }

        function openCustomCalendar() {
            if (typeof CalendarSystem !== 'undefined' && typeof CalendarSystem.open === 'function') {
                CalendarSystem.open(CalendarSystem.selectedDateStr);
            } else {
                alert("ระบบปฏิทินไม่พร้อมใช้งาน");
            }
        }

        function renderOrderHistory(orders) {
            const container = document.getElementById('orderHistoryList');
            
            const sumTotal = orders.reduce((sum, order) => sum + getOrderTotalAmount(order), 0);
            document.getElementById('summaryTotalAmount').textContent = sumTotal.toLocaleString() + ' ฿';

            if (orders.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 text-xs py-10">ไม่พบประวัติออร์เดอร์ในช่วงเวลานี้</div>`;
                return;
            }

            const sortedOrders = [...orders].sort((a, b) => {
                const dateA = getOrderDateStr(a);
                const dateB = getOrderDateStr(b);
                if (dateA !== dateB) return dateA.localeCompare(dateB);
                return a.id - b.id;
            });

            container.innerHTML = sortedOrders.map(order => {
                const dateFormatted = formatDateThai(getOrderDateStr(order));
                const customerGroup = cleanGroupName(order.customer_group || order.group_name || order.customer_type);
                const totalAmount = getOrderTotalAmount(order).toLocaleString();
                
                return `
                    <div class="bg-white py-2.5 px-3 border-b border-gray-100 flex justify-between items-center hover:bg-gray-50 transition gap-2">
                        <div class="flex items-center gap-2 overflow-hidden flex-1 min-w-0">
                            <span class="font-bold text-xs text-gray-700 shrink-0">${dateFormatted}</span>
                            <span class="font-extrabold text-red-600 text-sm shrink-0">${totalAmount} ฿</span>
                            <span class="font-bold px-2 py-0.5 bg-slate-100 text-slate-700 rounded-lg text-xs truncate max-w-[140px]" title="${customerGroup}">${customerGroup}</span>
                        </div>
                        <button type="button" onclick="openDetailModal(${order.id})" class="text-blue-600 hover:text-blue-800 p-1.5 transition shrink-0 ml-auto cursor-pointer rounded-lg hover:bg-blue-50" title="ดูรายละเอียด">
                            <!-- SVG Icon รายละเอียด (Document / List Icon) -->
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                        </button>
                    </div>
                `;
            }).join('');
        }

        async function openDetailModal(orderId) {
            const contentContainer = document.getElementById('detailContent');
            contentContainer.innerHTML = `<div class="text-center text-gray-400 py-4">กำลังโหลดรายการ...</div>`;
            
            const modal = document.getElementById('detailModal');
            const box = document.getElementById('detailBox');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-95');

            try {
                const targetOrder = allOrders.find(o => o.id == orderId);
                let items = targetOrder ? (targetOrder.items || targetOrder.order_items) : null;
                
                if (typeof items === 'string') {
                    try { items = JSON.parse(items); } catch(e) { items = []; }
                }
                
                if (Array.isArray(items) && items.length > 0) {
                    renderItemsList(items);
                    return;
                }

                const { data: dbItems, error } = await db.from('order_items').select('*').eq('order_id', orderId);
                if (error) throw error;

                if (dbItems && dbItems.length > 0) {
                    renderItemsList(dbItems);
                } else {
                    contentContainer.innerHTML = `<div class="text-center text-gray-400 py-4">ไม่มีรายการสินค้า</div>`;
                }
            } catch (err) {
                console.error('Error loading order items:', err);
                contentContainer.innerHTML = `<div class="text-center text-red-400 py-4">ไม่สามารถโหลดรายการสินค้าได้</div>`;
            }
        }

        function renderItemsList(items) {
            const contentContainer = document.getElementById('detailContent');
            contentContainer.innerHTML = items.map(i => {
                const qty = parseFloat(i.qty || i.quantity || 1);
                const price = parseFloat(i.price || i.unit_price || i.p || 0);
                const name = i.food_name || i.name || i.title || 'สินค้า';
                const noteStr = (i.note || i.comment) ? ` <span class="text-red-500">(${i.note || i.comment})</span>` : '';
                return `
                    <div class="flex justify-between items-center bg-gray-50 p-2 rounded-xl">
                        <span>• ${name}${noteStr} (x${qty})</span>
                        <span class="font-bold">${(price * qty).toLocaleString()} ฿</span>
                    </div>
                `;
            }).join('');
        }

        function closeDetailModal() {
            const modal = document.getElementById('detailModal');
            const box = document.getElementById('detailBox');
            modal.classList.add('opacity-0', 'pointer-events-none');
            box.classList.add('scale-95');
        }

        // ฟังก์ชันตรวจจับการกดนอกกรอบกล่องข้อความเพื่อสั่งปิดโมดอล
        function handleOutsideClick(event) {
            if (event.target.id === 'detailModal') {
                closeDetailModal();
            }
        }
    </script>
</body>
</html>
