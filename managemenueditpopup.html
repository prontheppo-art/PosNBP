<!--
  ========================================
  [File Note]
  - File Name: managemenueditpopup.html
  - Description: Pop-up สำหรับแก้ไขชื่อ, ย้ายกลุ่ม และลบรายการอาหาร (ปุ่มลบสีแดงเข้ม ชัดเจน ไม่ต้อง confirm)
  ========================================
-->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการแก้ไขและย้ายกลุ่มเมนู</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: sans-serif;
            user-select: none;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
    </style>
</head>
<body id="editOverlay" class="p-3 flex items-center justify-center min-h-screen bg-slate-900/60 backdrop-blur-xs">

    <!-- Card Container -->
    <div onclick="event.stopPropagation()" class="w-full max-w-sm bg-white rounded-3xl shadow-2xl border border-slate-100 overflow-hidden flex flex-col p-4 space-y-3 relative max-h-[90vh]">
        
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-slate-100 pb-2.5 shrink-0">
            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                ✏️ แก้ไขชื่อและย้ายกลุ่มเมนู
            </h3>
            <button onclick="closeSelf()" class="text-slate-400 hover:text-slate-600 font-bold text-base w-7 h-7 flex items-center justify-center rounded-full hover:bg-slate-100 transition">✕</button>
        </div>

        <!-- Form & Grid Content Section -->
        <div class="space-y-3 overflow-y-auto pr-0.5">
            <!-- Input ชื่ออาหาร -->
            <div>
                <label class="block text-[11px] font-bold text-slate-500 mb-1 uppercase tracking-wide">ชื่อรายการอาหาร</label>
                <input type="text" id="foodNameInput" placeholder="กรอกชื่ออาหารใหม่" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
            </div>

            <!-- UI เลือกหมวดหมู่อาหาร (Grid 2 คอลัมน์) -->
            <div>
                <label class="block text-[11px] font-bold text-slate-500 mb-1.5 uppercase tracking-wide">กลุ่ม / หมวดหมู่อาหาร</label>
                
                <div id="groupGridContainer" class="grid grid-cols-2 gap-1.5 max-h-48 overflow-y-auto p-1 bg-slate-50 border border-slate-200/80 rounded-2xl">
                    <div class="col-span-2 text-center text-xs text-slate-400 py-4 font-medium">⏳ กำลังโหลดหมวดหมู่...</div>
                </div>
            </div>
        </div>

        <!-- Action Buttons (ปรับปุ่มลบเป็นสีแดงสดเข้ม) -->
        <div class="flex items-center gap-1.5 pt-1 shrink-0 border-t border-slate-100">
            <!-- ปุ่มลบรายการ (สีแดงเข้ม เด่นชัด ไม่ถาม confirm) -->
            <button onclick="deleteFoodData()" type="button" class="bg-rose-600 hover:bg-rose-700 active:scale-95 text-white font-bold px-3 py-2.5 rounded-xl text-xs flex items-center justify-center gap-1 shrink-0 shadow-md shadow-rose-200 transition" title="ลบรายการอาหารนี้">
                🗑️ <span>ลบ</span>
            </button>
            
            <!-- ปุ่มยกเลิก -->
            <button onclick="closeSelf()" type="button" class="flex-1 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-bold py-2.5 rounded-xl text-xs transition text-center">
                ยกเลิก
            </button>
            
            <!-- ปุ่มบันทึก -->
            <button onclick="saveFoodData()" type="button" class="flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-2.5 rounded-xl text-xs shadow-md shadow-indigo-200 transition text-center">
                บันทึก
            </button>
        </div>

    </div>

    <script src="key.js"></script>
    <script>
        let db;
        let foodId = null;
        let currentGroupId = null;
        let selectedGroupId = null;
        let groupsData = [];
        const groupIcons = ['🍱', '🍲', '🍳', '🍚', '🥩', '⭐', '🥗', '🛍️', '🍽️', '🥢', '🍹'];

        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('editOverlay').addEventListener('click', (e) => {
                if (e.target.id === 'editOverlay') closeSelf();
            });

            if (window.supabaseClient) db = window.supabaseClient;
            else if (typeof supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined') {
                db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }

            const urlParams = new URLSearchParams(window.location.search);
            foodId = urlParams.get('foodId');
            const foodName = urlParams.get('foodName') || '';
            currentGroupId = urlParams.get('groupId');
            selectedGroupId = currentGroupId;

            document.getElementById('foodNameInput').value = foodName;

            if (db) {
                await loadFoodGroups();
            }
        });

        async function loadFoodGroups() {
            try {
                const { data: groups, error } = await db.from('food_groups').select('*');
                if (error) throw error;

                groupsData = groups || [];
                
                const specialCategories = ['เมนูพิเศษ', 'ลูกค้าฝากซื้อ'];
                groupsData.sort((a, b) => {
                    const isASpecial = specialCategories.includes(a.name);
                    const isBSpecial = specialCategories.includes(b.name);
                    if (isASpecial && !isBSpecial) return 1;
                    if (!isASpecial && isBSpecial) return -1;
                    if (isASpecial && isBSpecial) {
                        return specialCategories.indexOf(a.name) - specialCategories.indexOf(b.name);
                    }
                    return a.name.localeCompare(b.name, 'th');
                });

                renderGroupGrid();
            } catch (err) {
                document.getElementById('groupGridContainer').innerHTML = `<div class="col-span-2 text-center text-xs text-rose-500 py-4 font-medium">❌ โหลดหมวดหมู่ไม่สำเร็จ</div>`;
            }
        }

        function renderGroupGrid() {
            const container = document.getElementById('groupGridContainer');
            container.innerHTML = '';

            groupsData.forEach((group, index) => {
                const icon = groupIcons[index % groupIcons.length];
                const isSelected = String(group.id) === String(selectedGroupId);

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `p-2 rounded-xl text-xs font-bold border text-center flex items-center justify-center gap-1.5 transition active:scale-95 min-h-[42px] ${
                    isSelected 
                        ? 'bg-indigo-600 border-indigo-600 text-white shadow-xs ring-2 ring-indigo-200' 
                        : 'bg-white border-slate-200/90 text-slate-700 hover:bg-slate-100'
                }`;

                btn.innerHTML = `<span class="text-sm shrink-0">${icon}</span> <span class="truncate">${group.name}</span>`;

                btn.onclick = () => {
                    selectedGroupId = group.id;
                    renderGroupGrid();
                };

                container.appendChild(btn);
            });
        }

        async function saveFoodData() {
            const newName = document.getElementById('foodNameInput').value.trim();

            if (!newName) {
                alert('กรุณากรอกชื่ออาหาร');
                return;
            }

            try {
                const { error } = await db
                    .from('foods')
                    .update({ 
                        name: newName,
                        group_id: selectedGroupId
                    })
                    .eq('id', foodId);

                if (error) throw error;

                closeSelf();
            } catch (err) {
                alert('อัปเดตไม่สำเร็จ: ' + err.message);
            }
        }

        // ลบรายการอาหารทันที (ไม่ถาม confirm)
        async function deleteFoodData() {
            if (!foodId) return;

            try {
                const { error } = await db
                    .from('foods')
                    .delete()
                    .eq('id', foodId);

                if (error) throw error;

                closeSelf();
            } catch (err) {
                alert('ลบรายการไม่สำเร็จ: ' + err.message);
            }
        }

        function closeSelf() {
            if (window.parent && window.parent.closeSubModalFrame) {
                window.parent.closeSubModalFrame();
            } else if (window.parent) {
                window.parent.postMessage({ action: 'closeSubModal' }, '*');
            }
        }
    </script>
</body>
</html>
