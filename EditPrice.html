<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ดูแลและแก้ไขตารางราคา - ลาบหนองบัวลำภู</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: sans-serif; 
            background: #f3f4f6; 
            touch-action: pan-y; 
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .app-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            width: 100vw;
            box-sizing: border-box;
            padding: 8px;
            overflow: hidden;
        }

        .category-nav-wrap {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.5rem;
            padding: 0.5rem;
            width: 100%;
        }

        .cat-nav-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.65rem 0.4rem;
            border-radius: 0.85rem;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            cursor: pointer;
            min-height: 48px;
        }

        .cat-nav-btn:active {
            background-color: #10b981;
            color: #ffffff;
            border-color: #10b981;
            transform: scale(0.96);
        }

        .cat-nav-icon {
            font-size: 1.1rem;
            display: inline-block;
            flex-shrink: 0;
        }

        /* สำหรับปุ่มเลือกลิงก์ใน Modal ย้ายหมวดหมู่ */
        .cat-select-card {
            background-color: #ffffff;
            border: 1.5px solid #e2e8f0;
            color: #334155;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.6rem 0.3rem;
            border-radius: 0.75rem;
            text-align: center;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            cursor: pointer;
        }

        .cat-select-card.selected {
            background-color: #eff6ff;
            border-color: #2563eb;
            color: #1d4ed8;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="app-layout">
        <div class="w-[97%] max-w-xl bg-white rounded-3xl shadow-xl p-4 sm:p-6 h-[92vh] flex flex-col relative overflow-hidden">
            
            <!-- ส่วนหัวหลักด้านบนสุด -->
            <div class="shrink-0 bg-white pb-2 relative z-20">
                <h2 class="text-xl font-bold text-gray-800 text-center mb-1">🏷️ ดูแลและแก้ไขตารางราคา</h2>
                <p class="text-xs text-slate-500 text-center mb-2">แตะที่กลุ่มอาหารเพื่อเปิดแก้ไขราคา</p>
            </div>

            <!-- ปุ่มหมวดหมู่หน้าหลัก -->
            <div class="flex-1 overflow-y-auto pr-0.5 rounded-2xl">
                <div id="quickNavContainer" class="category-nav-wrap border border-slate-200 rounded-2xl bg-slate-50">
                    <div class="text-center col-span-2 text-xs text-slate-400 py-8">⏳ กำลังโหลดหมวดหมู่...</div>
                </div>
            </div>

            <!-- แถบปุ่มกดด้านล่าง -->
            <div class="shrink-0 pt-3 border-t border-gray-100 grid grid-cols-2 gap-2 z-20 bg-white mt-2">
                <a href="ManageFoodGroups.html" 
                   class="bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold py-3 px-2 rounded-2xl text-xs flex items-center justify-center gap-1 shadow-sm no-underline text-center">
                    ➕ กลุ่มอาหาร
                </a>
                <a href="PageAdmin.html" 
                   class="bg-slate-700 hover:bg-slate-800 active:bg-slate-900 text-white font-bold py-3 px-2 rounded-2xl text-xs flex items-center justify-center gap-1 shadow-sm no-underline text-center">
                    🔑 ผู้ดูแล
                </a>
            </div>

        </div>
    </div>

    <!-- Pop-up ตารางราคาหมวดหมู่ที่กดเลือก -->
    <div id="priceCategoryModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3">
        <div class="bg-white rounded-3xl w-full max-w-lg h-[85vh] flex flex-col overflow-hidden shadow-2xl border-2 border-slate-700">
            
            <div class="bg-slate-700 text-white font-bold p-3 text-sm flex items-center justify-between shrink-0">
                <span id="modalGroupTitle" class="truncate flex items-center gap-1.5">📁 ชื่อหมวดหมู่</span>
                <div class="flex items-center gap-2">
                    <a id="modalAddMenuBtn" href="AddMenu.html" 
                       class="bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1 no-underline">
                        ➕ เมนู
                    </a>
                    <button type="button" onclick="closePriceModal()" class="bg-slate-600 hover:bg-slate-500 text-white font-bold w-8 h-8 rounded-full flex items-center justify-center text-sm">
                        ✕
                    </button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto">
                <table class="w-full text-xs border-collapse table-fixed">
                    <thead class="sticky top-0 z-10">
                        <tr class="bg-blue-500 text-white font-bold">
                            <th class="p-2.5 text-left pl-3 text-[11px]" style="width: 46%;">รายการอาหาร</th>
                            <th class="p-2 text-center text-[11px]" style="width: 18%;">ชาวบ้าน</th>
                            <th class="p-2 text-center text-[11px]" style="width: 18%;">นักท่องเที่ยว</th>
                            <th class="p-2 text-center text-[11px] pr-3" style="width: 18%;">สบายดี</th>
                        </tr>
                    </thead>
                    <tbody id="modalTableBody">
                    </tbody>
                </table>
            </div>

            <div class="p-3 bg-gray-50 border-t border-gray-200 shrink-0">
                <button type="button" onclick="closePriceModal()" class="w-full bg-slate-700 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl text-xs">
                    ปิดหน้าต่าง
                </button>
            </div>

        </div>
    </div>

    <!-- Pop-up ย้ายหมวดหมู่รายการอาหาร (ปรับแก้เป็นปุ่มตัวเลือกแบบ Grid แล้ว) -->
    <div id="changeCategoryModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl space-y-3 relative max-h-[85vh] flex flex-col">
            <h3 class="text-base font-bold text-gray-800 text-center border-b pb-2 shrink-0">📁 ย้ายกลุ่มหมวดหมู่</h3>
            
            <div class="text-xs text-gray-600 flex-1 overflow-y-auto pr-1">
                <p class="mb-1 font-semibold">รายการอาหาร:</p>
                <p id="modalFoodName" class="text-sm font-bold text-blue-600 bg-blue-50 p-2.5 rounded-xl mb-3 truncate"></p>
                
                <label class="block mb-2 font-semibold text-gray-700">เลือกกลุ่มอาหารใหม่:</label>
                <!-- กล่องใส่ปุ่มหมวดหมู่แทนแบบ Dropdown -->
                <div id="categoryGridContainer" class="grid grid-cols-2 gap-2 bg-slate-50 p-2 border border-slate-200 rounded-2xl max-h-52 overflow-y-auto">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-gray-100 shrink-0">
                <button type="button" onclick="closeChangeCategoryModal()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2.5 rounded-xl text-xs">
                    ยกเลิก
                </button>
                <button type="button" onclick="saveNewCategory()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-md">
                    บันทึก
                </button>
            </div>
        </div>
    </div>

    <script src="key.js"></script>
    <script>
        let db;
        let menus = [];
        let foodGroups = []; 
        let currentEditingFoodId = null;
        let selectedGroupId = null; // เก็บกลุ่มที่เลือกไว้ใน Modal
        let activeGroup = null;
        const categoryIcons = ['🍱', '🍲', '🍳', '🍚', '🥩', '⭐', '🥗', '🛍️', '🍽️', '🥢', '🍹'];

        window.addEventListener('DOMContentLoaded', async () => {
            if (typeof window.supabaseClient !== 'undefined') {
                db = window.supabaseClient;
            } else if (typeof window.supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_KEY !== 'undefined') {
                db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }

            if (db) {
                await loadAllData();
            } else {
                document.getElementById('quickNavContainer').innerHTML = `<div class="text-center col-span-2 text-red-500 text-xs py-8">❌ ไม่สามารถเชื่อมต่อฐานข้อมูลได้ (โปรดตรวจสอบ key.js)</div>`;
            }
        });

        async function loadAllData() {
            try {
                const [ { data: mData }, { data: fgData } ] = await Promise.all([
                    db.from('foods').select('*'),
                    db.from('food_groups').select('*').order('name', { ascending: true })
                ]);

                menus = mData || [];
                foodGroups = fgData || [];

                if (foodGroups.length === 0 && menus.length > 0) {
                    const uniqueCats = [...new Set(menus.map(m => m.group_id).filter(Boolean))];
                    foodGroups = uniqueCats.map((cat) => ({ id: cat, name: `กลุ่ม ${cat}` }));
                }

                renderQuickNav();
            } catch (err) {
                console.error("Error loading price editor data:", err);
                document.getElementById('quickNavContainer').innerHTML = `<div class="text-center col-span-2 text-red-500 text-xs py-8">เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}</div>`;
            }
        }

        function renderQuickNav() {
            const navContainer = document.getElementById('quickNavContainer');
            if (!navContainer) return;
            navContainer.innerHTML = '';

            if (foodGroups.length === 0) {
                navContainer.innerHTML = `<div class="text-center col-span-2 text-slate-400 text-xs py-8">ยังไม่มีหมวดหมู่อาหาร</div>`;
                return;
            }

            foodGroups.forEach((cat, index) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `cat-nav-btn`;
                
                const icon = categoryIcons[index % categoryIcons.length];
                btn.innerHTML = `<span class="cat-nav-icon">${icon}</span> <span class="truncate">${cat.name}</span>`;
                btn.onclick = () => openCategoryPriceModal(cat);
                navContainer.appendChild(btn);
            });
        }

        function openCategoryPriceModal(group) {
            activeGroup = group;
            const titleEl = document.getElementById('modalGroupTitle');
            const tbodyEl = document.getElementById('modalTableBody');
            const addBtn = document.getElementById('modalAddMenuBtn');

            titleEl.innerHTML = `📁 ${group.name}`;
            addBtn.href = `AddMenu.html?groupId=${group.id}`;

            const filteredMenus = menus
                .filter(m => String(m.group_id) === String(group.id))
                .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'th', { numeric: true }));

            let rowsHtml = '';
            if (filteredMenus.length > 0) {
                filteredMenus.forEach((m, index) => {
                    const borderClass = index === filteredMenus.length - 1 ? 'bg-white' : 'border-b border-gray-200 bg-white';

                    rowsHtml += `
                        <tr class="${borderClass}">
                            <td onclick="openChangeCategoryModal('${m.id}')" 
                                class="p-2.5 font-bold text-gray-800 text-left pl-3 text-xs cursor-pointer hover:bg-blue-50 active:bg-blue-100 transition rounded-lg" style="width: 46%;">
                                <span class="flex items-center gap-1">
                                    ${m.name}
                                    <span class="text-[10px] text-gray-400 font-normal">✏️</span>
                                </span>
                            </td>
                            <td class="p-1 text-center" style="width: 18%;">
                                <input type="number" value="${m.price_1 || 0}" 
                                       onfocus="this.select()"
                                       onblur="updatePriceDirect('${m.id}', 'price_1', this.value)"
                                       class="w-full max-w-[52px] border border-gray-300 rounded-lg py-1.5 px-0.5 text-center font-bold text-gray-700 outline-none focus:border-blue-500 text-xs bg-white">
                            </td>
                            <td class="p-1 text-center" style="width: 18%;">
                                <input type="number" value="${m.price_2 || 0}" 
                                       onfocus="this.select()"
                                       onblur="updatePriceDirect('${m.id}', 'price_2', this.value)"
                                       class="w-full max-w-[52px] border border-gray-300 rounded-lg py-1.5 px-0.5 text-center font-bold text-gray-700 outline-none focus:border-blue-500 text-xs bg-white">
                            </td>
                            <td class="p-1 text-center pr-2" style="width: 18%;">
                                <input type="number" value="${m.price_3 || 0}" 
                                       onfocus="this.select()"
                                       onblur="updatePriceDirect('${m.id}', 'price_3', this.value)"
                                       class="w-full max-w-[52px] border border-gray-300 rounded-lg py-1.5 px-0.5 text-center font-bold text-gray-700 outline-none focus:border-blue-500 text-xs bg-white">
                            </td>
                        </tr>
                    `;
                });
            } else {
                rowsHtml = `
                    <tr>
                        <td colspan="4" class="text-center text-gray-400 text-xs py-10">ยังไม่มีรายการอาหารในกลุ่มนี้</td>
                    </tr>
                `;
            }

            tbodyEl.innerHTML = rowsHtml;
            document.getElementById('priceCategoryModal').classList.remove('hidden');
        }

        function closePriceModal() {
            document.getElementById('priceCategoryModal').classList.add('hidden');
            activeGroup = null;
        }

        async function updatePriceDirect(foodId, priceColumn, newPrice) {
            const parsedPrice = newPrice === '' ? 0 : parseFloat(newPrice);
            
            const item = menus.find(m => String(m.id) === String(foodId));
            if (item) {
                item[priceColumn] = parsedPrice;
            }

            try {
                const updateData = {};
                updateData[priceColumn] = parsedPrice;

                const { error } = await db.from('foods')
                    .update(updateData)
                    .eq('id', parseInt(foodId));

                if (error) {
                    alert(`เกิดข้อผิดพลาดในการบันทึก: ${error.message}`);
                }
            } catch (err) {
                console.error("Exception on updatePriceDirect:", err);
            }
        }

        function openChangeCategoryModal(foodId) {
            const foodItem = menus.find(m => String(m.id) === String(foodId));
            if (!foodItem) return;

            currentEditingFoodId = foodId;
            selectedGroupId = foodItem.group_id; // ตั้งค่าเริ่มต้นเป็นกลุ่มเดิม
            document.getElementById('modalFoodName').textContent = foodItem.name;

            renderCategoryGridSelection();
            document.getElementById('changeCategoryModal').classList.remove('hidden');
        }

        function renderCategoryGridSelection() {
            const gridContainer = document.getElementById('categoryGridContainer');
            if (!gridContainer) return;
            gridContainer.innerHTML = '';

            foodGroups.forEach((group, index) => {
                const icon = categoryIcons[index % categoryIcons.length];
                const isSelected = String(group.id) === String(selectedGroupId);

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `cat-select-card ${isSelected ? 'selected' : ''}`;
                btn.innerHTML = `<span>${icon}</span> <span class="truncate">${group.name}</span>`;

                btn.onclick = () => {
                    selectedGroupId = group.id;
                    renderCategoryGridSelection(); // Render เพื่ออัปเดตสีปุ่มที่เลือก
                };

                gridContainer.appendChild(btn);
            });
        }

        function closeChangeCategoryModal() {
            document.getElementById('changeCategoryModal').classList.add('hidden');
            currentEditingFoodId = null;
            selectedGroupId = null;
        }

        async function saveNewCategory() {
            if (!currentEditingFoodId || !selectedGroupId) return;

            const foodItem = menus.find(m => String(m.id) === String(currentEditingFoodId));

            if (!foodItem) return;

            if (String(foodItem.group_id) === String(selectedGroupId)) {
                closeChangeCategoryModal();
                return;
            }

            try {
                const { error } = await db.from('foods')
                    .update({ group_id: parseInt(selectedGroupId) || selectedGroupId })
                    .eq('id', parseInt(currentEditingFoodId));

                if (error) {
                    alert('เกิดข้อผิดพลาดในการย้ายกลุ่ม: ' + error.message);
                } else {
                    foodItem.group_id = selectedGroupId;
                    closeChangeCategoryModal();
                    if (activeGroup) {
                        openCategoryPriceModal(activeGroup);
                    }
                }
            } catch (err) {
                console.error("Exception on saveNewCategory:", err);
            }
        }
    </script>
</body>
</html>
