<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ดูแลและแก้ไขตารางราคา - ลาบหนองบัวลำภู</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: sans-serif; 
            background: #f3f4f6; 
            touch-action: pan-y; 
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .app-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            width: 100vw;
            box-sizing: border-box;
            padding: 8px;
            overflow: hidden;
        }

        .category-nav-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.5rem;
            width: 100%;
        }

        .cat-nav-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.6rem 0.5rem;
            border-radius: 0.85rem;
            text-align: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            cursor: pointer;
            min-height: 50px;
            flex: 1 1 calc(33.333% - 0.5rem);
            min-width: 100px;
            word-break: break-word;
            line-height: 1.25;
        }

        .cat-nav-btn.wide-btn {
            flex: 2 1 calc(50% - 0.5rem);
        }

        .cat-nav-btn:active {
            background-color: #10b981;
            color: #ffffff;
            border-color: #10b981;
            transform: scale(0.96);
        }

        .cat-nav-icon {
            font-size: 1.1rem;
            display: inline-block;
            flex-shrink: 0;
        }
    </style>
</head>
<body class="bg-gray-100 relative">

    <div class="app-layout">
        <div class="w-[97%] max-w-xl bg-white rounded-3xl shadow-xl p-4 sm:p-6 h-[92vh] flex flex-col relative overflow-hidden">
            
            <!-- Header -->
            <div class="shrink-0 bg-white pb-2 relative z-20">
                <h2 class="text-xl font-bold text-gray-800 text-center mb-1">🏷️ ดูแลและแก้ไขตารางราคา</h2>
                <p class="text-xs text-slate-500 text-center mb-2">แตะที่กลุ่มอาหารเพื่อเปิดแก้ไขราคา</p>
            </div>

            <!-- Categories Grid -->
            <div class="flex-1 overflow-y-auto pr-0.5 rounded-2xl">
                <div id="quickNavContainer" class="category-nav-wrap border border-slate-200 rounded-2xl bg-slate-50">
                    <div class="text-center w-full text-slate-400 text-xs py-8">⏳ กำลังโหลดหมวดหมู่...</div>
                </div>
            </div>

            <!-- Footer Navigation -->
            <div class="shrink-0 pt-3 border-t border-gray-100 grid grid-cols-2 gap-2 z-20 bg-white mt-2">
                <a href="ManageFoodGroups.html" 
                   class="bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold py-3 px-2 rounded-2xl text-xs flex items-center justify-center gap-1 shadow-sm no-underline text-center">
                    ➕ กลุ่มอาหาร
                </a>
                <a href="PageAdmin.html" 
                   class="bg-slate-700 hover:bg-slate-800 active:bg-slate-900 text-white font-bold py-3 px-2 rounded-2xl text-xs flex items-center justify-center gap-1 shadow-sm no-underline text-center">
                    🔑 ผู้ดูแล
                </a>
            </div>

        </div>
    </div>

    <!-- Modal Frame Container for ManageMenuPopup.html -->
    <div id="popupModalWrapper" class="fixed inset-0 z-50 hidden">
        <iframe id="menuPopupFrame" class="w-full h-full border-none" src="about:blank"></iframe>
    </div>

    <!-- External JS Files -->
    <script src="key.js"></script>
    <script src="ManageCategoryPopup.js"></script>
    <script>
        let db;
        let menus = [];
        let foodGroups = []; 
        const categoryIcons = ['🍱', '🍲', '🍳', '🍚', '🥩', '⭐', '🥗', '🛍️', '🍽️', '🥢', '🍹'];

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                if (window.supabaseClient) {
                    db = window.supabaseClient;
                } else if (typeof supabaseClient !== 'undefined') {
                    db = supabaseClient;
                } else if (typeof supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_KEY !== 'undefined') {
                    db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                }
            } catch (e) {
                console.error("Supabase Init Error:", e);
            }

            if (db) {
                if (typeof ManageCategoryPopup !== 'undefined' && ManageCategoryPopup.init) {
                    ManageCategoryPopup.init(db, () => loadAllData());
                }
                await loadAllData();
            } else {
                document.getElementById('quickNavContainer').innerHTML = `<div class="text-center w-full text-red-500 text-xs py-8">❌ ไม่สามารถเชื่อมต่อฐานข้อมูลได้ (โปรดตรวจสอบ key.js)</div>`;
            }
        });

        async function loadAllData() {
            try {
                const [ { data: mData }, { data: fgData } ] = await Promise.all([
                    db.from('foods').select('*'),
                    db.from('food_groups').select('*').order('name', { ascending: true })
                ]);

                menus = mData || [];
                foodGroups = fgData || [];

                if (foodGroups.length === 0 && menus.length > 0) {
                    const uniqueCats = [...new Set(menus.map(m => m.group_id).filter(Boolean))];
                    foodGroups = uniqueCats.map((cat) => ({ id: cat, name: `กลุ่ม ${cat}` }));
                }

                renderQuickNav();
            } catch (err) {
                console.error("Error loading price editor data:", err);
                document.getElementById('quickNavContainer').innerHTML = `<div class="text-center w-full text-red-500 text-xs py-8">เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}</div>`;
            }
        }

        function renderQuickNav() {
            const navContainer = document.getElementById('quickNavContainer');
            if (!navContainer) return;
            navContainer.innerHTML = '';

            if (foodGroups.length === 0) {
                navContainer.innerHTML = `<div class="text-center w-full text-slate-400 text-xs py-8">ยังไม่มีหมวดหมู่อาหาร</div>`;
                return;
            }

            foodGroups.forEach((cat, index) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                
                const isLongName = (cat.name || '').length > 8;
                btn.className = `cat-nav-btn ${isLongName ? 'wide-btn' : ''}`;
                
                const icon = categoryIcons[index % categoryIcons.length];
                btn.innerHTML = `<span class="cat-nav-icon">${icon}</span> <span>${cat.name}</span>`;
                btn.onclick = () => openCategoryPriceModalHTML(cat);
                navContainer.appendChild(btn);
            });
        }

        function openCategoryPriceModalHTML(cat) {
            const wrapper = document.getElementById('popupModalWrapper');
            const iframe = document.getElementById('menuPopupFrame');
            
            iframe.src = `ManageMenuPopup.html?groupId=${cat.id}&groupName=${encodeURIComponent(cat.name)}`;
            wrapper.classList.remove('hidden');
        }

        function closeManageMenuIframe() {
            const wrapper = document.getElementById('popupModalWrapper');
            const iframe = document.getElementById('menuPopupFrame');
            
            wrapper.classList.add('hidden');
            iframe.src = 'about:blank';
            loadAllData();
        }
    </script>
</body>
</html>
