<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จับคู่เมนูอาหารกับวัตถุดิบ</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-md p-6">
        <h1 class="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2">
            🔗 จับคู่เมนูอาหาร กับ วัตถุดิบตัดสต็อก
        </h1>

        <!-- ฟอร์มเลือกจับคู่ -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">1. เลือกเมนูอาหาร (Foods)</label>
                <select id="foodSelect" class="w-full p-2.5 border rounded-lg bg-white outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">-- กำลังโหลดรายการอาหาร --</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">2. เลือกวัตถุดิบที่จะตัดสต็อก (Food Stocks)</label>
                <select id="stockSelect" class="w-full p-2.5 border rounded-lg bg-white outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">-- กำลังโหลดรายการวัตถุดิบ --</option>
                </select>
            </div>

            <div class="md:col-span-2 text-right">
                <button onclick="addMapping()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition shadow">
                    ➕ บันทึกการจับคู่
                </button>
            </div>
        </div>

        <!-- ตารางแสดงผลการจับคู่ -->
        <div class="overflow-x-auto">
            <table class="w-full border-collapse">
                <thead>
                    <tr class="bg-slate-800 text-white text-left text-sm">
                        <th class="p-3 rounded-tl-lg">เมนูอาหาร</th>
                        <th class="p-3">วัตถุดิบที่ตัดสต็อก</th>
                        <th class="p-3 text-center rounded-tr-lg">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="mappingTableBody" class="divide-y divide-slate-200 text-sm">
                    <tr>
                        <td colspan="3" class="text-center p-4 text-gray-400">กำลังโหลดข้อมูล...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wmhweeeyulhmoilypklz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_yXKK7aSunM_KCqRiUhGupQ__Qs1nyCd';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let foodsList = [];
        let stocksList = [];

        window.addEventListener('DOMContentLoaded', async () => {
            await loadDropdowns();
            await loadMappings();
        });

        async function loadDropdowns() {
            try {
                const [foodsRes, stocksRes] = await Promise.all([
                    supabaseClient.from('foods').select('id, name').order('name'),
                    supabaseClient.from('food_stocks').select('id, food_name').order('food_name')
                ]);

                if (foodsRes.data) {
                    foodsList = foodsRes.data;
                    const foodSelect = document.getElementById('foodSelect');
                    foodSelect.innerHTML = '<option value="">-- เลือกเมนูอาหาร --</option>' +
                        foodsList.map(f => `<option value="${f.id}">${f.name}</option>`).join('');
                }

                if (stocksRes.data) {
                    stocksList = stocksRes.data;
                    const stockSelect = document.getElementById('stockSelect');
                    stockSelect.innerHTML = '<option value="">-- เลือกวัตถุดิบ --</option>' +
                        stocksList.map(s => `<option value="${s.food_name}">${s.food_name}</option>`).join('');
                }
            } catch (err) {
                console.error('Error loading dropdowns:', err);
            }
        }

        async function loadMappings() {
            try {
                const { data, error } = await supabaseClient
                    .from('food_mappings')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const tbody = document.getElementById('mappingTableBody');
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center p-4 text-gray-400">ยังไม่มีข้อมูลการจับคู่</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(m => {
                    const foodItem = foodsList.find(f => String(f.id) === String(m.food_id));
                    const foodName = foodItem ? foodItem.name : `เมนู ID: ${m.food_id}`;

                    return `
                        <tr class="hover:bg-slate-50">
                            <td class="p-3 font-bold text-slate-800">${foodName}</td>
                            <td class="p-3 text-blue-600 font-semibold">${m.stock_name}</td>
                            <td class="p-3 text-center">
                                <button onclick="deleteMapping(${m.id})" class="text-red-500 hover:text-red-700 font-bold px-2 py-1">
                                    🗑️ ลบ
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error('Error loading mappings:', err);
            }
        }

        async function addMapping() {
            const foodId = document.getElementById('foodSelect').value;
            const stockName = document.getElementById('stockSelect').value;

            if (!foodId || !stockName) {
                alert('⚠️ กรุณาเลือกทั้งเมนูอาหารและวัตถุดิบ');
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('food_mappings')
                    .insert([{
                        food_id: Number(foodId),
                        stock_name: stockName
                    }]);

                if (error) throw error;

                alert('✅ จับคู่สำเร็จ!');
                loadMappings();
            } catch (err) {
                console.error('Error adding mapping:', err);
                alert('❌ ไม่สามารถบันทึกได้: ' + err.message);
            }
        }

        async function deleteMapping(id) {
            if (!confirm('ยืนยันการลบรายการจับคู่นี้?')) return;

            try {
                const { error } = await supabaseClient
                    .from('food_mappings')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                loadMappings();
            } catch (err) {
                console.error('Error deleting mapping:', err);
                alert('❌ เกิดข้อผิดพลาดในการลบ: ' + err.message);
            }
        }
    </script>
</body>
</html>
