<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>ตรวจสอบออเดอร์ - ลาบหนองบัวลำภู</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --border-color: #334155;
            --primary: #2563eb;
            --success: #16a34a;
        }

        html, body {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            -webkit-text-size-adjust: 100%;
            background-color: var(--bg-color);
            color: #1e293b;
            font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
        }

        .page-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 672px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .fixed-header {
            flex-shrink: 0;
            padding: 12px 12px 6px 12px;
            background-color: var(--bg-color);
            z-index: 10;
        }

        .main-content-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 6px 12px 0 12px;
            gap: 8px;
        }

        .cart-preview-box {
            background-color: #ffffff;
            border: 2px dashed #16a34a;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .cart-preview-header {
            flex-shrink: 0;
        }

        .scrollable-items {
            flex: 1;
            overflow-y: auto;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            padding-right: 2px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .cart-item-row:last-child {
            border-bottom: none;
        }

        .delete-btn {
            color: #ef4444;
            font-weight: bold;
            font-size: 16px;
            padding: 0 4px;
            cursor: pointer;
            line-height: 1;
            border: none;
            background: transparent;
        }

        .delete-btn:hover {
            color: #b91c1c;
        }

        .group-btn-v2 {
            background-color: #ffffff;
            border: 1.5px solid #fde68a;
            color: #334155;
            transition: all 0.2s ease;
        }

        .group-btn-v2.active {
            background-color: #f59e0b;
            border-color: #d97706;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(245, 158, 11, 0.3);
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .custom-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .custom-modal-box {
            background: white;
            border-radius: 20px;
            padding: 20px;
            width: 92%;
            max-width: 440px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

<div class="page-container">

    <!-- จุดที่จะให้ location.js เรนเดอร์ส่วนเลือกกลุ่มและสถานที่ -->
    <div id="locationSelectorWrapper"></div>

    <div class="main-content-box">
        <div class="flex justify-between items-center px-1 text-xs font-bold text-slate-700 shrink-0">
            <span class="flex items-center gap-1.5">🛒 ตะกร้าสินค้าปัจจุบัน:</span>
            <span id="cartCountText" class="text-green-600 font-extrabold text-sm">0 รายการ | 0 ชิ้น</span>
        </div>

        <div class="cart-preview-box">
            <div class="cart-preview-header flex justify-between items-center mb-3 pb-2 border-b border-dashed border-green-300">
                <div class="font-bold text-green-700 text-sm flex items-center gap-1.5">
                    📋 รายการที่เลือกไว้แล้ว
                </div>
                <div id="cartTotalPrice" class="font-black text-red-600 text-sm">รวม 0.-</div>
            </div>
            
            <div class="scrollable-items">
                <div id="cartPreviewList" class="flex flex-col">
                    <span class="text-gray-400 text-xs py-4 text-center block">⏳ กำลังโหลดรายการ...</span>
                </div>
            </div>
        </div>

        <div class="bg-white border border-slate-200 rounded-2xl p-3 shadow-sm shrink-0 mb-20">
            <label class="block text-xs font-bold text-slate-700 mb-1">หมายเหตุออเดอร์ (ถ้ามี):</label>
            <input type="text" id="orderNoteInput" oninput="handleNoteChange(this.value);" placeholder="เช่น ใส่กล่องแยกน้ำ, ทานที่นี่..." class="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 outline-none">
        </div>
    </div>

</div>

<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-3 shadow-lg z-50">
    <div class="max-w-2xl mx-auto flex gap-2">
        <a href="OrderEntity.html" class="bg-white hover:bg-gray-50 text-slate-800 border border-slate-300 font-bold py-2.5 px-3 rounded-xl text-xs flex-1 text-center shadow transition flex items-center justify-center">
            ⬅️ กลับไปแก้ไข
        </a>
        <button onclick="submitOrder()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-3 rounded-xl text-xs flex-1 text-center shadow transition">
            ✅ บันทึก / ส่งออเดอร์
        </button>
    </div>
</div>

<script src="key.js"></script>
<script src="location.js"></script>
<script>
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let dbFoodsMap = {}; 
    let isDeliveryFeeWaived = false;

    let savedOrderNote = localStorage.getItem('orderNote') || '';

    document.addEventListener('touchmove', function (event) {
        if (!event.target.closest('.scrollable-items') && !event.target.closest('.custom-modal-box')) {
            event.preventDefault();
        }
    }, { passive: false });

    window.addEventListener('DOMContentLoaded', async () => {
        await Promise.all([
            initLocationComponent('locationSelectorWrapper'),
            fetchLatestFoods()
        ]);

        document.getElementById('orderNoteInput').value = savedOrderNote;

        // ดึงกลุ่มลูกค้าเดิมที่เคยเลือกไว้ ถ้าไม่มี (เข้าครั้งแรกหรือเคลียร์ออเดอร์ไปแล้ว) ให้ default เป็น 1 (ชาวบ้าน)
        const savedGroupId = localStorage.getItem('selectedGroupId') || '1';
        const groupSelectElem = document.getElementById('customerGroupSelect');
        if (groupSelectElem) {
            groupSelectElem.value = savedGroupId;
            // ดักจับเหตุการณ์เมื่อมีการเปลี่ยนกลุ่มลูกค้า ให้จำลง localStorage และคำนวณราคาใหม่
            groupSelectElem.addEventListener('change', function() {
                localStorage.setItem('selectedGroupId', this.value);
                renderOrderSummary();
            });
        }

        renderOrderSummary();
    });

    async function fetchLatestFoods() {
        try {
            const { data, error } = await supabaseClient.from('foods').select('*');
            if (error) throw error;
            if (data) {
                dbFoodsMap = {};
                data.forEach(f => {
                    dbFoodsMap[String(f.id)] = f;
                });
            }
        } catch (err) {
            console.error('Error fetching foods:', err);
        }
    }

    function handleNoteChange(val) {
        savedOrderNote = val;
        localStorage.setItem('orderNote', val);
    }

    // ฟังก์ชันคำนวณราคาฐาน (รองรับราคาพิเศษ)
    function getGroupBasePrice(item, groupId) {
        if (item.is_custom_price && Number(item.custom_price) > 0) {
            return Number(item.custom_price);
        }

        const gId = Number(groupId) || 1;
        const fId = String(item.food_id);

        if (gId === 1 && item.price_1 !== undefined && item.price_1 > 0) return Number(item.price_1);
        if (gId === 2 && item.price_2 !== undefined && item.price_2 > 0) return Number(item.price_2);
        if (gId === 3 && item.price_3 !== undefined && item.price_3 > 0) return Number(item.price_3);

        if (dbFoodsMap[fId]) {
            const foodObj = dbFoodsMap[fId];
            if (gId === 1) return Number(foodObj.price_1 || 0);
            if (gId === 2) return Number(foodObj.price_2 || 0);
            if (gId === 3) return Number(foodObj.price_3 || 0);
        }

        return 0;
    }

    function removeDeliveryFee() {
        isDeliveryFeeWaived = true;
        renderOrderSummary();
    }

    function renderOrderSummary() {
        cart = JSON.parse(localStorage.getItem('cart')) || [];
        
        const groupSelectElem = document.getElementById('customerGroupSelect');
        const currentGroupId = groupSelectElem ? (Number(groupSelectElem.value) || 1) : 1;
        
        const selectedLocElem = document.getElementById('selectedLocationName');
        const selectedLoc = selectedLocElem ? selectedLocElem.value : '';

        const totalItems = cart.length;
        const totalQty = cart.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
        document.getElementById('cartCountText').textContent = `${totalItems} รายการ | ${totalQty} ชิ้น`;

        const listContainer = document.getElementById('cartPreviewList');
        if (!listContainer) return;

        if (cart.length === 0) {
            listContainer.innerHTML = '<span class="text-gray-400 text-xs py-8 text-center block">ไม่มีรายการอาหารในตะกร้า</span>';
            document.getElementById('cartTotalPrice').textContent = 'รวม 0.-';
            return;
        }

        let totalCartPrice = 0;
        listContainer.innerHTML = '';

        cart.forEach((item, index) => {
            const basePrice = getGroupBasePrice(item, currentGroupId);
            const eggCost = (Number(item.fried_egg) || 0) * 10;
            const omeletCost = (Number(item.omelet) || 0) * 10;
            const unitPrice = basePrice + eggCost + omeletCost;
            const itemTotalPrice = unitPrice * (Number(item.qty) || 1);

            totalCartPrice += itemTotalPrice;

            let details = [];
            if (item.is_custom_price && Number(item.custom_price) > 0) {
                details.push(`⭐ ราคาพิเศษ ${item.custom_price}.-`);
            }
            if (item.fried_egg > 0) details.push(`ไข่ดาว +${item.fried_egg}`);
            if (item.omelet > 0) details.push(`ไข่เจียว +${item.omelet}`);
            if (item.note) details.push(`Note: ${item.note}`);

            const row = document.createElement('div');
            row.className = 'cart-item-row';
            row.innerHTML = `
                <div class="flex-1 pr-2">
                    <div class="font-bold text-xs text-slate-800">${item.name}</div>
                    <div class="text-[11px] text-slate-500">${unitPrice} x ${item.qty}</div>
                    ${details.length > 0 ? `<div class="text-[10px] text-amber-600 font-medium">${details.join(', ')}</div>` : ''}
                </div>
                <div class="flex items-center gap-3">
                    <span class="font-extrabold text-xs text-slate-800">${itemTotalPrice}.-</span>
                    <button type="button" onclick="removeItem(${index})" class="delete-btn">&times;</button>
                </div>
            `;
            listContainer.appendChild(row);
        });

        let deliveryFee = 0;
        const isStoreFront = selectedLoc.includes('หน้าร้าน');
        if (currentGroupId === 2 && !isStoreFront && !isDeliveryFeeWaived) {
            if (totalCartPrice < 300) {
                deliveryFee = 20;
            }
        }

        if (deliveryFee > 0) {
            const deliveryRow = document.createElement('div');
            deliveryRow.className = 'cart-item-row bg-amber-50/60 p-2 rounded-xl my-1 border border-amber-100';
            deliveryRow.innerHTML = `
                <div class="flex-1 pr-2 flex items-center gap-1">
                    <span class="text-sm">🛵</span>
                    <div>
                        <div class="font-bold text-xs text-amber-900">ค่าบริการจัดส่ง <span class="text-[10px] text-amber-600 font-normal">(สั่งไม่ถึง 300.-)</span></div>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <span class="font-extrabold text-xs text-amber-900">${deliveryFee}.-</span>
                    <button type="button" onclick="removeDeliveryFee()" class="delete-btn" title="ยกเลิกค่าจัดส่ง">&times;</button>
                </div>
            `;
            listContainer.appendChild(deliveryRow);
        }

        const grandTotal = totalCartPrice + deliveryFee;
        document.getElementById('cartTotalPrice').textContent = `รวม ${grandTotal}.-`;
    }

    function removeItem(index) {
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        renderOrderSummary();
    }

    function submitOrder() {
        if (cart.length === 0) {
            alert('กรุณาเลือกรายการอาหารก่อนส่งออเดอร์');
            return;
        }

        const groupId = document.getElementById('customerGroupSelect').value;
        const groupName = document.getElementById('selectedGroupName').value;
        const phone = document.getElementById('customerPhoneInput').value;
        const note = document.getElementById('orderNoteInput').value;
        const locationName = document.getElementById('selectedLocationName').value;
        const zoneName = document.getElementById('selectedZoneName').value;

        let subtotal = 0;

        const processedCart = cart.map(item => {
            const basePrice = getGroupBasePrice(item, groupId);
            const eggCost = (Number(item.fried_egg) || 0) * 10;
            const omeletCost = (Number(item.omelet) || 0) * 10;
            const unitPrice = basePrice + eggCost + omeletCost;

            subtotal += unitPrice * (Number(item.qty) || 1);

            return {
                ...item,
                price: basePrice,
                price_1: item.price_1 || basePrice,
                unit_price: unitPrice
            };
        });

        let deliveryFee = 0;
        if (Number(groupId) === 2 && !locationName.includes('หน้าร้าน') && !isDeliveryFeeWaived && subtotal < 300) {
            deliveryFee = 20;
        }

        const orderData = {
            cart: processedCart,
            groupId: groupId,
            groupName: groupName,
            customerPhone: phone,
            orderNote: note,
            locationName: locationName,
            zoneName: zoneName,
            subtotal: subtotal,
            deliveryFee: deliveryFee,
            grandTotal: subtotal + deliveryFee,
            createdAt: new Date().toISOString()
        };

        localStorage.setItem('pendingOrder', JSON.stringify(orderData));
        
        // เคลียร์ค่ากลุ่มลูกค้าที่เคยบันทึกไว้ เพื่อให้ออเดอร์ถัดไปรีเซ็ตกลับเป็น Default (ชาวบ้าน)
        localStorage.removeItem('selectedGroupId');

        window.location.href = 'PrintOrder.html';
    }
</script>
</body>
</html>
