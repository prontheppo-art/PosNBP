<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>ตรวจสอบรายการ</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="key.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap');
        
        html, body { 
            height: 100%; margin: 0; padding: 0; 
            font-family: 'Sarabun', sans-serif; background: #f4f6f9; 
            -webkit-user-select: none; user-select: none;
        }

        .app-layout { 
            display: flex; align-items: center; justify-content: center; 
            min-height: 100vh; min-height: 100dvh; width: 100vw; padding: 12px; box-sizing: border-box; 
        }

        .cart-container { 
            width: 100%; max-width: 420px; max-height: 96vh; height: 100%; background: #fff; 
            border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
        }

        /* ปรับแต่งให้รองรับการ Scroll บนมือถืออย่างสมบูรณ์ */
        #cartItemList { 
            touch-action: pan-y !important; 
            -webkit-overflow-scrolling: touch !important; 
            overflow-y: auto !important;
            max-height: 100%;
        }

        .location-card {
            background-color: #fffdf5; border: 1.5px solid #fef3c7; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 14px 8px; cursor: pointer; transition: all 0.15s ease-in-out;
            box-shadow: 0 2px 6px rgba(217, 119, 6, 0.05);
        }
        .location-card:active { transform: scale(0.96); background-color: #fef3c7; }

        .room-card {
            background-color: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 14px;
            padding: 10px 4px; text-align: center; font-size: 11px; font-weight: 700;
            color: #334155; cursor: pointer; transition: all 0.15s ease-in-out;
        }
        .room-card:active { transform: scale(0.96); background-color: #e2e8f0; border-color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="app-layout">
        <div class="cart-container">
            <div class="pb-2 mb-3 border-b border-slate-100 shrink-0">
                <h1 class="text-base font-extrabold text-slate-800 text-center tracking-wide">ตรวจสอบรายการ</h1>
            </div>

            <div class="bg-amber-50/70 p-2.5 rounded-2xl border border-amber-200/80 mb-3 space-y-2.5 shrink-0">
                <div class="flex items-center justify-between gap-1.5">
                    <button type="button" onclick="selectCustomerType('ชาวบ้าน')" id="btn-type-1" class="cust-type-btn flex-1 h-10 flex items-center justify-center gap-1 px-1 bg-white border border-amber-300 rounded-xl text-[11px] font-bold text-slate-700 shadow-sm transition-all active:scale-95 whitespace-nowrap">
                        <span>🏡</span> <span>ชาวบ้าน</span>
                    </button>

                    <button type="button" onclick="handleTouristClick()" id="btn-type-2" class="cust-type-btn flex-1 h-10 flex items-center justify-center gap-1 px-1 bg-amber-500 text-white border border-amber-500 rounded-xl text-[11px] font-bold shadow-sm transition-all active:scale-95 whitespace-nowrap">
                        <span>🧳</span> <span id="touristBtnLabel">นักท่องเที่ยว</span>
                    </button>

                    <button type="button" onclick="selectCustomerType('สบายดี')" id="btn-type-3" class="cust-type-btn flex-1 h-10 flex items-center justify-center gap-1 px-1 bg-white border border-amber-300 rounded-xl text-[11px] font-bold text-slate-700 shadow-sm transition-all active:scale-95 whitespace-nowrap">
                        <span>😊</span> <span>สบายดี</span>
                    </button>
                </div>

                <div class="flex items-center gap-2">
                    <div class="relative flex-1">
                        <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-xs">📞</span>
                        <input type="tel" id="customerPhoneInput" maxlength="10" placeholder="เบอร์โทร (ถ้ามี)" oninput="this.value = this.value.replace(/[^0-9]/g, '');" class="w-full pl-7 pr-2 h-9 text-xs font-semibold bg-white border border-amber-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400 text-slate-800 placeholder-slate-400">
                    </div>
                </div>
            </div>

            <!-- กล่องรายการอาหาร -->
            <div class="bg-white rounded-2xl border border-slate-200 p-3 mb-3 flex flex-col flex-1 min-h-0 overflow-hidden shadow-sm">
                <div class="flex justify-between items-center text-xs font-bold text-slate-500 pb-2 border-b border-slate-100 mb-2 px-1 shrink-0">
                    <span class="w-1/2">รายการอาหาร</span>
                    <span class="w-1/6 text-center">จำนวน</span>
                    <span class="w-1/3 text-right">รวม (บาท)</span>
                </div>

                <!-- พื้นที่รายการอาหารแบบ Scrollable -->
                <div id="cartItemList" class="space-y-2 overflow-y-auto pr-1 flex-1"></div>

                <div class="mt-2 pt-2 border-t border-slate-100 bg-emerald-50 rounded-xl p-2 flex justify-between items-center text-xs font-bold text-emerald-800 shrink-0">
                    <span id="cartSummaryCount">0 รายการ | 0 ชิ้น</span>
                    <span id="cartTotalPrice" class="text-sm">ราคารวมทั้งหมด: 0 บาท</span>
                </div>
            </div>

            <div class="mb-3 shrink-0">
                <label class="block text-xs font-bold text-slate-700 mb-1">หมายเหตุออเดอร์ (ถ้ามี):</label>
                <input type="text" id="orderNoteInput" placeholder="เช่น ใส่กล่องแยกน้ำ, ทานที่นี่..." class="w-full px-3 py-2 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-400 text-slate-800">
            </div>

            <div class="flex items-center gap-2 w-full shrink-0">
                <button type="button" onclick="goBackToMenu()" class="flex-1 h-11 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-2 rounded-xl text-xs active:scale-95 transition flex items-center justify-center gap-1 shadow-sm whitespace-nowrap">
                    <span>⬅️</span> <span>กลับไปแก้ไข</span>
                </button>
                <button type="button" onclick="goToPrintOrder()" class="flex-[2] h-11 bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-2 rounded-xl text-xs shadow-md active:scale-95 transition flex items-center justify-center gap-1 whitespace-nowrap">
                    <span>✅</span> <span>ไปหน้าสั่งพิมพ์ใบเสร็จ</span>
                </button>
            </div>
        </div>
    </div>

    <script src="ConfirmOrder_Location.js"></script>

    <script>
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });

        let cartItems = [];

        window.onload = async function() {
            loadCartData();
            initCustomerType();
            updateLocationButtonText();
            if (typeof fetchLocationsAndZones === 'function') await fetchLocationsAndZones();
        };

        function loadCartData() {
            const rawCart = localStorage.getItem('cart');
            cartItems = rawCart ? JSON.parse(rawCart) : [];
            document.getElementById('customerPhoneInput').value = localStorage.getItem('customerPhone') || '';
            document.getElementById('orderNoteInput').value = localStorage.getItem('orderNote') || '';
            renderCartList();
        }

        function getItemUnitPrice(item, currentGroup) {
            if (item.isDeliveryFee) return 20;
            let p = 0;
            if (currentGroup === 'ชาวบ้าน') p = item.price_group_1 ?? item.price_local ?? item.price ?? 0;
            else if (currentGroup === 'นักท่องเที่ยว') p = item.price_group_2 ?? item.price_tourist ?? item.price ?? 0;
            else if (currentGroup === 'สบายดี') p = item.price_group_3 ?? item.price_sabaidee ?? item.price ?? 0;
            else p = item.price || 0;
            return Number(p);
        }

        function cleanNoteText(noteStr) {
            if (!noteStr) return '';
            const parts = noteStr.split(',').map(s => s.trim()).filter(Boolean);
            return [...new Set(parts)].join(', ');
        }

        function renderCartList() {
            const currentGroup = localStorage.getItem('selectedGroupName') || 'นักท่องเที่ยว';
            const currentLocation = localStorage.getItem('selectedLocation') || '';
            
            // 1. แยกรายการอาหาร (ไม่รวมค่าจัดส่ง)
            const pureFoodItems = cartItems.filter(item => !item.isDeliveryFee);

            // 2. จัดเรียงตามตัวอักษร ก-ฮ (จากน้อยไปหามาก)
            pureFoodItems.sort((a, b) => {
                const nameA = a.name || '';
                const nameB = b.name || '';
                return nameA.localeCompare(nameB, 'th');
            });

            // 3. คำนวณราคารวมอาหาร
            let foodSubtotal = 0;
            pureFoodItems.forEach(item => {
                const q = Number(item.qty || 1);
                const p = getItemUnitPrice(item, currentGroup);
                foodSubtotal += (q * p);
            });

            // 4. เงื่อนไขค่าจัดส่ง
            const isAtStore = (currentLocation === 'หน้าร้าน' || currentLocation.includes('หน้าร้าน'));
            let needDeliveryFee = false;

            if (currentGroup === 'นักท่องเที่ยว' && !isAtStore && foodSubtotal > 0 && foodSubtotal < 300) {
                needDeliveryFee = true;
            }

            if (needDeliveryFee) {
                const deliveryItem = { name: 'ค่าบริการจัดส่ง', note: 'ยอดน้อยกว่า 300 บาท', qty: 1, price: 20, isDeliveryFee: true };
                cartItems = [...pureFoodItems, deliveryItem];
            } else {
                cartItems = [...pureFoodItems];
            }

            const container = document.getElementById('cartItemList');
            container.innerHTML = '';

            if (cartItems.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-400 py-6 text-xs font-semibold">ไม่มีรายการอาหารในตะกร้า</div>`;
                updateSummary(0, 0, 0);
                return;
            }

            let grandTotalPrice = 0, foodItemCount = 0, foodTotalQty = 0;

            cartItems.forEach((item, index) => {
                const itemQty = Number(item.qty || 1);
                const itemUnitPrice = getItemUnitPrice(item, currentGroup);
                const itemSum = itemQty * itemUnitPrice;

                grandTotalPrice += itemSum;
                if (!item.isDeliveryFee) { foodItemCount++; foodTotalQty += itemQty; }

                const cleanedNote = cleanNoteText(item.note);
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center py-2 border-b border-slate-100 text-xs';
                
                div.innerHTML = `
                    <div class="w-1/2 pr-1">
                        <div class="font-bold ${item.isDeliveryFee ? 'text-amber-600' : 'text-slate-800'}">${item.name || 'รายการอาหาร'}</div>
                        ${cleanedNote ? `<div class="text-[10px] ${item.isDeliveryFee ? 'text-amber-500' : 'text-rose-500'} font-semibold">${cleanedNote}</div>` : ''}
                    </div>
                    <div class="w-1/6 text-center font-bold text-slate-700">${itemQty}</div>
                    <div class="w-1/3 text-right flex items-center justify-end gap-1">
                        <span class="font-bold text-blue-600">${itemSum.toLocaleString()}.-</span>
                        ${!item.isDeliveryFee ? `<button onclick="removeItem(${index})" class="text-rose-500 hover:text-rose-700 font-black px-1">✕</button>` : '<span class="w-4"></span>'}
                    </div>
                `;
                container.appendChild(div);
            });

            updateSummary(foodItemCount, foodTotalQty, grandTotalPrice);
        }

        function updateSummary(typeCount, totalQty, totalPrice) {
            document.getElementById('cartSummaryCount').textContent = `${typeCount} รายการ | ${totalQty} ชิ้น`;
            document.getElementById('cartTotalPrice').textContent = `ราคารวมทั้งหมด: ${totalPrice.toLocaleString()} บาท`;
        }

        function removeItem(index) {
            cartItems.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cartItems));
            renderCartList();
        }

        function initCustomerType() {
            const currentType = localStorage.getItem('selectedGroupName') || 'นักท่องเที่ยว';
            selectCustomerType(currentType);
        }

        function selectCustomerType(type) {
            localStorage.setItem('selectedGroupName', type);
            document.querySelectorAll('.cust-type-btn').forEach(btn => {
                btn.classList.remove('bg-amber-500', 'text-white', 'border-amber-500');
                btn.classList.add('bg-white', 'text-slate-700', 'border-amber-300');
            });

            if (type === 'นักท่องเที่ยว') setBtnActive('btn-type-2');
            else if (type === 'ชาวบ้าน') setBtnActive('btn-type-1');
            else if (type === 'สบายดี') setBtnActive('btn-type-3');

            renderCartList();
        }

        function setBtnActive(id) {
            const btn = document.getElementById(id);
            if(btn) {
                btn.classList.remove('bg-white', 'text-slate-700', 'border-amber-300');
                btn.classList.add('bg-amber-500', 'text-white', 'border-amber-500');
            }
        }

        function handleTouristClick() {
            selectCustomerType('นักท่องเที่ยว');
            openLocationModal();
        }

        function updateLocationButtonText() {
            const loc = localStorage.getItem('selectedLocation');
            const btnLabel = document.getElementById('touristBtnLabel');
            if (loc && btnLabel) btnLabel.textContent = loc;
        }

        function saveInputs() {
            localStorage.setItem('customerPhone', document.getElementById('customerPhoneInput').value.trim());
            localStorage.setItem('orderNote', document.getElementById('orderNoteInput').value.trim());
        }

        function goBackToMenu() {
            saveInputs();
            window.location.href = 'OrderEntry.html';
        }

        function goToPrintOrder() {
            if (cartItems.length === 0) {
                alert('กรุณาเลือกรายการอาหารก่อนทำรายการค่ะ');
                return;
            }
            saveInputs();
            const currentGroup = localStorage.getItem('selectedGroupName') || 'นักท่องเที่ยว';
            const updatedCart = cartItems.map(item => ({
                ...item,
                price: getItemUnitPrice(item, currentGroup),
                note: cleanNoteText(item.note)
            }));
            localStorage.setItem('cart', JSON.stringify(updatedCart));
            window.location.href = 'PrintOrder.html';
        }
    </script>
</body>
</html>
