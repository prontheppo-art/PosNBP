<!--
  ========================================
  [File Note]
  - File Name: renamemenu.html
  - Included JS / Libraries: 
      • key.js
      • Tailwind CSS (CDN)
      • Supabase JS Client (CDN)
  - Parent Window Integration:
      • เรียก window.parent.closeSubModalFrame() เมื่อบันทึกหรือยกเลิก
  - Supabase Tables Used:
      • foods (UPDATE name)
  ========================================
-->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แก้ไขชื่อรายการอาหาร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: sans-serif;
            user-select: none;
        }
    </style>
</head>
<body class="p-4 flex items-center justify-center min-h-screen bg-slate-900/60 backdrop-blur-xs">

    <!-- Modal Box Container -->
    <div class="w-full max-w-xs bg-white rounded-3xl shadow-2xl p-5 text-left space-y-4 border border-slate-100 z-10">
        
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-100 pb-2">
            <h3 class="font-bold text-sm text-slate-800 flex items-center gap-1.5">
                <span>✏️</span> แก้ไขชื่อรายการอาหาร
            </h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-sm font-bold cursor-pointer">✕</button>
        </div>
        
        <!-- Input Form -->
        <div>
            <label class="block text-[11px] font-bold text-slate-600 mb-1.5">ชื่อรายการอาหารใหม่:</label>
            <input type="text" id="foodNameInput" placeholder="กรอกชื่อรายการอาหาร..." class="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs outline-none bg-slate-50 focus:bg-white focus:border-indigo-500 font-bold text-slate-800 transition">
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="closeModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2.5 rounded-xl text-xs transition cursor-pointer">
                ยกเลิก
            </button>
            <button onclick="handleUpdateFoodName()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-xs cursor-pointer">
                บันทึก
            </button>
        </div>

    </div>

    <!-- Script Section -->
    <script src="key.js"></script>
    <script>
        let db;
        let foodId = null;
        let currentFoodName = '';

        window.addEventListener('DOMContentLoaded', () => {
            if (window.supabaseClient) {
                db = window.supabaseClient;
            } else if (typeof supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_KEY !== 'undefined') {
                db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }

            const urlParams = new URLSearchParams(window.location.search);
            foodId = urlParams.get('foodId');
            currentFoodName = urlParams.get('foodName') || '';

            if (foodNameInput) {
                document.getElementById('foodNameInput').value = decodeURIComponent(currentFoodName);
            }
        });

        async function handleUpdateFoodName() {
            const input = document.getElementById('foodNameInput');
            const newName = input.value.trim();

            if (!newName) {
                alert('กรุณากรอกชื่อรายการอาหาร');
                return;
            }

            if (!foodId || !db) {
                alert('ไม่พบบริบทข้อมูลหรือการเชื่อมต่อ DB');
                return;
            }

            try {
                const { error } = await db
                    .from('foods')
                    .update({ name: newName })
                    .eq('id', foodId);

                if (error) throw error;
                closeModal();
            } catch (err) {
                alert('ไม่สามารถอัปเดตชื่อได้: ' + err.message);
            }
        }

        function closeModal() {
            if (window.parent && window.parent.closeSubModalFrame) {
                window.parent.closeSubModalFrame();
            } else if (window.parent && window.parent.closeAddMenuIframe) {
                window.parent.closeAddMenuIframe();
            }
        }
    </script>
</body>
</html>
