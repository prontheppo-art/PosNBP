<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>รายงานออร์เดอร์รายวัน</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- เรียกไฟล์คีย์แยกตามเงื่อนไขเพื่อดึง SUPABASE_URL และ SUPABASE_KEY -->
    <script src="key.js"></script>
    <!-- เรียกไฟล์ Calendar System -->
    <script src="slender.js"></script>
    
    <style>
      /* CSS เฉพาะของ UI แอป */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: sans-serif;
        background: #f4f6f9;
        touch-action: pan-y;
        -webkit-text-size-adjust: 100%;
        -webkit-user-select: none;
        user-select: none;
      }

      .app-container {
        max-width: 500px;
        margin: 0 auto;
        height: 100dvh;
        background: #fff;
        display: grid;
        grid-template-rows: auto auto 1fr;
        box-sizing: border-box;
        overflow: hidden;
      }
    </style>
</head>
<body>

<div class="app-container shadow-xl">
    <!-- Header Section (Fixed Top) -->
    <div class="p-3 bg-white border-b flex justify-between items-center shrink-0">
        <div>
            <h1 class="font-bold text-xs text-slate-800">📊 รายงานออร์เดอร์รายวัน</h1>
        </div>
        <a href="index.html" class="text-xs bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg font-semibold hover:bg-slate-300">⬅️ กลับ</a>
    </div>

    <!-- Filter Section (ปรับ UI กล่องเลือกวันที่ตามรูปที่ 1) -->
    <div class="p-3 bg-slate-50 border-b space-y-2 shrink-0">
        <div class="bg-blue-50 p-2.5 rounded-xl border border-blue-100 flex items-center justify-between">
            <span class="text-xs font-bold text-blue-900 flex items-center gap-1.5">
                📅 เลือกวันที่:
            </span>
            <button type="button" onclick="openCalendar()" id="btnSelectedDate" class="px-3 py-1.5 border border-slate-200 rounded-xl text-xs font-bold bg-white text-blue-700 shadow-sm flex items-center gap-1 cursor-pointer">
                <span id="txtSelectedDate" class="font-bold text-blue-600">--/--/----</span>
            </button>
        </div>
        <div class="grid grid-cols-2 gap-2">
            <div class="bg-white p-2.5 rounded-lg border shadow-sm"><div class="text-[10px] text-slate-500">จำนวนบิลวันนี้</div><div class="text-sm font-bold text-slate-800" id="summaryCount">0 บิล</div></div>
            <div class="bg-emerald-50 p-2.5 rounded-lg border border-emerald-200 shadow-sm"><div class="text-[10px] text-emerald-700">ยอดขายรวมสุทธิ</div><div class="text-sm font-bold text-emerald-600" id="summaryTotal">0 บาท</div></div>
        </div>
    </div>

    <!-- Content Section (Scrollable Container) -->
    <div class="p-3 overflow-y-auto space-y-3 bg-slate-100" id="dailyOrdersContainer" style="-webkit-overflow-scrolling: touch;"></div>
</div>

<script>
    let db;
    let allOrdersCache = [];
    
    // ฟังก์ชั่นดึงวันที่ปัจจุบันในรูปแบบ YYYY-MM-DD (อิงตามเวลาท้องถิ่น)
    function getTodayString() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    // ฟังก์ชั่นแปลงรูปแบบวันที่ YYYY-MM-DD เป็น DD/MM/YYYY
    function formatDateThai(dateString) {
        if (!dateString) return '';
        const parts = dateString.split('-');
        if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
        return dateString;
    }

    let currentSelectedDate = getTodayString();

    // ฟังก์ชั่นอัปเดตข้อความวันที่บนหน้าจอ
    function updateDateDisplay(dateStr) {
        currentSelectedDate = dateStr || getTodayString();
        const txtDate = document.getElementById('txtSelectedDate');
        if (txtDate) {
            txtDate.textContent = formatDateThai(currentSelectedDate);
        }
    }

    function openCalendar() {
        if (typeof CalendarSystem !== 'undefined' && typeof CalendarSystem.open === 'function') {
            CalendarSystem.open(currentSelectedDate);
        } else {
            console.warn("CalendarSystem is not available");
        }
    }

    window.onload = function() {
        // แสดงวันที่ปัจจุบันทันทีเมื่อเปิดหน้า
        updateDateDisplay(currentSelectedDate);

        // เชื่อมต่อ Supabase
        if (typeof window.supabaseClient !== 'undefined') {
            db = window.supabaseClient;
        } else if (typeof window.supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_KEY !== 'undefined') {
            db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } else {
            console.error("Critical Error: ไม่สามารถเชื่อมต่อ Supabase ได้");
        }

        // เริ่มต้นระบบปฏิทิน
        if (typeof CalendarSystem !== 'undefined' && typeof CalendarSystem.init === 'function') {
            CalendarSystem.init((selectedDate) => {
                if (selectedDate) {
                    updateDateDisplay(selectedDate);
                    filterOrdersByDate();
                }
            });
        }

        fetchOrdersForReport();
    };

    async function fetchOrdersForReport() {
        if (!db) return;
        
        const { data, error } = await db.from('orders').select('*').order('id', { ascending: false });
        
        if (error) {
            console.error("Error fetching orders:", error);
            return;
        }

        allOrdersCache = data || [];
        filterOrdersByDate();
    }

    function filterOrdersByDate() {
        const container = document.getElementById('dailyOrdersContainer');
        if (!container) return;
        
        container.innerHTML = '';

        // ปรับปรุงการเช็กวันที่: ดึงเอาเฉพาะ YYYY-MM-DD จาก created_at หรือ order_date
        let filtered = allOrdersCache.filter(o => {
            let oDate = '';
            if (o.created_at) {
                // แปลง Timestamp ของ Supabase เป็น YYYY-MM-DD ตามเขตเวลาเครื่อง
                const d = new Date(o.created_at);
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                oDate = `${year}-${month}-${day}`;
            } else if (o.order_date) {
                oDate = o.order_date.split('T')[0];
            }
            
            return oDate === currentSelectedDate && o.status !== 'pending';
        });
        
        if (filtered.length === 0) {
            container.innerHTML = `<div class="text-center text-xs text-slate-400 py-8">📭 ไม่พบออร์เดอร์ในวันที่ ${formatDateThai(currentSelectedDate)}</div>`;
            document.getElementById('summaryCount').textContent = '0 บิล';
            document.getElementById('summaryTotal').textContent = '0 บาท';
            return;
        }

        let total = 0;
        filtered.forEach((order, index) => {
            let items = [];
            if (typeof order.items === 'string') {
                try { items = JSON.parse(order.items); } catch(e) { items = []; }
            } else if (Array.isArray(order.items)) {
                items = order.items;
            }

            let billTotal = Number(order.total_price || order.total || 0);
            total += billTotal;
            
            let itemsHtml = items.map(item => {
                let itemQty = Number(item.qty || item.quantity || 1);
                let itemTotalPrice = (item.price && !isNaN(item.price)) ? Number(item.price) * itemQty : 0;
                let itemName = item.name || item.food_name || 'ไม่ระบุชื่อรายการ';
                
                return `<tr class="border-b border-slate-100">
                    <td class="p-1.5 text-xs text-slate-800">${itemName}</td>
                    <td class="p-1.5 text-xs text-center">x${itemQty}</td>
                    <td class="p-1.5 text-xs text-right font-bold text-blue-600">${itemTotalPrice.toLocaleString()}.-</td>
                </tr>`;
            }).join('');
            
            container.innerHTML += `
                <div class="bg-white border border-slate-200 rounded-xl p-3 shadow-xs space-y-2">
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-bold text-xs text-amber-900 bg-amber-100 px-2 py-0.5 rounded">📄 บิลที่ #${order.id || (index + 1)}</span>
                        <span class="text-xs font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded">📍 ${(order.customer_group || order.group_name || 'ทั่วไป').split(' ')[0]}</span>
                    </div>
                    <table class="w-full text-left">
                        <tbody>${itemsHtml}</tbody>
                    </table>
                    <div class="flex justify-between pt-1 text-xs font-bold border-t border-slate-100">
                        <span>ยอดรวม:</span>
                        <span class="text-emerald-600 text-sm">${billTotal.toLocaleString()} บาท</span>
                    </div>
                </div>
            `;
        });

        document.getElementById('summaryCount').textContent = `${filtered.length} บิล`;
        document.getElementById('summaryTotal').textContent = `${total.toLocaleString()} บาท`;
    }
</script>
</body>
</html>
