<!--
  ========================================
  [File Note]
  - File Name: confirmorder_select.html
  - Fix: ปรับคู่ราคาใหม่ตามความจริง
         - Group 1 (ชาวบ้าน)     -> price_1
         - Group 2 (นักท่องเที่ยว) -> price_2
         - Group 3 (สบายดี)      -> price_3
  ========================================
-->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>รายการที่เลือกไว้แล้ว</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent;
            font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
        }

        .cart-preview-box {
            background-color: #ffffff;
            border: 2px dashed #16a34a;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            height: 100%;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .cart-preview-header {
            flex-shrink: 0;
        }

        .scrollable-items {
            flex: 1;
            overflow-y: auto;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            padding-right: 2px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .cart-item-row:last-child {
            border-bottom: none;
        }

        .delete-btn {
            color: #ef4444;
            font-weight: bold;
            font-size: 16px;
            padding: 0 4px;
            cursor: pointer;
            line-height: 1;
            border: none;
            background: transparent;
        }

        .delete-btn:hover {
            color: #b91c1c;
        }
    </style>
</head>
<body>

    <div class="cart-preview-box">
        <div class="cart-preview-header flex justify-between items-center mb-2 pb-2 border-b border-dashed border-green-300">
            <div class="font-bold text-green-700 text-sm flex items-center gap-1.5">
                📋 รายการที่เลือกไว้แล้ว
            </div>
            <div id="cartTotalPrice" class="font-black text-red-600 text-sm">รวม 0.-</div>
        </div>
        
        <div class="scrollable-items">
            <div id="cartPreviewList" class="flex flex-col">
                <span class="text-gray-400 text-xs py-4 text-center block">⏳ กำลังโหลดรายการ...</span>
            </div>
        </div>
    </div>

    <script src="key.js"></script>
    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let dbFoodsMap = {}; 
        let isDeliveryFeeWaived = false;

        let locationData = {
            groupId: '1',
            groupName: '',
            phone: '',
            locationName: '',
            zoneName: ''
        };

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'LOCATION_DATA_UPDATE') {
                locationData = event.data;
                renderOrderSummary();
            }
        });

        window.addEventListener('DOMContentLoaded', async () => {
            await fetchLatestFoods();
            renderOrderSummary();
        });

        async function fetchLatestFoods() {
            try {
                if (typeof supabaseClient !== 'undefined') {
                    const { data, error } = await supabaseClient.from('foods').select('*');
                    if (error) throw error;
                    if (data) {
                        dbFoodsMap = {};
                        data.forEach(f => {
                            dbFoodsMap[String(f.id)] = f;
                        });
                    }
                }
            } catch (err) {
                console.error('Error fetching foods:', err);
            }
        }

        // ฟังก์ชันดึงราคาตามเงื่อนไขใหม่ที่ถูกต้อง
        function getGroupBasePrice(item, groupId) {
            // 1. ถ้าระบุราคาพิเศษเฉพาะจานเองจาก Pop-up ให้ใช้ราคานั้นเป็นอันดับแรก
            const hasCustomPrice = item.isCustomPrice || item.is_custom_price;
            const customPriceVal = Number(item.price !== undefined ? item.price : item.custom_price);

            if (hasCustomPrice && customPriceVal > 0) {
                return customPriceVal;
            }

            const gId = Number(groupId) || 1;
            const fId = String(item.food_id);
            const foodObj = dbFoodsMap[fId];

            if (foodObj) {
                const pLocal = Number(foodObj.price_1 || 0);    // price_1 = ชาวบ้าน
                const pTourist = Number(foodObj.price_2 || 0);  // price_2 = นักท่องเที่ยว
                const pSabaidee = Number(foodObj.price_3 || 0); // price_3 = สบายดี

                // 2. จับคู่ราคาตาม Group ID
                if (gId === 1) { 
                    // กลุ่มชาวบ้าน -> ใช้ price_1
                    return pLocal > 0 ? pLocal : pTourist;
                } else if (gId === 2) { 
                    // กลุ่มนักท่องเที่ยว -> ใช้ price_2
                    return pTourist > 0 ? pTourist : pLocal;
                } else if (gId === 3) { 
                    // กลุ่มสบายดี -> ใช้ price_3
                    return pSabaidee > 0 ? pSabaidee : pLocal;
                }
            }

            // Fallback กรณีหาใน dbFoodsMap ไม่พบ
            return Number(item.price || 0);
        }

        function removeDeliveryFee() {
            isDeliveryFeeWaived = true;
            renderOrderSummary();
        }

        function renderOrderSummary() {
            cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            const currentGroupId = Number(locationData.groupId) || 1;
            const selectedLoc = locationData.locationName || '';

            const totalItems = cart.length;
            const totalQty = cart.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
            
            const listContainer = document.getElementById('cartPreviewList');
            if (!listContainer) return;

            if (cart.length === 0) {
                listContainer.innerHTML = '<span class="text-gray-400 text-xs py-8 text-center block">ไม่มีรายการอาหารในตะกร้า</span>';
                document.getElementById('cartTotalPrice').textContent = 'รวม 0.-';
                
                notifyParent(0, 0, 0, 0, []);
                return;
            }

            let totalCartPrice = 0;
            listContainer.innerHTML = '';

            const processedCart = cart.map(item => {
                const basePrice = getGroupBasePrice(item, currentGroupId);
                const eggCost = (Number(item.khaiDaoQty || item.fried_egg || 0)) * 10;
                const omeletCost = (Number(item.khaiJiaoQty || item.omelet || 0)) * 10;
                const unitPrice = basePrice + eggCost + omeletCost;
                const itemTotalPrice = unitPrice * (Number(item.qty) || 1);

                totalCartPrice += itemTotalPrice;

                let details = [];
                const hasCustomPrice = item.isCustomPrice || item.is_custom_price;
                if (hasCustomPrice && basePrice > 0) {
                    details.push(`⭐ ราคาพิเศษ ${basePrice}.-`);
                }
                if (item.khaiDaoQty > 0 || item.fried_egg > 0) details.push(`ไข่ดาว`);
                if (item.khaiJiaoQty > 0 || item.omelet > 0) details.push(`ไข่เจียว`);
                if (item.note) details.push(item.note);

                const detailsText = details.length > 0 ? ` (${details.join(', ')})` : '';

                const row = document.createElement('div');
                row.className = 'cart-item-row';
                row.innerHTML = `
                    <div class="flex-1 pr-2">
                        <div class="font-bold text-xs text-slate-800">
                            ${item.name}<span class="text-amber-600 font-medium ml-1">${detailsText}</span>
                        </div>
                        <div class="text-[11px] text-slate-500">${unitPrice} x ${item.qty}</div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-extrabold text-xs text-slate-800">${itemTotalPrice}.-</span>
                        <button type="button" onclick="removeItem(${cart.indexOf(item)})" class="delete-btn">&times;</button>
                    </div>
                `;
                listContainer.appendChild(row);

                return {
                    ...item,
                    price: basePrice,
                    unit_price: unitPrice
                };
            });

            let deliveryFee = 0;
            const isStoreFront = selectedLoc.includes('หน้าร้าน');
            if (currentGroupId === 2 && !isStoreFront && !isDeliveryFeeWaived) {
                if (totalCartPrice < 300) {
                    deliveryFee = 20;
                }
            }

            if (deliveryFee > 0) {
                const deliveryRow = document.createElement('div');
                deliveryRow.className = 'cart-item-row bg-amber-50/60 p-2 rounded-xl my-1 border border-amber-100';
                deliveryRow.innerHTML = `
                    <div class="flex-1 pr-2 flex items-center gap-1">
                        <span class="text-sm">🛵</span>
                        <div>
                            <div class="font-bold text-xs text-amber-900">ค่าบริการจัดส่ง <span class="text-[10px] text-amber-600 font-normal">(สั่งไม่ถึง 300.-)</span></div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-extrabold text-xs text-amber-900">${deliveryFee}.-</span>
                        <button type="button" onclick="removeDeliveryFee()" class="delete-btn" title="ยกเลิกค่าจัดส่ง">&times;</button>
                    </div>
                `;
                listContainer.appendChild(deliveryRow);
            }

            const grandTotal = totalCartPrice + deliveryFee;
            document.getElementById('cartTotalPrice').textContent = `รวม ${grandTotal}.-`;

            notifyParent(totalItems, totalQty, totalCartPrice, deliveryFee, processedCart);
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderOrderSummary();
        }

        function notifyParent(itemsCount, totalQty, subtotal, deliveryFee, processedCart) {
            window.parent.postMessage({
                type: 'CART_SUMMARY_UPDATE',
                itemsCount,
                totalQty,
                subtotal,
                deliveryFee,
                grandTotal: subtotal + deliveryFee,
                processedCart
            }, '*');
        }
    </script>
</body>
</html>
